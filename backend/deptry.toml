# deptry config for the backend (https://deptry.com/usage/). Kept in its own file because
# pyproject.toml's [project] table declares no dependencies, which would make deptry ignore
# the requirements files (https://deptry.com/supported-dependency-managers/).
# Run: scripts/guards/check_deptry.py   (push-stage pre-commit hook `guard-deptry`).
[tool.deptry]
known_first_party = ["app", "alembic", "tests"]
requirements_files = ["requirements.txt", "requirements-nodeps.txt"]
requirements_files_dev = ["requirements-dev.txt", "requirements-test.txt"]
extend_exclude = ["venv", "tests"]

[tool.deptry.package_module_name_map]
# deptry maps package -> module through installed metadata and falls back to the package
# name when the package is not installed (the pre-commit hook env installs only deptry), so
# every package whose import name differs is listed here. pyannote.audio is a git URL that
# deptry's requirements parser skips; its `pyannote` namespace is claimed by pyannote-core.
python-multipart = "multipart"
opensearch-py = "opensearchpy"
python-docx = "docx"
smbprotocol = ["smbclient", "smbprotocol"]
pyannote-core = "pyannote"
python3-saml = "onelogin"
fpdf2 = "fpdf"
speechmatics-batch = "speechmatics"
ffmpeg-python = "ffmpeg"
python-dotenv = "dotenv"
deepgram-sdk = "deepgram"
azure-cognitiveservices-speech = "azure"
google-cloud-speech = "google"
python-json-logger = "pythonjsonlogger"
fonttools = "fontTools"
pyexiftool = "exiftool"
"pyannote.audio" = "pyannote"

[tool.deptry.per_rule_ignores]
# DEP002 (declared, never imported). requirements.txt doubles as a lock: it deliberately
# pins transitive dependencies so the venv and the image cannot resolve different patch
# releases (issue #492, enforced by the dependency-parity gate). Those pins are never
# imported by us, so they are listed below. Everything else listed is a direct dependency
# that is loaded at runtime by name, as an extra, or from a CLI/script.
DEP002 = [
  "google-api-core",  # via google-cloud-speech; its `google` namespace is claimed by google-cloud-speech
  "google-auth",  # via google-api-core
  "googleapis-common-protos",  # via google-api-core
  "protobuf",  # via google-api-core, opensearch-protobufs
  "pyannote.audio",  # git-pinned fork loaded by the diarization engine; lazy imports under `pyannote`
  "pyannote-metrics",  # via pyannote.audio
  "pyannote-pipeline",  # via pyannote.audio
  "whisperx",  # installed --no-deps from requirements-nodeps.txt; imported lazily via model_download / worker engine
  "gliner",  # installed --no-deps (requirements-nodeps.txt); imported in scripts/model_download/redaction.py and by presidio at runtime
  "python-multipart",  # FastAPI form/upload parsing imports it at request time (module name `multipart`)
  "uharfbuzz",  # optional text-shaping backend loaded by fpdf2 for transcript PDFs
  "bcrypt",  # passlib bcrypt backend, selected by scheme name at runtime; pinned <5 (see requirements.txt)
  "email-validator",  # pydantic EmailStr backend, imported by pydantic itself
  "flower",  # Celery monitoring UI started as `celery flower` by the compose flower service
  "onnxruntime-gpu",  # ONNX provider for pyannote/diarization, loaded by name; scripts/ import onnxruntime
  "onnxruntime",  # CPU fallback of onnxruntime-gpu on non-linux/non-x86_64 hosts
  "onnxscript",  # ONNX export tooling invoked from app/transcription/native_provision.py
  "onnxslim",  # ONNX export tooling invoked from app/transcription/native_provision.py
  "onnxconverter-common",  # ONNX export tooling invoked from app/transcription/native_provision.py
  "en_core_web_sm",  # spaCy model package loaded by name via spacy.load / Presidio NlpEngineProvider
  "grpcio-status",  # google-api-core[grpc] extra (google-cloud-speech ASR provider)
  "brotli",  # yt-dlp[default] extra (content-encoding decode)
  "pycryptodomex",  # yt-dlp[default] extra (HLS AES decryption)
  "httptools",  # uvicorn[standard] extra, picked by uvicorn at startup
  "uvloop",  # uvicorn[standard] extra, picked by uvicorn at startup
  "watchfiles",  # uvicorn[standard] extra, used by --reload in dev
  # transitive version pins (issue #492); `Required-by` shown
  "websockets",  # via rb=[assemblyai, deepgram-sdk
  "amqp",  # via rb=[kombu
  "torchcodec",  # via rb=[pyannote-audio, whisperx
