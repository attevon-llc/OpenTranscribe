# OpenTranscribe Base Configuration
# This file contains common configuration for all environments
#
# Usage:
#   Development:   docker compose up (auto-loads docker-compose.override.yml)
#   Production:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Offline:       docker compose -f docker-compose.yml -f docker-compose.offline.yml up

services:
  postgres:
    container_name: opentranscribe-postgres
    image: postgres:17.5-alpine
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # Performance tuning for transcription workloads (2500+ files, 1M+ segments)
    # All values configurable via .env, defaults tuned for 4-8GB RAM + SSD storage
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      -c max_connections=${PG_MAX_CONNECTIONS:-200}
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=100
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      # Loopback-only: infra is reached over the compose network (postgres:5432);
      # the host port is for local tooling/tests only — never expose it externally.
      - "127.0.0.1:${POSTGRES_PORT:-5176}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Grace for a fresh bind-mount initdb (cluster create + WAL setup). Without
      # this, a slow first-init crosses the retries×interval window, postgres is
      # marked unhealthy, and compose aborts every service that depends_on it.
      start_period: 60s

  minio:
    container_name: opentranscribe-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    volumes:
      - minio_data:/data
    ports:
      # Loopback-only (reached internally as minio:9000). Host ports for local use.
      - "127.0.0.1:${MINIO_PORT:-5178}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-5179}:9001"
    environment:
      # Server-side encryption at rest (AES-256-GCM)
      # Auto-encrypts all new objects. Existing unencrypted objects remain readable.
      # Key format: <key-name>:<base64-encoded-32-byte-key>
      # Generate with: echo "opentranscribe-key:$(openssl rand -base64 32)"
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY:-}
      - MINIO_KMS_AUTO_ENCRYPTION=${MINIO_KMS_AUTO_ENCRYPTION:-off}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 10
      # Grace for first-boot bucket/IAM reconciliation on a large bind-mounted
      # data dir (the real media volume can be hundreds of GB).
      start_period: 60s

  redis:
    container_name: opentranscribe-redis
    image: redis:8.2.2-alpine3.22
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback-only (reached internally as redis:6379).
      - "127.0.0.1:${REDIS_PORT:-5177}:6379"
    volumes:
      - redis_data:/data
    # Use password if REDIS_PASSWORD is set in .env
    command: >
      sh -c "if [ -n \"$REDIS_PASSWORD\" ]; then
        redis-server --requirepass \"$REDIS_PASSWORD\";
      else
        redis-server;
      fi"
    healthcheck:
      test: >
        sh -c "if [ -n \"$REDIS_PASSWORD\" ]; then
          redis-cli -a \"$REDIS_PASSWORD\" ping;
        else
          redis-cli ping;
        fi"
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    container_name: opentranscribe-opensearch
    image: opensearchproject/opensearch:3.4.0
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Neural search requires substantially more heap than the 1 GB
      # OpenSearch default. The ML plugin sizes its `neural_search` JVM
      # circuit breaker at ~10% of total heap, so:
      #   1 GB heap → 102 MB breaker → all models fail to load
      #   2 GB heap → 204 MB breaker → all-MiniLM-L6-v2 (240 MB) marginal
      #   4 GB heap → 410 MB breaker → comfortable for all default models
      # 4 GB is the recommended minimum once neural search is enabled.
      # Override with OPENSEARCH_JAVA_OPTS env var (e.g. for systems with
      # limited RAM, set -Xms2g -Xmx2g and use a smaller embedding model
      # like all-MiniLM-L6-v2 explicitly).
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms4g -Xmx4g}"
      - DISABLE_SECURITY_PLUGIN=true
      # Disk watermarks as ABSOLUTE free-space bytes, not percentages. The
      # defaults (85/90/95% of the whole disk) misfire on a large shared
      # drive: the host can sit at 93% used with >100 GB free while the
      # OpenSearch data dir holds a few GB, tripping flood-stage and marking
      # every index read_only_allow_delete (audit writes 429'd). "Act only
      # when actual free space is low" is the correct dev-box semantics.
      - cluster.routing.allocation.disk.watermark.low=30gb
      - cluster.routing.allocation.disk.watermark.high=20gb
      - cluster.routing.allocation.disk.watermark.flood_stage=10gb
      # ML Commons settings for neural search (CPU-based embedding inference)
      - plugins.ml_commons.only_run_on_ml_node=false
      - plugins.ml_commons.native_memory_threshold=99
      - plugins.ml_commons.model_access_control_enabled=false
      - plugins.ml_commons.allow_registering_model_via_url=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      # Pre-downloaded neural search models for offline deployments
      - ${MODEL_CACHE_DIR:-./models}/opensearch-ml:/ml-models:ro
    ports:
      # Loopback-only (reached internally as opensearch:9200).
      - "127.0.0.1:${OPENSEARCH_PORT:-5180}:9200"
      - "127.0.0.1:${OPENSEARCH_ADMIN_PORT:-5181}:9600"
    healthcheck:
      # `-f` is required, not cosmetic: without it curl exits 0 on ANY HTTP
      # response, so this reported healthy for an OpenSearch that was up and
      # erroring. Measured on the live container: a request returning HTTP 400
      # exits 0 without `-f` and 22 with it. It matters most in production,
      # where OPENSEARCH_SECURITY_ENABLED makes `/` return 401 to an
      # unauthenticated probe — which the old form would have called healthy.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      # Grace for JVM boot + shard recovery so boot-time probe failures don't
      # burn the retry budget on a large existing index.
      start_period: 60s

  backend:
    container_name: opentranscribe-backend
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # Backend handles API requests only - except the search embedding model
    # which is loaded for query-time vector search. AI processing in celery-worker.
    volumes:
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      # RAG chat loads a CPU cross-encoder here to rerank retrieval results.
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      # Shared scratch for cross-worker preprocessed-WAV handoff
      - pipeline_scratch:/scratch/opentranscribe
    ports:
      - "${BACKEND_PORT:-5174}:8080"
    environment:
      # Internal Docker network settings (hardcoded for service-to-service communication)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      # Container paths (hardcoded for internal use)
      - MODELS_DIRECTORY=/app/models
      - MODEL_BASE_DIR=/app/models
      - TEMP_DIR=/app/temp
      # Version. The bare `- APP_VERSION` form passed the HOST's value, and a real
      # deployment has no host value: only opentr.sh (a git checkout) exports it.
      # Compose then injected APP_VERSION="" and OVERRODE the value baked into the
      # image by --build-arg, so every production container reported its version as
      # "unknown" — the exact bug the build-arg exists to prevent, defeated one
      # layer further out.
      #
      # ${APP_VERSION:-} would inject an empty string just the same. The image's
      # ENV must survive, so this is only set when the host actually has a value,
      # which is what dev needs (bind-mounted source against a possibly stale
      # image). docker-compose.override.yml supplies it for dev.
      #
      # Verified: image baked v0.5.0, running container reported empty.

    healthcheck:
      # --connect-timeout 2 --max-time 4 makes curl fail FAST (exit 7) when the
      # backend isn't listening yet, instead of hanging until docker kills it
      # with exit -1 "Health check exceeded timeout". The timeout-kill exit
      # path is mis-handled by compose's dependency tracker during start_period
      # and was causing "dependency failed to start: container is unhealthy"
      # errors even with start_period=600s. Clean exit 7 is treated correctly
      # as a "not ready yet" signal while the container is still in start_period.
      test: ["CMD", "curl", "-sf", "--connect-timeout", "2", "--max-time", "4", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      # start_period must be long enough to cover the worst-case startup:
      #   - Alembic running 45+ migrations against a populated v0.3.x → 0.4.x
      #     upgrade DB (can take 2-5 min on cold caches and slow disks)
      #   - PyAnnote model warm preload (15-30s)
      #   - OpenSearch neural ML model deploy (10-20s)
      #   - Cold sentence-transformers / HF model download on first run
      # 300s was insufficient on release-test Scenario B (v0.3.3 → 0.4.0 upgrade
      # with full migration chain); dependent services (celery workers, frontend)
      # were skipped because compose gave up waiting on backend. 600s gives real
      # users doing their first in-place upgrade enough headroom while still
      # failing fast on a genuinely broken backend.
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  celery-worker:
    container_name: opentranscribe-celery-worker
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery worker --loglevel=info -Q gpu --pool=${GPU_WORKER_POOL:-threads} --concurrency=${GPU_CONCURRENT_REQUESTS:-1} --max-tasks-per-child=${GPU_MAX_TASKS:-100000} --hostname gpu-transcription@%h -E
    # GPU configuration is provided by docker-compose.gpu.yml overlay
    # when NVIDIA GPU is detected (automatically handled by opentr.sh)
    # This allows the base file to work on macOS and CPU-only Linux systems
    volumes:
      # Model cache directories - must be owned by UID 1000 on host
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # Shared scratch — reads the preprocessed WAV that the CPU worker staged
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
    environment:
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MODELS_DIRECTORY=/app/models
      - MODEL_BASE_DIR=/app/models
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
      # Per-container batch size override (default worker is typically a smaller GPU)
      - BATCH_SIZE=${GPU_DEFAULT_BATCH_SIZE:-auto}
      # Signal to celery.py preload_models() that this is a GPU worker.
      # Without this, ALL workers preload Whisper + PyAnnote onto GPU (~15GB wasted).
      - PRELOAD_GPU_MODELS=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d gpu-transcription@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold first-run WhisperX + PyAnnote preload (and HF download) can exceed 40s.
      start_period: 120s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-download-worker:
    container_name: opentranscribe-celery-download-worker
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery worker --loglevel=info -Q download --concurrency=${DOWNLOAD_CONCURRENCY:-5} --max-tasks-per-child=${DOWNLOAD_MAX_TASKS:-10} --hostname media-downloader@%h -E
    volumes:
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
    environment:
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d media-downloader@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-cpu-worker:
    container_name: opentranscribe-celery-cpu-worker
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # Compute-bound queues only. cloud-asr runs on its own container
    # (celery-cloud-asr-worker) so long-running network-bound cloud
    # transcription tasks cannot head-of-line-block postprocess.
    command: celery -A app.core.celery worker --loglevel=info -Q cpu,utility,cpu-transcribe --concurrency=${CPU_WORKER_CONCURRENCY:-8} --max-tasks-per-child=20 --hostname cpu-processor@%h -E
    volumes:
      # Sentence tokenizer corpora. THIS WORKER CHUNKS TRANSCRIPTS (issue #436) —
      # without the mount, punkt is absent and every chunk it writes is cut by the
      # regex fallback, which splits on abbreviations punkt keeps intact. The two
      # splitters disagree, so a missing mount here silently produces different
      # boundaries from any worker that has it.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      # Shared scratch — writes the preprocessed WAV for GPU/embedding workers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
    environment:
      - PRELOAD_CPU_WHISPER=true
      # ffmpeg preprocess threading (opt-in CPU-contention control; default off).
      # Default 0 = ffmpeg auto/unbounded (no change). On low-core/co-tenant
      # machines set FFMPEG_THREADS=auto (= cores // concurrency) or a small int
      # to avoid oversubscription. Worker needs CPU_WORKER_CONCURRENCY for "auto".
      - CPU_WORKER_CONCURRENCY=${CPU_WORKER_CONCURRENCY:-8}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-0}
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d cpu-processor@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      # PRELOAD_CPU_WHISPER model load can exceed 40s on first run.
      start_period: 120s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Content redaction detection — dedicated, independently-scalable CPU service.
  # Only this worker loads the PII (Presidio+GLiNER) and toxicity models. No GPU.
  # Scale via REDACTION_CONCURRENCY / replicas (decoupled from the GPU pipeline).
  #
  # Single-machine politeness: redaction is a BACKGROUND post-step (the user already
  # has their transcript). To avoid CPU thrashing with the transcription pipeline and
  # other workers on one box, it runs at lower OS priority (`nice`) so it yields under
  # contention, and PyTorch intra-op threads are capped (REDACTION_TORCH_THREADS) so a
  # single inference can't grab all cores. On a dedicated AWS/K8s node, raise both
  # REDACTION_TORCH_THREADS and REDACTION_CONCURRENCY (or add replicas) for full speed.
  celery-redaction:
    container_name: opentranscribe-celery-redaction
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: nice -n ${REDACTION_NICE:-10} celery -A app.core.celery worker --loglevel=info -Q redaction --pool=${REDACTION_WORKER_POOL:-threads} --concurrency=${REDACTION_CONCURRENCY:-2} --max-tasks-per-child=${REDACTION_MAX_TASKS:-200} --hostname redaction@%h -E
    volumes:
      # HuggingFace cache holds the GLiNER PII + toxicity model weights.
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
    environment:
      # Only this worker preloads the redaction models (Presidio+GLiNER, toxicity).
      - PRELOAD_REDACTION_MODELS=true
      - REDACTION_CONCURRENCY=${REDACTION_CONCURRENCY:-2}
      # Cap PyTorch/BLAS intra-op threads so one inference can't peg all cores on a
      # shared single machine. Raise on a dedicated node. (Must be set before import.)
      - OMP_NUM_THREADS=${REDACTION_TORCH_THREADS:-8}
      - MKL_NUM_THREADS=${REDACTION_TORCH_THREADS:-8}
      # auto = use GPU automatically when it has free VRAM (checked at runtime, no
      # restart), else CPU. The GPU overlay gives this worker a visible device.
      - REDACTION_DEVICE=${REDACTION_DEVICE:-auto}
      - REDACTION_PII_USE_GLINER=${REDACTION_PII_USE_GLINER:-false}
      # Internal Docker network settings (same as other workers)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d redaction@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-cloud-asr-worker:
    # Dedicated worker for cloud ASR provider tasks (Deepgram, AssemblyAI,
    # Google, AWS, etc.). These are long-running network-bound jobs; giving
    # them their own pool with higher concurrency avoids them blocking the
    # latency-sensitive postprocess / waveform / utility work on the main
    # CPU worker. Phase 2 of the timing audit plan — item 17.
    container_name: opentranscribe-celery-cloud-asr-worker
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery worker --loglevel=info -Q cloud-asr --concurrency=${CLOUD_ASR_CONCURRENCY:-16} --max-tasks-per-child=50 --hostname cloud-asr@%h -E
    volumes:
      # Shared scratch — cloud-ASR speaker embedding reads the temp WAV
      - pipeline_scratch:/scratch/opentranscribe
    environment:
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d cloud-asr@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-nlp-worker:
    container_name: opentranscribe-celery-nlp-worker
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery worker --loglevel=info -Q nlp,celery --concurrency=${NLP_CONCURRENCY:-4} --max-tasks-per-child=${NLP_MAX_TASKS:-50} --hostname ai-nlp@%h -E
    volumes:
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d ai-nlp@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Wait for backend (migrations applied) like every other worker, so the nlp
    # worker doesn't race the schema on first start.
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-embedding-worker:
    container_name: opentranscribe-celery-embedding-worker
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # Dedicated embedding worker: concurrency=1 keeps one model loaded in memory.
    # Same pattern as GPU worker - sequential processing, model stays warm.
    # High max-tasks-per-child avoids model reload overhead.
    command: celery -A app.core.celery worker --loglevel=info -Q embedding --concurrency=1 --max-tasks-per-child=500 --hostname search-indexer@%h -E
    volumes:
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # Sentence tokenizer corpora. THIS WORKER CHUNKS TRANSCRIPTS (issue #436) —
      # without the mount, punkt is absent and every chunk it writes is cut by the
      # regex fallback, which splits on abbreviations punkt keeps intact. The two
      # splitters disagree, so a missing mount here silently produces different
      # boundaries from any worker that has it.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      # Shared scratch — so embedding worker can use the temp WAV if needed
      - pipeline_scratch:/scratch/opentranscribe
    environment:
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d search-indexer@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Embedding model load can exceed 40s on first run.
      start_period: 120s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    container_name: opentranscribe-celery-beat
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery beat --loglevel=info
    environment:
      # Internal Docker network settings (same as backend)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    healthcheck:
      # Liveness = "the schedule store was written recently". Take the NEWEST
      # mtime across celerybeat-schedule*, not the base file alone.
      #
      # Beat's PersistentScheduler uses `shelve`, whose default backend became
      # `dbm.sqlite3` in Python 3.13 (this image runs 3.13). SQLite runs in WAL
      # mode, so writes land in `-wal` and the base file's mtime only moves on
      # checkpoint. Probing the base file alone therefore reported UNHEALTHY on a
      # beat that was dispatching tasks every minute — observed FailingStreak=627
      # with the base file 19,162 s stale and `-wal` 86 s old. A version bump
      # silently turned a working check into one that can never pass.
      #
      # `not files` is load-bearing: max() over an empty glob would otherwise
      # raise, and an earlier draft that defaulted it would have made the probe
      # pass when the schedule store did not exist at all — the opposite defect,
      # and the harder one to notice.
      test: ["CMD-SHELL", "python3 -c 'import glob,os,time,sys; files=glob.glob(\"/app/celerybeat-schedule*\"); sys.exit(1 if not files else (0 if time.time()-max(os.path.getmtime(f) for f in files)<300 else 1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Phase 4 multi-GPU split workers ──────────────────────────────────────
  # Activated only with the gpu-split Docker Compose profile.
  # Enable with ENGINE_GPU_SPLIT=true and start with:
  #   docker compose --profile gpu-split up -d
  # GPU device assignment is controlled via GPU_TRANSCRIBE_DEVICE_ID /
  # GPU_DIARIZE_DEVICE_ID.  GPU reservation (deploy.resources.reservations)
  # must be added via an overlay file (see docker-compose.gpu.yml pattern).

  celery-worker-gpu-transcribe:
    container_name: ${COMPOSE_PROJECT_NAME:-opentranscribe}-celery-worker-gpu-transcribe
    profiles:
      - gpu-split
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery worker --loglevel=info -Q gpu-transcribe --pool=${GPU_WORKER_POOL:-threads} --concurrency=${GPU_CONCURRENT_REQUESTS:-1} --max-tasks-per-child=${GPU_MAX_TASKS:-100000} --hostname gpu-transcribe@%h -E
    volumes:
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MODELS_DIRECTORY=/app/models
      - MODEL_BASE_DIR=/app/models
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
      - BATCH_SIZE=${GPU_DEFAULT_BATCH_SIZE:-auto}
      - PRELOAD_GPU_MODELS=true
      # docker-compose.gpu-split.yml reserves the host GPU (GPU_TRANSCRIBE_DEVICE_ID)
      # for this worker; docker maps that reserved card to index 0 in the container,
      # so we always select index 0 here (matches the gpu-scale pattern).
      - CUDA_VISIBLE_DEVICES=0
      - ENGINE_GPU_SPLIT=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d gpu-transcribe@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold GPU model preload can exceed 40s on first run.
      start_period: 120s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-gpu-diarize:
    container_name: ${COMPOSE_PROJECT_NAME:-opentranscribe}-celery-worker-gpu-diarize
    profiles:
      - gpu-split
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: celery -A app.core.celery worker --loglevel=info -Q gpu-diarize --pool=${GPU_WORKER_POOL:-threads} --concurrency=${GPU_CONCURRENT_REQUESTS:-1} --max-tasks-per-child=${GPU_MAX_TASKS:-100000} --hostname gpu-diarize@%h -E
    volumes:
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MODELS_DIRECTORY=/app/models
      - MODEL_BASE_DIR=/app/models
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
      - BATCH_SIZE=${GPU_DEFAULT_BATCH_SIZE:-auto}
      - PRELOAD_GPU_MODELS=true
      # docker-compose.gpu-split.yml reserves the host GPU (GPU_DIARIZE_DEVICE_ID)
      # for this worker; docker maps that reserved card to index 0 in the container,
      # so we always select index 0 here (matches the gpu-scale pattern).
      - CUDA_VISIBLE_DEVICES=0
      - ENGINE_GPU_SPLIT=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d gpu-diarize@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold GPU model preload can exceed 40s on first run.
      start_period: 120s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # GPU Scaled Worker - Base definition
  # Activated only with --gpu-scale flag via docker-compose.gpu-scale.yml overlay
  # GPU configuration (deploy.resources.reservations) is provided by gpu-scale.yml
  # Image/build/volumes provided by override.yml (dev) or prod.yml/offline.yml
  celery-worker-gpu-scaled:
    container_name: ${COMPOSE_PROJECT_NAME:-opentranscribe}-celery-worker-gpu-scaled
    profiles:
      - gpu-scale  # Only activated with --gpu-scale flag
    scale: 0  # Disabled by default, gpu-scale.yml sets scale: 1
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    environment:
      # Internal Docker network settings (same as other workers)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MODELS_DIRECTORY=/app/models
      - MODEL_BASE_DIR=/app/models
      - TEMP_DIR=/app/temp
      # Small per-worker DB pool (issue #284 A1.5). The coded default is 20 + 40
      # overflow = up to 60 connections PER PROCESS; across ~10 worker services that
      # is ~600 against a Postgres whose default max_connections is 100. Workers are
      # mostly CPU/GPU-bound and hold a session only briefly, so a small pool is
      # ample. The API keeps the larger default — it is the latency-sensitive one.
      - DB_POOL_SIZE=${WORKER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${WORKER_DB_MAX_OVERFLOW:-3}
    volumes:
      # Shared scratch — reads the preprocessed WAV the CPU worker staged. MUST
      # match the other transcription workers or the scaled worker can't see the
      # handoff and silently falls back to re-downloading from MinIO per file.
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
    tmpfs:
      - /app/temp:noexec,nosuid,size=20g,mode=1777
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: opentranscribe-frontend
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    # Note: ports, healthcheck, and NODE_ENV defined in override files (dev vs prod)
    depends_on:
      backend:
        condition: service_healthy

  flower:
    container_name: opentranscribe-flower
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    command: >
      python -m celery -A app.core.celery flower
      --port=5555
      --url_prefix=${FLOWER_URL_PREFIX:-flower}
      --persistent=True
      --db=/app/temp/flower.db
      --broker=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      --max_tasks=10000
      --natural_time=True
      --auto_refresh=True
      --tasks_columns=name,uuid,state,received,started,runtime,worker,args
      --purge_offline_workers=600
      --queues=gpu,gpu-transcribe,gpu-diarize,download,cpu,nlp,embedding,utility,cloud-asr,cpu-transcribe,redaction,celery
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower}
    ports:
      # Loopback-only: prod reaches Flower through nginx on the compose network;
      # the host port is for local access. Keeps the basic-auth UI off 0.0.0.0.
      - "127.0.0.1:${FLOWER_PORT:-5175}:5555"
    environment:
      - CELERY_BROKER_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      - FLOWER_USER=${FLOWER_USER:-admin}
      - FLOWER_PASSWORD=${FLOWER_PASSWORD:-flower}
      - TEMP_DIR=/app/temp
    depends_on:
      - redis
      - celery-worker
    # Override the backend image's HEALTHCHECK (it probes the API on :8080,
    # which flower doesn't serve — the container reported unhealthy forever).
    # Flower's own /healthcheck endpoint bypasses basic auth; the url_prefix
    # puts it at /flower/healthcheck.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://127.0.0.1:5555/${FLOWER_URL_PREFIX:-flower}/healthcheck || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # Flower only needs somewhere writable for its event DB, not AI models.
      # MUST NOT be mounted at /app: that is the image's application code
      # directory. Docker seeds an empty named volume from the image on first
      # use, so mounting there pinned Flower to that one code snapshot forever —
      # every later rebuild/image pull was silently ignored.
      # /app/temp (already this container's TEMP_DIR) is used rather than a new
      # top-level path because Docker creates a *missing* mount point root-owned,
      # and the image runs as non-root appuser — a fresh volume at e.g. /data is
      # not writable, so --persistent=True would fail on startup.
      - flower_data:/app/temp

  docs:
    container_name: opentranscribe-docs
    restart: always
    security_opt:
      - no-new-privileges:true
    # image, build, ports defined in override files (dev vs prod)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/docs/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  minio_data:
  redis_data:
  opensearch_data:
  flower_data:
  # Shared scratch volume for cross-worker artifact handoff. Holds the
  # preprocessed 16 kHz WAV (one per in-flight file, plus ephemeral
  # derived artifacts). Defaults to a regular disk-backed volume so the
  # stack works on every host; override to tmpfs in an environment
  # overlay (see docker-compose.scratch-tmpfs.yml) for RAM-backed speed.
  # See backend/app/utils/scratch_volume.py for the contract.
  pipeline_scratch:
  transcription-temp:
    driver: local

networks:
  default:
    driver: bridge
