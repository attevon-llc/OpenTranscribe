version: 2
# Low-clutter dependency updates: weekly, but GROUPED so each ecosystem produces a
# single batched PR (not one-per-package) — i.e. one frontend (npm) PR and one
# backend (pip) PR per week, plus a grouped GitHub Actions PR. Known-bad versions
# are ignored. To pause entirely, comment out the `updates:` entries below; to run
# on demand, use the "Check for updates" button on the repo's Dependabot tab.
updates:
  # Frontend — one grouped PR
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # svelte 5.56.x has a parser regression (declaration_tag_invalid_type on a
      # plain ternary expression). Pinned to ~5.55.5 until upstream patches it.
      - dependency-name: "svelte"
        versions: ["5.56.x"]
      # vite 8 requires @sveltejs/vite-plugin-svelte >=6; the current plugin (v5)
      # peer-pins vite ^6. Hold the major until the Svelte plugin supports vite 8.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @eslint/js 10 peer-wants eslint ^10, but typescript-eslint still pins
      # eslint 9 — the major broke both pre-commit (ERESOLVE) and the lint job
      # (new v10 recommended rules against the v9 engine). See #234 / #256.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Types major tracks the runtime: bump together with the coordinated
      # node 22 -> 26 upgrade (#234), not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Backend — one grouped PR
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns:
          - "*"
    ignore:
      # torch/torchaudio use local-tag pins (+cpu / +cu128) that dependabot
      # mangles into mismatched, uninstallable pairs across the requirements
      # variants (#257). Managed by hand alongside the CUDA base image.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      # bcrypt 5 removed the __about__ attribute passlib introspects (#234).
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
      # transformers 5 / huggingface-hub 1.x break whisperx + pyannote (#234);
      # bump together once the ASR stack supports them.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
      # websockets 11 -> 16 is a five-major jump touching uvicorn/provider SDK
      # paths; take it deliberately with its own validation, not in a batch.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # speechmatics-batch 0.x minors are potentially breaking and the 0.5.0
      # release ships live-key-verified provider integrations — re-verify with
      # live keys before adopting (#234).
      - dependency-name: "speechmatics-batch"
        versions: ["0.5.x"]

  # CI workflow actions — one grouped PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile base images — infrequent, grouped per service
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-docker:
        patterns:
          - "*"
    ignore:
      # nvidia/pytorch 26.x is not a drop-in for Dockerfile.blackwell: the NGC
      # image dropped torchaudio and the pin capture/restore breaks (#274).
      # Upgrade deliberately with a torchaudio strategy + Blackwell hardware
      # validation, then remove this ignore.
      - dependency-name: "nvidia/pytorch"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-docker:
        patterns:
          - "*"
