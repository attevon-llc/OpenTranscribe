# Document parsing sidecars — the two tiers that cannot run inside a Celery worker.
#
#   ./opentr.sh start dev --with-documents
#
# The document plane is three tiers and only ONE of them is a container (issue #362 /
# #403 Stage 6). Tier 1, the "slim" tier, runs IN-PROCESS in the existing workers and is
# not here at all: it must stay torch-free so the CPU worker and celery-redaction worker
# can both run it (`tests/unit/test_document_slim_tier_is_torch_free.py` is the guard).
# This overlay adds the two that cannot:
#
#   docling-serve  Tier 2 — layout model, table structure, and OCR. Reached only when a
#                  source has no usable text layer (`has_embedded_text=False`). Pulls
#                  torch, which is exactly why it is a sidecar and not a worker import.
#   tika           Tier 3 — legacy OLE2 (.doc/.ppt/.xls) and RTF, which no Docling
#                  backend reads. A JVM, so likewise not importable.
#
# Both are OPTIONAL. With the overlay absent, `DOCUMENT_PARSER_URL` and
# `DOCUMENT_TIKA_URL` stay empty, `registry.get_backend` returns None for those tiers and
# the resolution order falls through to slim — a scan gets a typed "no OCR in this
# deployment" error and a .doc gets "convert to .docx or .pdf first". Neither is a crash.
#
# CPU ONLY, deliberately. docling-serve-cpu is the pinned image and there is no `deploy:`
# GPU reservation anywhere below. GPU 1 is this project's ONLY GPU and belongs to the ASR
# worker; putting OCR on it would contend with transcription for VRAM. OCR is a batch,
# latency-tolerant workload — CPU is the correct place for it.
#
# Images are pinned BY DIGEST, not by tag. `:latest` on a parser is a silent behaviour
# change on the next `docker pull`: the measured coverage numbers in
# `tests/unit/test_document_tika_tier.py` are per-version claims, and a floating tag would
# let them start describing a different program. The tag beside each digest is a comment
# saying which tag the digest was resolved from, not an input.
services:
  docling-serve:
    # ghcr.io/docling-project/docling-serve-cpu:latest as of 2026-08-13.
    image: ghcr.io/docling-project/docling-serve-cpu@sha256:061d35c03611bc15b73d024c8e8387bcf0624279f8b57c16c1567326f214ba56
    container_name: ${DOCLING_SERVE_CONTAINER_NAME:-opentranscribe-docling-serve}
    security_opt:
      - no-new-privileges:true
    environment:
      # Bound the thread pools. Unset, the ONNX/torch runtimes size themselves to every
      # core on the host (48 here) and one OCR job starves the transcription worker it is
      # supposed to be staying out of the way of.
      - OMP_NUM_THREADS=${DOCLING_SERVE_THREADS:-4}
      - MKL_NUM_THREADS=${DOCLING_SERVE_THREADS:-4}
      - DOCLING_SERVE_ENABLE_UI=${DOCLING_SERVE_ENABLE_UI:-false}
    ports:
      # Loopback only. This service converts arbitrary user-supplied bytes with a stack of
      # third-party parsers and has no authentication of any kind, so it must never be
      # reachable off-host. In-network traffic uses http://docling-serve:5001 and does not
      # need this mapping; it is published solely so host-side pytest can drive the tier
      # directly — a mocked sidecar would only prove the mock
      # (tests/unit/test_document_parser_backends.py::TestTheSidecarOcrPath).
      - "127.0.0.1:${DOCLING_SERVE_PORT:-5197}:5001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First request loads the layout + OCR models from the image; cold start is slow and
      # a short start_period marks the container unhealthy while it is merely booting.
      start_period: 180s
    restart: unless-stopped

  tika:
    # apache/tika:latest-full as of 2026-08-13; reports "Apache Tika 3.3.1".
    # The `-full` variant is REQUIRED, not a preference: the default image ships without
    # the POI-backed scientific/office parser set, and OLE2 is the entire reason this tier
    # exists.
    image: apache/tika@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
    container_name: ${TIKA_CONTAINER_NAME:-opentranscribe-tika}
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only, same reasoning as docling-serve above: an unauthenticated extractor
      # for arbitrary bytes. In-network callers use http://tika:9998.
      - "127.0.0.1:${TIKA_PORT:-5198}:9998"
    healthcheck:
      # The image has wget but NOT curl — checked, don't "fix" this to curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9998/version"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Wiring. `registry.get_backend` returns None for a tier whose URL is empty, so
  # setting these is what turns each tier on — the containers above are inert without it.
  #
  # Four services, because these are the four that will hold a parse: the API (synchronous
  # preview/health), the general worker, the CPU worker, and celery-redaction. The GPU
  # transcription workers deliberately get nothing: a document parse queued onto a GPU
  # worker would occupy the one GPU this project has.
  # ---------------------------------------------------------------------------
  backend:
    environment:
      - DOCUMENT_PARSER_URL=http://docling-serve:5001
      - DOCUMENT_TIKA_URL=http://tika:9998

  celery-worker:
    environment:
      - DOCUMENT_PARSER_URL=http://docling-serve:5001
      - DOCUMENT_TIKA_URL=http://tika:9998

  celery-cpu-worker:
    environment:
      - DOCUMENT_PARSER_URL=http://docling-serve:5001
      - DOCUMENT_TIKA_URL=http://tika:9998

  celery-redaction:
    environment:
      - DOCUMENT_PARSER_URL=http://docling-serve:5001
      - DOCUMENT_TIKA_URL=http://tika:9998
