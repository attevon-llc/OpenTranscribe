# Local override to use locally-built images instead of pulling from Docker Hub
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.local.yml up -d

services:
  backend:
    pull_policy: never

  celery-worker:
    pull_policy: never

  celery-download-worker:
    pull_policy: never

  celery-cpu-worker:
    pull_policy: never

  celery-cloud-asr-worker:
    pull_policy: never

  celery-nlp-worker:
    pull_policy: never

  celery-embedding-worker:
    pull_policy: never

  celery-beat:
    pull_policy: never

  flower:
    pull_policy: never

  celery-worker-gpu-scaled:
    pull_policy: never

  # diar-native's `image:` (docker-compose.diar-native.yml) defaults to the published
  # davidamacey/opentranscribe-backend tag same as every other service here — without
  # this, `start prod --build` builds the backend locally but the sidecar still tries to
  # pull that tag from Docker Hub (issue #639-adjacent).
  diar-native:
    pull_policy: never

  frontend:
    pull_policy: never

  docs:
    pull_policy: never
