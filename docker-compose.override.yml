# OpenTranscribe Development Overrides
# This file is AUTOMATICALLY loaded in development (no -f flag needed!)
#
# Usage: Just run `docker compose up` - this file merges with docker-compose.yml
#
# This file contains ONLY development-specific settings:
#   - Build from local Dockerfiles (instead of pulling images)
#   - Mount source code for live reloading
#   - Development-specific commands

# Every service running the backend image must agree on the environment. The app
# defaults ENVIRONMENT to "production" and fails closed (#284 A0.3); this anchor is
# what marks a dev stack as development. This file is NEVER loaded in prod.
x-dev-environment: &dev-environment
  ENVIRONMENT: development

# All 13 backend-image build blocks below build the same image and must agree on
# how — most importantly these args. Dockerfile.prod's APP_VERSION/GIT_SHA ARGs
# default to "unknown"/empty; without args here a stack built from this file
# (including a detached "the image IS the code" measurement stack, #55) cannot
# say which commit produced it, which is the whole point of baking source in
# instead of bind-mounting it. opentr.sh exports both from the environment
# (VERSION file / `git rev-parse --short HEAD`, with a "-dirty" suffix for an
# uncommitted tree). One anchor keeps all 13 blocks in sync — a copy-pasted
# args: block would silently drift as services are added.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile.prod
  args:
    APP_VERSION: ${APP_VERSION:-}
    GIT_SHA: ${GIT_SHA:-}

services:
  # All backend services share the same image to save disk space
  # Image is built once and reused by all backend-based services
  backend:
    image: opentranscribe-backend:latest
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      # Exclude the host's backend/venv/ (docs: `backend/CLAUDE.md`) from the container's
      # view: every backend-image service already has its own venv baked in at
      # /home/appuser/.local (Dockerfile.prod), so the host one is never used here. Without
      # this, `pip install` (or even routine .pyc bytecode writes from running pytest
      # against that venv) into backend/venv looks like a source change to `backend`'s
      # `uvicorn --reload` watcher, forcing a full app reload — which can abandon any
      # in-flight WebSocket connection's DB session mid-transaction, leaking an
      # idle-in-transaction Postgres connection that then blocks schema migrations and
      # anything else touching the same table. Same fix as `frontend`'s /app/node_modules
      # exclusion below.
      - /app/venv
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload  # Enable hot reload
    environment:
      <<: *dev-environment
      # Dev-only security-limit relaxation. The e2e suite performs hundreds of
      # real logins (plus deliberate failed ones) per run; the production
      # limits are security controls, not test gates. This file is NEVER
      # loaded in prod, so deployed stacks keep the strict .env defaults
      # (10/min per IP, lockout after 5 failures). Tune via DEV_* in .env.
      RATE_LIMIT_AUTH_PER_MINUTE: ${DEV_RATE_LIMIT_AUTH_PER_MINUTE:-120}
      ACCOUNT_LOCKOUT_THRESHOLD: ${DEV_ACCOUNT_LOCKOUT_THRESHOLD:-100}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${DEV_ACCOUNT_LOCKOUT_DURATION_MINUTES:-1}
      # Dev bind-mounts source over a possibly stale image, so the image's baked
      # APP_VERSION can be wrong here — opentr.sh exports the value from the
      # VERSION file and this passes it through. The BASE compose deliberately does
      # NOT do this: there it injected an empty string on any deployment without a
      # host value (i.e. every real one) and overrode the correctly baked version,
      # making every production container report "unknown".
      APP_VERSION: ${APP_VERSION:-}

  celery-worker:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers

  celery-download-worker:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch

  celery-cpu-worker:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why

  celery-redaction:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch

  celery-cloud-asr-worker:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why

  celery-nlp-worker:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why

  celery-embedding-worker:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers

  celery-beat:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why

  frontend:
    image: opentranscribe-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev  # Use development Dockerfile
    volumes:
      - ./frontend:/app  # Mount source code for development
      - /app/node_modules  # Exclude node_modules from host mount
      # Exclude SvelteKit's generated dir: host-side `npm run build/check`
      # writes .svelte-kit files from the HOST toolchain into the bind mount,
      # which breaks the container's vite SSR ("Cannot find module '$app/env'").
      - /app/.svelte-kit
    ports:
      - "${FRONTEND_PORT:-5173}:5173"  # Dev Vite server port
    environment:
      - NODE_ENV=development  # Development mode
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  flower:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      # Flower only needs persistent DB storage, not hot-reload source code.
      # Mounted at /app/temp, never /app: a named volume over the image's code
      # directory is seeded once and then pins Flower to stale code forever.
      # See docker-compose.yml for why it isn't a new top-level path.
      - flower_data:/app/temp

  docs:
    image: opentranscribe-docs:latest
    build:
      context: ./docs-site
      dockerfile: Dockerfile
      args:
        # Repo-root VERSION is outside this build context; opentr.sh exports it.
        OT_VERSION: ${APP_VERSION:-}
    ports:
      - "${DOCS_PORT:-5183}:8080"

  # GPU Scaled Worker - Development build (only active with --gpu-scale flag)
  celery-worker-gpu-scaled:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe

  # GPU Split Workers - Development build (only active with COMPOSE_PROFILES=gpu-split)
  # Base provides command/env/healthcheck via the gpu-split profile; these blocks
  # only supply the local image/build/volumes (mirrors celery-worker-gpu-scaled).
  celery-worker-gpu-transcribe:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff

  celery-worker-gpu-diarize:
    image: opentranscribe-backend:latest
    environment:
      <<: *dev-environment
    build:
      <<: *backend-build
    volumes:
      - ./backend:/app  # Mount source code for development
      - /app/venv  # Exclude host backend/venv/ — see the `backend` service above for why
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
