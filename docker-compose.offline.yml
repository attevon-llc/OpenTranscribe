# OpenTranscribe Offline/Airgapped Deployment Overrides
# Use with: docker compose -f docker-compose.yml -f docker-compose.offline.yml up
#
# This file contains ONLY offline deployment-specific settings:
#   - Never pull images (use pre-loaded images)
#   - Offline mode for HuggingFace
#   - Offline-specific volume paths
#
# DELIBERATELY NOT PINNED with ${OT_IMAGE_TAG} IN THIS FILE, unlike
# docker-compose.prod.yml. scripts/build-offline-package.sh does `docker save` on the
# `:latest` tags by default and install-offline-package.sh `docker load`s them back
# under those same tags, so :latest is the only tag that exists inside an air-gapped
# install by default. Interpolating OT_IMAGE_TAG at compose-interpolation time here
# would make compose look for a tag the package never loaded the moment a user's
# .env pins a version. The package version is controlled by which package you
# installed, not by a tag.
#
# When a developer builds a package with OT_IMAGE_TAG set (issue #781/N7), so the
# PULL/SAVE step above targets a specific version rather than whatever ":latest" is
# on Docker Hub that day, build-offline-package.sh's copy_configuration() rewrites the
# `davidamacey/opentranscribe-{backend,frontend,docs}:latest` lines in the COPY it
# ships (config/docker-compose.offline.yml inside the package) to that same tag — so
# the packaged compose file always asks for exactly what was loaded, in EITHER mode.
# This file (the repo template) is never touched; only the packaged copy is.

services:
  postgres:
    pull_policy: never

  minio:
    pull_policy: never

  redis:
    pull_policy: never

  opensearch:
    pull_policy: never

  backend:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    # No volumes needed - temp files live in container only

  celery-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: Use absolute paths for airgapped systems
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # No temp volume needed - temp files live in container only
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-download-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: Use absolute paths for airgapped systems
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-cpu-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: `reindex_transcripts` runs here and splits sentences with punkt.
      # Derived, not guessed — tests/unit/test_compose_sentence_splitter_mounts.py
      # walks the call graph from `split_into_sentences` to the queue that serves it.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-redaction:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: Redaction worker needs the GLiNER PII + toxicity model weights
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-cloud-asr-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    # No volumes needed for cloud-ASR worker (network-bound only)
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-nlp-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: `artifacts.generate_file_facts` splits sentences for the digest,
      # and topic extraction needs the stopwords corpus.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-embedding-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: sentence-transformers model must be pre-cached
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # Offline: `index_transcript_search` runs here and splits sentences with punkt.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-beat:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    # No volumes needed - scheduler state lives in container only

  # Deliberately NO `diar-native` entry here, unlike every other service in this file.
  # `diar-native` the service is declared ONLY by the conditional docker-compose.diar-native.yml
  # overlay — scripts/opentr-offline.sh loads it before this file solely when weights are
  # already present on disk, and windows-installer/run_opentranscribe.bat never loads it
  # at all. This file's `-f` chain is unconditional, so an entry here previously defined
  # `diar-native` on its OWN whenever offline.yml alone was loaded (the Windows path, or
  # any manual `-f docker-compose.yml -f docker-compose.offline.yml`): it carried
  # image/pull_policy/environment but no `command:`, so it inherited the shared backend
  # image's default CMD (uvicorn) instead of `diar-server` — a stray, wrong process
  # starting on every offline install regardless of whether diarization weights exist.
  # Adding the missing `command:` would not have made it correct standalone either: this
  # block also carried no volumes, so even running diar-server it would read an empty
  # `/models` and crash-loop — the /models bind and the pipeline_scratch handoff mount
  # (issue #661 E2: one volume, engine/ and diar/ namespaces, formerly two separate
  # diar-native-tmp/transcription-temp volumes) are declared only in
  # docker-compose.diar-native.yml. A block that can only ever work in combination with
  # that overlay has no reason to exist independently of it, so it is removed rather than
  # patched.
  #
  # When docker-compose.diar-native.yml IS loaded (weights present), its own `image:`
  # already resolves to `davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}`,
  # which is `:latest` on any offline install that leaves OT_IMAGE_TAG unset (the
  # documented default per .env.example) — matching every other hardcoded `:latest`
  # override in this file — plus the correct `command:`, volumes, and healthcheck. This
  # file has nothing left to add. Net effect: no weights/no overlay -> no diar-native
  # service defined at all, which is the correct behavior ("no weights, no sidecar").

  frontend:
    image: davidamacey/opentranscribe-frontend:latest
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-5173}:8080"  # Production NGINX port
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flower:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    ports:
      - "${FLOWER_PORT:-5175}:5555"  # Flower web UI

  docs:
    image: davidamacey/opentranscribe-docs:latest
    pull_policy: never  # Use pre-loaded image — no internet required
    ports:
      - "${DOCS_PORT:-3030}:8080"

  # GPU Scaled Worker - Offline overrides
  # NOTE: No 'scale' parameter here - base has scale: 0, gpu-scale.yml sets scale: 1
  # This overlay only provides offline-specific settings (image, pull_policy, paths)
  celery-worker-gpu-scaled:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never  # Use pre-loaded images (no network access)
    volumes:
      # Offline: Use absolute paths for airgapped systems
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1
