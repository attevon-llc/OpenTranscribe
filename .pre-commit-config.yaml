# Pre-commit hooks configuration for OpenTranscribe
# See https://pre-commit.com for more information

repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^security-reports/
      - id: end-of-file-fixer
        exclude: ^security-reports/
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags in docker-compose
      - id: check-json
        exclude: ^security-reports/
      - id: check-added-large-files
        args: [--maxkb=10240]  # 10MB max file size
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^security-reports/
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Python formatting and linting with Ruff (replaces Black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^backend/
        additional_dependencies:
          - types-requests
          - types-python-dateutil
          - types-pyyaml
          - types-redis
          # py.typed runtime deps the hook's isolated env must see, or their
          # APIs degrade to Any and no-any-return fires in importing code.
          - prometheus-client
          # SQLAlchemy 2.0 ships py.typed — the hook's isolated env needs it so
          # Mapped[...] columns resolve to real types (not Column[Any]); this is
          # what makes the typed-models conversion's type info visible to mypy.
          - sqlalchemy>=2.0
          # joserfc ships py.typed (app/auth/oidc/claims.py, #33) — same reason.
          - joserfc>=1.7.4
        args: [--ignore-missing-imports, --check-untyped-defs]

  # Frontend formatting with Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, yaml, html, css, scss, markdown]
        args: [--write, --ignore-unknown]

  # Frontend type checking and build verification
  - repo: local
    hooks:
      - id: frontend-check
        name: Frontend Build Verification
        entry: scripts/frontend-check.sh
        language: system
        files: ^frontend/src/
        types_or: [svelte, ts, javascript, css, html]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

  # Dockerfile linting — runs hadolint via its official pinned Docker image
  # (language: docker_image), so NO local hadolint binary is required; this is
  # identical in CI and for contributors (both have Docker) and can never fall
  # back to a missing system binary. The previous config used the hadolint repo
  # with language: system + entry: hadolint, which exec'd a local binary that
  # isn't installed in CI — failing every run with "Executable hadolint not
  # found" (the Pre-commit workflow was red on master since Oct 2025 for this).
  # Picks up the repo-root .hadolint.yaml; types:[file] + files matches the
  # Dockerfile.<stage> naming that identify doesn't tag as 'dockerfile'.
  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        language: docker_image
        entry: hadolint/hadolint:v2.12.0 hadolint
        files: Dockerfile.*
        types: [file]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        args: [--verbose, --no-banner]
        exclude: ^security-reports/

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        files: ^backend/
        # --exclude on the CLI, not just [tool.bandit] exclude_dirs: the pyproject
        # glob does NOT reliably match here (the hook runs from the repo root, so paths
        # are `backend/mutants/...`), and bandit walks the FILESYSTEM, so gitignoring
        # mutmut's generated tree is not enough. Without this, a mutation run left ~330k
        # lines of deliberately corrupted source that failed the commit on a finding
        # inside a mutant.
        args: [-c, pyproject.toml, -x, backend/mutants, -r, backend/]
        additional_dependencies: ["bandit[toml]"]

  # Import-linter — enforce the cloud seam direction: the open-source core
  # (`app.*`) must NEVER import the closed-source cloud edition (`cloud`/clerk/
  # stripe). Contract lives in backend/pyproject.toml ([tool.importlinter]).
  # Runs from the backend/ dir (cwd) so import-linter can import the `app`
  # package; uses the project venv binary like the frontend-check hook.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (app must not import cloud)
        # language: python so pre-commit provisions import-linter in its OWN
        # isolated env — the pre-commit CI job installs only `pre-commit` (no
        # backend venv, no project deps), so a hardcoded venv/bin path or a
        # system `lint-imports` would not exist there. bash handles the cd into
        # backend/ so grimp can locate the `app` namespace package; lint-imports
        # resolves from the isolated env's PATH. grimp analyses statically (AST),
        # so the app's runtime deps are NOT required.
        entry: bash -c 'cd backend && lint-imports --config pyproject.toml'
        language: python
        additional_dependencies: ['import-linter>=2.0']
        pass_filenames: false
        files: ^backend/app/.*\.py$

  # Version consistency — VERSION, pyproject.toml, frontend/package.json,
  # frontend/package-lock.json (BOTH version fields), the Alembic single-head
  # invariant, the Dockerfile APP_VERSION build-arg contract, and duplicate
  # docs-site blog slugs must all agree.
  #
  # Exists because the previous process documented "append a row every release"
  # for scripts/release-tests/expected-schemas.tsv and enforced it nowhere — so
  # v0.4.1's row was never added and nobody noticed for four months. A rule with
  # no enforcement is a rule that rots.
  #
  # language: system + python3 because the checker is deliberately stdlib-only
  # (tomllib, json, re) and must also run on a bare CI runner with no venv.
  # CHANGELOG checks are warn-only in `ci` mode: the release bumps VERSION in one
  # commit and writes the CHANGELOG in a later one, so blocking here would make
  # the intermediate commit uncommittable.
  - repo: local
    hooks:
      - id: version-consistency
        name: version consistency (VERSION / pyproject / package.json / alembic)
        entry: python3 scripts/release/check-version-consistency.py --mode ci
        language: system
        pass_filenames: false
        files: ^(VERSION|pyproject\.toml|frontend/package\.json|frontend/package-lock\.json|backend/alembic/versions/.*\.py|backend/Dockerfile\.prod|docs-site/blog/.*\.md)$

  # Test-suite quality gate (issue #431) — finds tests that pass whether the code
  # works or not. The vitest counterpart (`npm run test:audit`) has run in CI since
  # #431; the pytest one, `scripts/audit-tests.py`, was in NEITHER pre-commit NOR CI
  # and appeared only in prose. A gate nothing invokes is documentation.
  #
  # SELF-TEST FIRST, and never reorder these two. The detectors are code, and a
  # detector that silently stops matching reports zero findings — indistinguishable
  # from a clean suite, which is the exact failure this script exists to catch. The
  # frontend sibling's self-test caught two dead detectors that way.
  #
  # language: system + python3 because the auditor is deliberately stdlib-only (ast,
  # json, argparse) and must also run on the bare CI runner, which installs only
  # `pre-commit` — no backend venv, no project deps. Same rationale as
  # version-consistency below.
  #
  # `files:` keeps the ~9 s tree scan off commits that cannot change its outcome; the
  # allowlist is included because deleting a line there must re-verify the finding is
  # really gone (the auditor fails on a stale entry).
  - repo: local
    hooks:
      - id: audit-tests-selftest
        name: audit-tests self-test (every detector must still fire)
        entry: python3 scripts/audit-tests.py --selftest
        language: system
        pass_filenames: false
        files: ^(backend/tests/.*\.py|scripts/audit-tests\.py)$
      - id: audit-tests
        name: audit backend test quality (tests that cannot fail)
        entry: python3 scripts/audit-tests.py backend/tests
        language: system
        pass_filenames: false
        files: ^(backend/tests/.*\.py|backend/tests/audit-allowlist\.txt|scripts/audit-tests\.py)$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # Commit message linting (optional)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-scope]

# Configuration for specific hooks
default_stages: [pre-commit]
fail_fast: false
