# Nginx configuration with PKI/mTLS support
# Used when PKI authentication is enabled

# HTTP server - redirect to HTTPS or serve non-PKI routes
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hide NGINX version in response headers and error pages
    server_tokens off;

    # Set maximum file upload size to 15GB for large video/audio files
    client_max_body_size 15G;

    # Increase timeouts for large file uploads
    client_body_timeout 300s;
    client_header_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Security headers (OWASP recommendations)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    # Content-Security-Policy is delivered via the SvelteKit-generated <meta http-equiv> in
    # index.html (kit.csp hash mode), so the inline SPA bootstrap is hashed and script-src
    # drops 'unsafe-inline'. X-Frame-Options above covers frame-ancestors (invalid in <meta>).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Embedded documentation proxy
    location /docs/ {
        proxy_pass http://docs:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle client-side routing - return index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        # Security headers must be repeated in location blocks with add_header (nginx doesn't inherit)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        # Content-Security-Policy is delivered via the SvelteKit-generated <meta http-equiv> in
    # index.html (kit.csp hash mode), so the inline SPA bootstrap is hashed and script-src
    # drops 'unsafe-inline'. X-Frame-Options above covers frame-ancestors (invalid in <meta>).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Don't cache HTML files
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        # Security headers must be repeated in location blocks with add_header (nginx doesn't inherit)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        # Content-Security-Policy is delivered via the SvelteKit-generated <meta http-equiv> in
    # index.html (kit.csp hash mode), so the inline SPA bootstrap is hashed and script-src
    # drops 'unsafe-inline'. X-Frame-Options above covers frame-ancestors (invalid in <meta>).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Interactive API docs are never served publicly: they enumerate every admin
    # and auth route. The backend already disables them when hardened; denying at
    # the edge keeps them off even if a backend is started with ENABLE_API_DOCS.
    # ^~ / = take priority over the /api/ prefix below.
    location ^~ /api/docs {
        return 404;
    }

    location ^~ /api/redoc {
        return 404;
    }

    location = /api/openapi.json {
        return 404;
    }

    # API proxy (non-PKI routes)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Large file upload support
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
    }

    # WebSocket proxy
    location /api/ws {
        proxy_pass http://backend:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Flower dashboard (Celery task monitoring).
    # Without this block the "Queue Dashboard" button 404s on every deployment
    # that does not load the optional docker-compose.nginx.yml overlay: the
    # request falls through to the SPA fallback above.
    #
    # ^~ is load-bearing. The static-asset regex location earlier in this server
    # block would otherwise win for Flower's own .js/.css and serve them from
    # /usr/share/nginx/html (404) — the same bug that broke the docs container.
    location ^~ /flower/ {
        # Admin-only. The subrequest hits the backend, which authenticates the
        # httpOnly session cookie and answers 200 for admin/super_admin, 401
        # otherwise. Flower exposes task names and arguments (file and user IDs)
        # plus worker topology, so it must not be readable by every logged-in user.
        auth_request /api/auth/flower-authz;

        proxy_pass http://flower:5555/flower/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_redirect off;

        # WebSocket/SSE support for Flower's real-time task event stream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # MinIO storage proxy for presigned URLs
    # ^~ prefix gives priority over regex locations (prevents static asset regex from matching .jpg/.mp4)
    location ^~ /minio/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MinIO API endpoint (for presigned URLs - backend generates /s3/ paths)
    location ^~ /s3/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        # IMPORTANT: Must match the host MinIO signed the URL with
        proxy_set_header Host "minio:9000";
        client_max_body_size 15G;
        proxy_request_buffering off;
    }
}

# HTTPS server with mTLS for PKI authentication
server {
    listen 8443 ssl;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hide NGINX version in response headers and error pages
    server_tokens off;

    # Server certificate
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Client certificate verification (optional - only required for PKI endpoint)
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Set maximum file upload size
    client_max_body_size 15G;
    client_body_timeout 300s;
    client_header_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Security headers (OWASP recommendations)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    # Content-Security-Policy is delivered via the SvelteKit-generated <meta http-equiv> in
    # index.html (kit.csp hash mode), so the inline SPA bootstrap is hashed and script-src
    # drops 'unsafe-inline'. X-Frame-Options above covers frame-ancestors (invalid in <meta>).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Enable gzip compression
    gzip on;
