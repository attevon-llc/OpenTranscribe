name: Feature request
description: Suggest an idea for OpenTranscribe
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick every area this feature touches. A workflow uses this to apply the matching labels automatically.
      multiple: true
      options:
        - backend
        - frontend
        - asr
        - search
        - rag-chat
        - llm-provider
        - gpu
        - docker
        - security
        - performance
        - testing
        - documentation
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe how this feature would be used and who would benefit from it.
    validations:
      required: false
  - type: textarea
    id: technical
    attributes:
      label: Technical considerations
      description: If you have thoughts on implementation, please share them here.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots. If this issue depends on or blocks others, link them here (e.g. "depends on #461").
    validations:
      required: false
