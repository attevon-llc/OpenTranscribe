# Release criteria — the severity of every gate that is READ FROM THIS FILE.
#
# WHAT READS IT
#
#   scripts/release/10-preflight.sh   stage: preflight
#   scripts/release/30-verify.sh      stage: verify
#   scripts/release/50-scan.sh        stage: scan        (added by #667)
#   scripts/release/65-rehearse.sh    stage: rehearse    (added by #667)
#
# That list is exhaustive, and it is enforced from both directions. Each of those
# scripts loads its own stage from here and then:
#
#   * refuses (exit 2) to record a criterion id that this file does not define;
#   * refuses (exit 2) to finish with a criterion defined here that it never
#     checked;
#   * takes `severity` from HERE and the pass/fail outcome from ITSELF.
#
# The last point is the whole design. A check knows whether it passed; it does
# not get to decide whether its failure stops a release. Splitting those two
# decisions is what makes this file load-bearing rather than decorative.
#
# HISTORY — why the shape changed
#
# This file used to describe all twelve stages and claimed in its own header
# that the local orchestrator and CI both read it. Nothing read it: the only
# reference outside the docs was a COMMENT in scripts/release.sh, and every
# stage script hand-coded its ids into a printf. Predictably it drifted, and the
# drift was invisible:
#
#   * `remote-builder` was `blocking` here and recorded `warn` by preflight, so
#     a missing ARM64 builder — checked early precisely so it is not discovered
#     after the amd64 build — did not stop anything.
#   * `docs-build` was `blocking` here, listed under `preflight` (which never
#     checked it), and implemented in `verify`, which recorded `warn`.
#   * `schema-drift` was `warn`, justified by "4 known pre-existing offenders
#     (3 orphan tables + tag.created_at)". v385 dropped those tables and the
#     check became a hard phase of run-integration-tests.sh — so the entry
#     described a policy that no longer existed, for a check this pipeline no
#     longer invokes directly.
#   * `e2e-suite` claimed the FULL Playwright suite was a blocking release gate.
#     The `test` stage runs `run-integration-tests.sh --coverage --e2e-smoke`;
#     the full suite has never been part of it.
#
# So the stages that define their gates in their own scripts are deliberately
# NOT listed here any more. `40-build.sh` checks that the images build and that
# the version is baked in; `80-publish.sh` checks both architectures;
# `90-promote.sh` compares digests; `95-finish.sh` checks CI and the manifest.
# Re-adding them here as prose would recreate exactly the failure this file just
# had, and the one root CLAUDE.md warns about: `expected-schemas.tsv` died of
# being a hand-maintained table that nothing read.
#
# If a second consumer ever appears (a CI job, an AWS promotion job), add its
# stage here and wire it the same way — bidirectionally, or not at all.
#
# `scan` and `rehearse` were added under that rule, not as an exception to it
# (#667). Both scripts now source scripts/release/criteria-lib.sh, load their
# severities from here, `record` every id, and call
# `criteria_assert_all_checked` — so a criterion declared here and not checked
# there, or checked there and not declared here, is exit 2 in both directions.
# They are NOT prose. The shared library exists because a third and fourth
# hand-rolled copy of that contract is itself a drift generator; 10-preflight.sh
# and 30-verify.sh still carry their original inline copies and should be
# migrated onto the library separately, as a change with no behaviour in it.
#
# SEVERITY
#   blocking  — a failure stops the stage. Overridable only with
#               --force-<stage> "<reason>", which records the operator and the
#               reason in the ledger as `overridden`, never as a pass.
#   warn      — reported, never stops anything.
#
# Outcomes a script may record: `pass`, `fail`, `not-measured`. `not-measured`
# is neither: it means the check did not run, so it proves nothing, and against
# a `blocking` criterion it stops the stage exactly as a failure does. (Same
# convention as scripts/run-mutation-tests.sh's exit 4 and run-integration-
# tests.sh's "⊘ NOT MEASURED — proves nothing, not counted as a pass".)

version: 2

stages:
  # ─── Static checks. No Docker, seconds. ─────────────────────────────────
  preflight:
    description: Everything checkable before anything is built
    criteria:
      - id: version-consistency
        description: VERSION, pyproject, package.json, package-lock (both fields), Alembic single head
        severity: blocking

      - id: clean-worktree
        description: No uncommitted changes — a release must be reproducible from the tag
        severity: blocking

      - id: remote-builder
        description: The ARM64 remote builder answers (checked BEFORE the 13.8 GB build starts)
        # blocking, and it must stay blocking: 80-publish.sh cannot publish a
        # multi-arch manifest without it and hard-exits, and `both-arches` is
        # what the promote stage compares digests for. A `warn` here just moves
        # the same failure to hour three.
        severity: blocking

      - id: security-tooling
        description: trivy / grype / syft are installed (the scan stage skips whatever is missing)
        severity: warn

      - id: release-test-secrets
        description: HUGGINGFACE_TOKEN present, or both rehearsal scenarios die at their first transcription
        severity: warn

      - id: release-test-media
        description: Rehearsal media fixtures exist and are small enough to transcribe quickly
        severity: warn

      - id: disk-space
        description: Enough free space on the docker root for the images
        severity: warn

      - id: deployment-matrix
        description: Every documented deployment permutation produces a valid compose config
        severity: blocking

      - id: live-stack
        description: Informational — the rehearse stage requires the live stack STOPPED
        severity: warn

      - id: changelog-section
        description: CHANGELOG.md has a section for this version
        # warn HERE on purpose: preflight runs before `bump`, and bump is what
        # promotes [Unreleased] into [X.Y.Z]. 70-tag.sh refuses without it, so
        # this is an early notice, not the gate.
        severity: warn

  # ─── The fast gate. Safe with the live stack up, well under a minute. ───
  verify:
    description: Everything checkable without building an image
    criteria:
      - id: version-consistency
        description: The six version sources agree and Alembic has a single head (pre-tag mode)
        severity: blocking

      - id: deployment-matrix
        description: Every documented deployment permutation produces a valid compose config
        severity: blocking

      - id: release-manifest
        description: Every release-manifest.txt path exists, or a pinned install 404s for every user
        severity: blocking

      - id: structural-tests
        description: Alembic chain, model registration, manifest, install/upgrade scripts, .env coverage
        severity: blocking

      - id: docs-build
        description: docs-site builds — catches duplicate blog slugs and undefined authors/tags
        # blocking, including when it cannot be measured. deploy-docs.yml does
        # not fire on tag pushes, so a locally-skipped docs build means the slug
        # collision is found by release-validate.yml's `docs` job at tag time —
        # after the tag exists. `SKIP_DOCS_BUILD=true` is the recorded opt-out.
        severity: blocking

      - id: visual-baselines-fresh
        description: Committed screenshot baselines are not older than the UI they describe
        # A visual baseline is a picture of what the UI SHOULD look like. When
        # frontend/src changes and the baselines are not re-captured, they
        # describe an app that no longer exists — and NOTHING reported that:
        # the images went 28 frontend commits stale, six of the ten were being
        # skipped the whole time, and the suite stayed green throughout.
        #
        # This compares two git facts (last commit touching frontend/src vs
        # last commit touching the __screenshots__ dir). It is a STALENESS
        # alarm, not a correctness check: it says the evidence has expired,
        # never that the UI regressed. Only running the suite against an
        # isolated seeded stack can say that, and it needs a GPU-transcribed
        # corpus plus a browser, so it can never run in CI.
        #
        # Blocking at `verify` rather than in the commit-stage suite on
        # purpose. Stale baselines are not a defect in the running app, so
        # failing every frontend commit until someone spends ~5 min on a
        # capture would buy nothing and get allowlisted away. They only matter
        # at the moment a release claims to have been verified.
        # `SKIP_VISUAL_BASELINE_FRESHNESS=true` is the recorded opt-out.
        severity: blocking

  # ─── CVE coverage of the artifacts about to be published. ───────────────
  scan:
    description: Every published container, on every architecture leg, was actually looked at
    criteria:
      - id: every-published-repo-scanned
        description: Every repo from `security-scan.sh list-repos` was scanned (blackwell excluded — never published by all/auto)
        severity: blocking

      - id: every-arch-leg-scanned
        description: Every platform from `docker-build-push.sh list-platforms` produced its own report
        # blocking, and it must stay blocking. A multi-arch tag is an index over
        # several artifacts; a report on one leg says nothing about the others.
        # The registry path used to pull --platform linux/amd64 and scan only
        # that, so lite's arm64 leg — the ONLY backend an arm64 host can install,
        # since arm64_deployment_preflight defaults those hosts to
        # DEPLOYMENT_MODE=lite — would have shipped unexamined (issue #667).
        severity: blocking

      - id: could-not-scan-is-not-a-pass
        description: No leg reported COULD NOT SCAN (exit 2) — distinct from findings-present (exit 1)
        # The distinction is the whole of issue #681 and must not be flattened
        # into one "scan passed". FAIL_ON_SECURITY_ISSUES states which FINDINGS
        # are acceptable to ship; it says nothing about shipping an image nobody
        # looked at, so run_security_scan treats exit 2 as fatal regardless of it.
        # Kept as its own criterion so a release that could not scan something is
        # never reported as a release whose scan found nothing.
        severity: blocking

      - id: reports-describe-this-version
        description: Each leg's Trivy report names the version under test, not whatever :latest pointed at
        # The v0.5.0 gate once reported on the v0.4.1 image because the stage
        # exported a variable security-scan.sh never read. Reading the tag back
        # out of the artifact is the only check that would have caught it.
        severity: blocking

  # ─── The scenarios that prove a real user can install and upgrade. ──────
  rehearse:
    description: The three deployment scenarios, run under the installer's stock names and ports
    criteria:
      - id: live-stack-stopped
        description: The live deployment is down, so the scenarios can bind ports 5173-5180
        # `preflight` also reports this, deliberately as `warn` and labelled
        # informational — it runs long before the scenarios and is a courtesy
        # notice. HERE it is the real precondition: 65-rehearse.sh exits 3 and
        # refuses to run anything, because taking someone's deployment down is
        # their call, not this stage's.
        severity: blocking

      - id: fresh-install
        description: Scenario A — a `curl | bash` install of this version comes up and transcribes
        severity: blocking

      - id: upgrade-from-previous
        description: Scenario B — the previous published release upgrades to this one, with the rollback tail
        severity: blocking

      - id: lite-mode
        description: Scenario C — the lite (CPU-only, cloud-ASR) deployment, against mocked ASR + mocked LLM
        # blocking on purpose, from its first run. `docker-build-push.sh all`
        # builds the lite image and a release publishes it, so a `warn` here
        # would mean shipping a container with no functional evidence behind it —
        # and on arm64 lite is the only deployment there is. An undeclared or
        # non-blocking gate on a first-ever publish is exactly how that happens.
        # It publishes nothing itself: test-lite-mode.sh builds locally and pins
        # pull_policy: never.
        severity: blocking

  # ─── Version bump. Writes files and commits; publishes nothing. ─────────
  bump:
    description: Promote every version source to the target, verify, and commit
    criteria:
      - id: version-increases
        description: The target is strictly greater than the current VERSION — never a re-release or a downgrade
        severity: blocking

      - id: all-sources-written
        description: VERSION, pyproject [project].version and frontend/package.json were rewritten
        severity: blocking

      - id: package-lock-regenerated
        description: npm regenerated package-lock.json, which carries the version in two places
        severity: blocking

      - id: post-bump-consistency
        description: check-version-consistency.py --mode ci passes AFTER the writes, before committing
        severity: blocking

      - id: changelog-promoted
        description: "[Unreleased] was promoted to [X.Y.Z]"
        # warn HERE, matching the script: a missing [Unreleased] is a documented
        # no-op, not a failure. 70-tag.sh is the real gate — it refuses without a
        # section for the version. Same reasoning as preflight's changelog-section.
        severity: warn

      - id: bump-committed
        description: The rewritten version sources were staged and committed
        # Recorded as an operator-waived not-measured under NO_COMMIT=true, which
        # is a documented mode; treating that as a failure would break it.
        severity: blocking

  # ─── The test gate. Runs against the live dev stack. ────────────────────
  test:
    description: The pre-merge integration gate, run against the live stack
    criteria:
      - id: dev-stack-up
        description: Postgres answers on 5176 — this suite runs against the live stack, not a fixture
        severity: blocking

      - id: integration-gate
        description: run-integration-tests.sh --coverage --e2e-smoke --export-capability exits 0
        # Deliberately ONE criterion, not one per phase. run-integration-tests.sh
        # emits no machine-readable phase list, so per-phase ids here would be a
        # wish list rather than anything this stage can record — the exact drift
        # that killed the previous version of this file.
        severity: blocking

  # ─── Local build of every architecture leg. Publishes nothing. ──────────
  build:
    description: Build every declared leg locally and prove each one knows its own version
    criteria:
      - id: platform-table-readable
        description: docker-build-push.sh list-platforms yielded at least one leg
        # An empty table is COULD NOT CHECK, not "nothing to build" — the same
        # rule the scan stage applies to an empty platform list.
        severity: blocking

      - id: every-declared-leg-built
        description: Every non-blackwell component x platform from the table built successfully
        severity: blocking

      - id: baked-version-host-leg
        description: Each backend-derived host-arch leg reports APP_VERSION == the release version
        severity: blocking

      - id: host-arch-leg-present
        description: Each backend-derived component declares a host-arch leg, so its build-arg contract could be run-checked
        # warn, matching today's behaviour: a component with no host-arch leg
        # prints SKIP and passes, because `docker run` cannot execute a foreign
        # architecture. Recording it as not-measured makes the gap visible
        # without changing the stage's contract on such a host.
        severity: warn

  # ─── Tag. Reaches outside the repo. ─────────────────────────────────────
  tag:
    description: Annotate and push the release tag
    criteria:
      - id: clean-worktree
        description: No uncommitted changes — a tag must be reproducible from what it names
        severity: blocking

      - id: tag-absent
        description: The version is not already tagged
        severity: blocking

      - id: version-consistency-pre-tag
        description: check-version-consistency.py --mode pre-tag passes (ci checks plus a blocking CHANGELOG section)
        severity: blocking

      - id: changelog-section
        description: CHANGELOG.md has a section for this version to use as the annotation body
        severity: blocking

  # ─── Publish. The first stage that writes to Docker Hub. ────────────────
  publish:
    description: Push every leg, assemble each index, and verify the published manifests
    criteria:
      - id: remote-builder-available
        description: The multi-arch buildx builder exists and no node reports an error
        severity: blocking

      - id: images-pushed
        description: docker-build-push.sh all (BUILD_MODE=push) succeeded
        severity: blocking

      - id: leg-declares-its-platform
        description: Check (a) — each vX.Y.Z-<cap>-<arch> leg tag declares exactly the platform it names
        severity: blocking

      - id: index-declares-exact-platform-set
        description: Check (b) — each vX.Y.Z index declares exactly the component's platform set; missing OR extra fails
        severity: blocking

      - id: cross-arch-equivalence
        description: Check (c) — two-platform indexes have equal layer counts and a size ratio inside the purpose bound
        severity: blocking

  # ─── Smoke. Runs the PUBLISHED images. ──────────────────────────────────
  smoke:
    description: Prove the published images are the capability and architecture they claim
    criteria:
      - id: live-stack-stopped
        description: No opentranscribe compose-project containers running — the Hub install smoke binds the stock ports
        severity: blocking

      - id: capability-probe-ran
        description: The torch.version.cuda probe actually executed in every image checked
        # Its own criterion on purpose. An image that cannot execute at all prints
        # an empty string too, so discarding the exit status turns "could not
        # check" into "CPU-only confirmed" — the #680 failure mode with a green
        # tick, in the stage whose job is to catch it.
        severity: blocking

      - id: declared-capability-matches
        description: full reports a non-empty torch.version.cuda; lite reports empty
        severity: blocking

      - id: diar-server-arch-correct
        description: diar-server provision-models exits 5 (TOKEN_DENIED), not 126/127 — the wrong-arch ELF detector
        severity: blocking

      - id: lite-arm64-checked
        description: The arm64 lite leg was probed over the remote arm64 docker context
        # warn ONLY because that is today's behaviour: with no remote context the
        # stage prints SKIP and passes. Substantively this is the weakest link in
        # the pipeline — arm64 lite is the only backend an arm64 host can install
        # — so raising it to blocking is the right eventual move, but it requires
        # the operator to have the context configured and 85-smoke.sh to record
        # not-measured instead of SKIP. Left as a visible warn rather than an
        # invisible gap; see issue #667.
        severity: warn

      - id: hub-fresh-install
        description: A fresh install against the published :vX.Y.Z images comes up
        severity: blocking

  # ─── Promote. Moves :latest by digest copy. ─────────────────────────────
  promote:
    description: Move :latest onto the validated digest, never a rebuild
    criteria:
      - id: published-repo-list-derived
        description: security-scan.sh list-repos yielded a non-empty component->repo map
        severity: blocking

      - id: version-tag-published
        description: Every derived repo has a :vX.Y.Z manifest on Docker Hub before promotion
        severity: blocking

      - id: latest-copied
        description: imagetools create succeeded for every repo
        severity: blocking

      - id: latest-digest-matches-version
        description: :latest and :vX.Y.Z resolve to the same non-empty digest per repo
        severity: blocking

  # ─── Finish. Publishes the GitHub Release. ──────────────────────────────
  finish:
    description: Publish the GitHub Release, which is what the installer resolves as "latest"
    criteria:
      - id: gh-cli-available
        description: The gh CLI is installed
        severity: blocking

      - id: tag-exists
        description: The version is tagged in this repo
        severity: blocking

      - id: all-images-published
        description: Every repo from security-scan.sh list-repos has a :vX.Y.Z manifest on Docker Hub
        severity: blocking

      - id: ci-green-for-tag
        description: release-validate.yml concluded success for the tag's SHA
        # The only criterion in the pipeline with a built-in env bypass.
        # SKIP_CI_CHECK=true records this as an operator-WAIVED not-measured, so
        # it appears in criteria[] as an explicit opt-out rather than a pass.
        # Recording a bypass as a pass is precisely the drift this file's header
        # documents for remote-builder.
        severity: blocking

      - id: changelog-section
        description: CHANGELOG.md has a section for this version to use as the release notes
        severity: blocking

      - id: github-release-created
        description: gh release create --latest succeeded
        severity: blocking

      # ─── Release assets (issue #781) ───────────────────────────────────
      # The old code attached assets with a bare existence glob over
      # dist/*.tar.gz, dist/*.zip and security-reports/*-sbom.json. Two
      # defects, and they compounded: ABSENCE was silent (a failed scan or a
      # relocated OT_SCAN_DIR just meant the loop appended nothing, and
      # `gh release create` shipped a release with zero SBOMs and no error),
      # and PRESENCE was not evidence either — security-reports/ is
      # git-tracked and held three stale, non-arch-qualified, pre-#667 SBOMs
      # that the glob would have attached to every future release regardless
      # of which version they last described. Same failure shape #413/#681
      # already fixed once: a gate reporting success when it could not do
      # its job.
      - id: sbom-per-published-leg
        description: >-
          One <component>-<arch>-sbom.json exists (in the resolved scan dir)
          for every leg docker-build-push.sh list-platforms declares for a
          repo that published-repos.sh says this release actually publishes.
          blackwell is excluded — it is in the platform table but publishes
          no vX.Y.Z tag, so it is never in the published-repos set this
          derives from. A platform table or repo list that cannot be read
          derives ZERO legs, which is COULD NOT CHECK, never "nothing to
          ship" — same rule the scan stage's own legs_expected==0 branch
          applies to the identical question.
        severity: blocking

      - id: sbom-describes-this-version
        description: >-
          Each present SBOM's metadata.component.name/.version (the same
          fields Syft writes, read back the way 50-scan.sh already reads
          Trivy's ArtifactName) names THIS release. Closes issue #781's P6:
          a file merely existing in security-reports/ is not evidence — it
          could be a stale report from a different version. An unreadable
          or corrupt SBOM is treated exactly like a version mismatch, never
          as a pass.
        severity: blocking

      - id: asset-checksums
        description: >-
          Every attached SBOM has a published .sha256 sidecar (plus one
          combined SHA256SUMS), generated into a throwaway mktemp -d
          scratch directory — never written into git-tracked
          security-reports/. A checksum a builder already produced is
          reused verbatim rather than recomputed, so there is only ever one
          opinion about a given file's digest.
        severity: blocking

      # The offline (.tar.xz) and Windows (.zip via Inno Setup) packages are
      # a standing PROJECT DECISION, not a run-time operator opt-out: they
      # are built by a developer on their own machine and used there, never
      # attached to a GitHub Release. (dist/opentranscribe-offline-*.tar.gz
      # and dist/opentranscribe-windows-*.zip, which the old glob looked
      # for, never existed — the offline package actually lands at
      # offline-package-build/linux/*.tar.xz, and the Windows builder stages
      # a directory for Inno Setup and produces no archive at all.) Declared
      # `warn` so a `not-measured` here cannot block a release, and recorded
      # `waived` — belt-and-braces on top of the severity — because this is
      # an explicit decision, not a check that merely could not run. See
      # releasing.md for the decision record.
      - id: offline-package-attached
        description: >-
          Not attached, by design — developer-built, never distributed via
          the GitHub Release. Recorded not-measured/waived every run.
        severity: warn

      - id: windows-package-attached
        description: >-
          Not attached, by design — needs Inno Setup on Windows, and is
          developer-built and never distributed via the GitHub Release.
          Recorded not-measured/waived every run.
        severity: warn

# Ordering. The reasoning that must not be lost:
#
#   build -> scan -> rehearse -> publish
#     Validated bytes reach Docker Hub only after the scenarios pass, because
#     :latest is what every existing user pulls.
#
#   tag before publish
#     So CI validates the metadata while the 13.8 GB build runs.
#
#   promote and finish LAST
#     The GitHub release is what the installer resolves for "latest". There must
#     never be a window where releases/latest names a version whose images do not
#     exist yet.
#
# This list is DOCUMENTATION. `STAGES` in scripts/release.sh is what runs, and
# says so at its definition — the one honest label this file already had.
order:
  - preflight
  - bump
  - verify
  - test
  - build
  - scan
  - rehearse
  - tag
  - publish
  - smoke
  - promote
  - finish
