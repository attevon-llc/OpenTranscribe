# Prometheus scrape configuration for OpenTranscribe.
#
# Loaded by the monitoring overlay (docker-compose.monitoring.yml) at
# /etc/prometheus/prometheus.yml. The single job scrapes the backend's
# in-app /metrics endpoint (Phase 1) over the compose network.
#
# The backend exposes /metrics unauthenticated at its root (next to /health),
# never proxied by nginx — it is reachable only from inside the Docker network.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: opentranscribe

# Alerting rules (https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/)
# and the Alertmanager that delivers them (https://prometheus.io/docs/alerting/latest/configuration/).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: opentranscribe-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: backend

  # Per-task Celery metrics. Each worker serves them only when WORKER_METRICS_PORT is set
  # (to 9808 here); with it unset these targets are simply down, and the
  # WorkerMetricsTargetDown rule stays quiet until at least one worker answers.
  - job_name: opentranscribe-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - celery-worker:9808
          - celery-cpu-worker:9808
          - celery-download-worker:9808
          - celery-nlp-worker:9808
          - celery-embedding-worker:9808
          - celery-cloud-asr-worker:9808
          - celery-redaction:9808
          - celery-worker-gpu-transcribe:9808
          - celery-worker-gpu-diarize:9808
        labels:
          service: celery-worker

  # Host disk and filesystem metrics for the DiskSpaceLow rule.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # Load-test exporters (the `load-monitoring` profile of docker-compose.monitoring.yml, enabled with
  # COMPOSE_PROFILES=load-monitoring). Without that profile these targets are simply down; no rule alerts on them, like the worker targets above.
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  # Per-container CPU, memory and network; the compose project/service labels select one stack.
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
