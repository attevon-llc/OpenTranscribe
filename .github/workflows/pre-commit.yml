name: Pre-commit Checks

on:
  workflow_dispatch:  # Manual triggering always available
  pull_request:
    branches: [master, main, develop]
  # push intentionally left off to respect runner-resource limits — PRs are the gate.
  # push:
  #   branches: [master, main, develop]

# Cancel a superseded run the moment a new commit lands on the same PR.
#
# Without this, pushing a fix (or merging master up, which this repo does often
# because `strict` is false on branch protection and staleness is caught by
# discipline rather than by GitHub) left the PREVIOUS run going: `Backend Tests
# (pytest)` alone is ~16 minutes, so a stale-base merge-up meant two full runs
# on a runner where only the second one's verdict could ever be used.
#
# Keyed on the PR number (`github.event.pull_request.number`), falling back to
# `github.ref` for `workflow_dispatch`, so concurrent DIFFERENT PRs never cancel
# each other — only successive pushes to the same one.
concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # matches frontend/Dockerfile.prod build stage (node:24-alpine, active LTS)
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit (pre-commit stage)
        run: pre-commit run --all-files --show-diff-on-failure

      # ⚠️ BOTH stages, always (issue #688). `pre-commit run` with no --hook-stage runs
      # DEFAULT-stage hooks only, and .pre-commit-config.yaml sets
      # `default_stages: [pre-commit]` — so a hook demoted to `stages: [pre-push]` silently
      # stops running here and the workflow stays green while checking less. That is the
      # exact failure the tiering had to avoid, so the demotion and this step are one change,
      # not two. It currently covers the frontend production vite build (the ONLY one in CI
      # for a PR — docker-publish.yml is workflow_dispatch-only) and the recursive
      # `bandit -r backend/` scan.
      #
      # `--show-diff-on-failure` is kept: shared pre-commit-hooks entries such as
      # trailing-whitespace/end-of-file-fixer declare pre-push in their own stages and can
      # rewrite files here too.
      #
      # backend/tests/unit/test_precommit_stage_ci_parity.py fails the build if any stage a
      # hook is assigned to has no CI invocation.
      - name: Run pre-commit (pre-push stage)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

      - name: Generate pre-commit summary
        if: always()
        run: |
          echo "## Pre-commit Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pre-commit hooks executed on all files (pre-commit AND pre-push stages)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Hooks Executed:" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting (Ruff, Prettier)" >> $GITHUB_STEP_SUMMARY
          echo "- Linting (Ruff, mypy, ESLint)" >> $GITHUB_STEP_SUMMARY
          echo "- Security checks (Gitleaks, Bandit)" >> $GITHUB_STEP_SUMMARY
          echo "- Shell script validation (shellcheck)" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile linting (Hadolint)" >> $GITHUB_STEP_SUMMARY

  # Detects which parts of the tree a PR touches, so the expensive suites can skip
  # work that cannot possibly be affected. Job-level (not workflow-level `paths:`)
  # ON PURPOSE: all three jobs live in this file, and a workflow-level filter would
  # also skip the pre-commit hooks — which DO matter for a docs-only PR (prettier,
  # markdown, trailing whitespace).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements*.txt'
              - '.github/workflows/pre-commit.yml'
              - 'alembic.ini'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pre-commit.yml'

  backend-tests:
    # Best-effort safety net: runs the unit/API suite + security-gated suites
    # against a fresh Postgres with CPU-only deps (requirements-ci.txt — no
    # Docker app images, no GPU wheels). The COMPLETE suite (S3/OpenSearch/
    # integration/E2E) runs locally via scripts/run-integration-tests.sh,
    # which remains the pre-merge source of truth.
    name: Backend Tests (pytest)
    needs: changes
    # ~17 min, dominated by installing CPU torch wheels and the FIPS security suites.
    # A docs- or frontend-only PR cannot change its outcome, so don't pay for it.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # ~17 min in the normal case. The cap exists because a hosted-runner apt mirror
    # outage once hung `apt-get update` until the 360-minute ACCOUNT default, burning
    # six hours of runner time without executing a single test (issue #493).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcribe_app
        ports:
          - 5176:5432 # the port backend/tests/conftest.py expects
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5176'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcribe_app
      # No MinIO/OpenSearch services here — keep those suites skipped
      SKIP_S3: 'True'
      SKIP_OPENSEARCH: 'True'
      DATA_DIR: /tmp/ci-data
      MODELS_DIR: /tmp/ci-models
      TEMP_DIR: /tmp/ci-temp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install system dependencies
        # Bounded separately from the job: a mirror that stops answering should fail this
        # step in minutes, not consume the whole job budget retrying (issue #493).
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Verify app imports
        working-directory: backend
        run: python -c "import app.main"
        env:
          TESTING: 'True'

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run unit/API test suite (with coverage, report-only)
        working-directory: backend
        run: |
          # pipefail is REQUIRED: GitHub's default shell is `bash -e {0}` WITHOUT
          # pipefail, so `pytest | tee` exits with tee's status (0) and pytest
          # failures silently pass the job. This masked real failures for months.
          set -o pipefail
          pytest tests/ --cov=app --cov-report=term | tee pytest-output.txt
          {
            echo "## Backend Test Coverage (report-only)"
            echo '```'
            tail -40 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mirrors the frontend-tests job below: self-test the auditor, THEN run it.
      # Duplicated with the pre-commit hooks on purpose — this is where the verdict
      # belongs in the log, right next to the suite whose quality it is judging, and
      # the auditor is stdlib-only so it costs ~10 s and needs no extra install.
      #
      # A detector that stops matching reports zero findings, which reads exactly like
      # a clean suite. Never reorder these two steps.
      - name: Self-test the test auditor
        run: python3 scripts/audit-tests.py --selftest

      # Fails on any un-allowlisted test that passes whether the code works or not.
      # Also prints the DEFERRED-WORK (BACKLOG) count from
      # backend/tests/audit-allowlist.txt, so a green gate is never mistaken for a
      # clean tree, and fails on a stale allowlist entry so the list can only shrink.
      - name: Audit backend test quality
        run: python3 scripts/audit-tests.py backend/tests

      - name: Run security-gated suites (FIPS 140-3 mode)
        working-directory: backend
        env:
          RUN_PKI_TESTS: 'true'
          RUN_MFA_TESTS: 'true'
          RUN_LLM_TESTS: 'true'
          RUN_FEDRAMP_TESTS: 'true'
          RUN_FIPS_TESTS: 'true'
          FIPS_MODE: 'true'
          RUN_AUTH_CONFIG_TESTS: 'true'
          RUN_ADVANCED_ADMIN_TESTS: 'true'
          # RUN_SEARCH_QUALITY_TESTS deliberately omitted — corpus-dependent
          # relevance harness, local-only via run-integration-tests.sh
        run: >-
          pytest tests/test_pki_auth.py tests/test_mfa_security.py
          tests/test_llm_settings.py tests/test_fedramp_compliance.py
          tests/test_fedramp_controls.py tests/test_fips_140_3.py
          tests/test_auth_config_service.py tests/test_admin_security.py
          tests/test_admin_endpoints.py
          -o addopts="" -n auto --dist loadgroup -q --tb=short

  frontend-tests:
    name: Frontend Unit Tests (Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check i18n key parity
        working-directory: frontend
        run: npm run check:i18n

      - name: Run Vitest
        working-directory: frontend
        run: npm run test

      # Self-test FIRST: the auditor's detectors are themselves code that can silently stop
      # matching, and a broken detector is indistinguishable from a clean suite.
      - name: Self-test the test auditor
        working-directory: frontend
        run: npm run test:audit:selftest

      # Fails on any test that passes whether the code works or not (.only leaks, assertions
      # that cannot fail, conditional-only assertions, un-awaited rejects chains). Exemptions
      # go in frontend/test-audit-allowlist.txt with a mandatory reason.
      - name: Audit test quality
        working-directory: frontend
        run: npm run test:audit

      # Report-only dev-tooling: surface dead code and import cycles in the job log
      # without failing CI yet (|| true). Tighten to hard-fail once the existing
      # backlog of knip false-positives / the intentional axios↔auth cycle is triaged.
      - name: Dead-code report (knip, non-blocking)
        working-directory: frontend
        run: npm run deadcode || true

      - name: Import-cycle report (madge, non-blocking)
        working-directory: frontend
        run: npm run cycles || true
