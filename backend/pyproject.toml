[build-system]
requires = ["setuptools", "wheel"]

[tool.ruff]
# Same as Black.
line-length = 100

# py312 matches the runtime; the 3.12+ pyupgrade codemod landed with this bump.
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "C90", "B", "A", "S", "SIM", "PIE"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E203",  # Whitespace before ':' (conflicts with black)
    "S101",  # Use of assert (common in tests)
    "B008",  # Do not perform function call in argument defaults (FastAPI dependencies)
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests: allow assertions, magic values, test credentials, try-except-pass,
# requests without timeout, subprocess calls, imports after skip markers, etc.
"**/tests/**" = [
    "S101", "PLR2004",                  # assertions, magic values
    "S105", "S106", "S107",             # hardcoded test passwords/credentials
    "S110", "SIM105",                   # try-except-pass (test teardown)
    "S113", "S310",                     # requests without timeout, URL open audit
    "S603", "S607", "S608",             # subprocess calls, SQL in test fixtures
    "E402",                             # imports after pytest.mark.skipif
    "N801",                             # TestFIPS140_3 naming matches spec
    "F841",                             # unused variables (test assertions via side effects)
    "SIM102", "SIM117", "SIM222",       # nested if/with statements, readability over brevity
    "B007",                             # unused loop variables in test iterations
]
# Allow imports at top level of __init__.py
"__init__.py" = ["F401"]
# Speaker clustering uses mathematical variable names (M, MT, Z) and complex algorithms
"**/speaker_clustering_service.py" = ["N806", "C901"]
# Long linear index-rebuild / bulk-scroll routines (rebuild_speaker_index,
# iter_speaker_embeddings). Narrowed from the whole opensearch_service package
# to these two files in #284 A3.3; S110 (try-except-pass) is no longer exempt
# anywhere outside tests.
"**/opensearch_service/repair.py" = ["C901"]
"**/opensearch_service/speaker_read.py" = ["C901"]
# Migrations and alembic versions use string-based SQL construction
"**/migrations/**" = ["E501", "F401"]
"**/alembic/**" = ["S608"]

[tool.ruff.lint.mccabe]
# Auth functions (login, LDAP, OIDC, PKI) are inherently complex.
# 16 is standard for auth-heavy codebases.
max-complexity = 16

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests"]
# Test files have legitimate use of hardcoded credentials and other security patterns
# These are flagged by bandit but are appropriate for test fixtures

# Import-linter: enforce the cloud seam direction as a build invariant.
# The closed-source cloud edition imports this open-source core (`app.*`),
# NEVER the reverse. There is no `cloud` package in this repo, so the
# contract holds trivially today — its job is to FAIL the build the moment a
# `from cloud import ...` (or `import clerk` / `import stripe`) accidentally
# leaks into core. Run via `lint-imports` (pre-commit hook + local gate).
[tool.importlinter]
root_package = "app"
# clerk/stripe are external (non-`app`) packages, so the forbidden contract
# must opt in to analysing external imports.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core (app) must not import the closed cloud edition"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["cloud", "clerk", "stripe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns an unregistered marker into a collection error. Without it,
# `gpu` sat unregistered and silently ungated for months: the modules using it carried no
# `integration` marker, so they ran in the fast suite AND in CPU-only CI, passing only on
# their own runtime skip guards, while the gate's `-m integration` phase never selected
# them. Register every marker you use — see scripts/run-integration-tests.sh for the phases.
# --durations surfaces the slow tail every run. Without it, a 40 s test that is really 40 s
# of lock queue is invisible; that is how one worker came to own 81% of the wall clock.
# --timeout converts a hang into a failure. DDL tests serialise behind a Postgres advisory
# lock that only covers connections opting into it, so a genuine cross-connection cycle is
# possible and would otherwise stall the run indefinitely. 300 s is ~5x the slowest observed
# test (54.6 s), so it cannot fire on a merely slow test — tighten it once the suite is fast.
# Both require pytest-timeout, which is therefore MANDATORY in requirements-dev/-ci: a
# missing plugin makes --timeout a collection error, not a no-op (issue #431).
addopts = "-n auto --dist loadgroup --tb=short -q --strict-markers --durations=25 --timeout=300 -m 'not integration and not gpu'"
markers = [
    "slow: marks tests as slow",
    "unit: pure unit test, no external service",
    "pki: PKI certificate tests",
    "e2e: end-to-end browser tests",
    "integration: integration tests requiring running dev environment",
    "gpu: tests requiring a physical GPU — deselected from the fast suite, run by the gate",
    "models: tests requiring ML model weights (Presidio/GLiNER/toxicity) — skipped in fast CI",
    "ddl_exclusive: performs schema DDL (DROP/ALTER TABLE) needing full DB-wide exclusivity, not just self-consistency — see tests/conftest.py's advisory-lock isolation (issue #389)",
]
norecursedirs = ["tests/e2e"]

# Coverage runs via `pytest --cov=app` (CI backend-tests job + the local gate's
# --coverage flag). fail_under is a RATCHET FLOOR set just below the measured
# baseline (36.6% on 2026-06-04) — raise it as coverage grows, never lower it.
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/alembic/*",
    "app/scripts/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
fail_under = 37

# ---------------------------------------------------------------------------
# Mutation testing (opt-in — NEVER part of the default gate or CI).
#
# Coverage says a line RAN. Mutation testing says a line MATTERS: it edits the
# source (flips a comparison, drops a condition, changes a constant) and asks
# whether any test notices. A surviving mutant is a line the suite executes but
# does not actually check — for a security predicate that means the control can
# be silently removed with the suite still green.
#
# Scoped to security-critical modules ONLY. A whole-codebase run on ~40k lines is
# hours of GPU-idle CPU and is not what this is for; the point is a small set where
# a survivor is unambiguously a bug. `scripts/run-mutation-tests.sh` reads
# `paths_to_mutate` from here, so this list is the single source of truth.
#
# `runner` deliberately carries NO test paths and NO -n: the script supplies both
# through PYTEST_ADDOPTS, which pytest prepends to the command line. That is how a
# per-module test subset is selected, and how the project's `-n auto` is overridden
# to `-n0` — a mutant run that forks 24 xdist workers per mutant is slower than
# serial and, against this repo's single shared Postgres, deadlock-prone
# (the advisory-lock/system_settings collisions of issues #389 and #431).
[tool.mutmut]
paths_to_mutate = [
    "app/services/redaction/spans.py",
    "app/auth/password_policy.py",
    "app/core/security.py",
    "app/api/endpoints/auth/dependencies.py",
    "app/auth/lockout.py",
    "app/auth/session.py",
]
tests_dir = "tests/"
runner = "python -m pytest -x -q --timeout=120"
