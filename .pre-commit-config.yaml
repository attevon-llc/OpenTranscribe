# Pre-commit hooks configuration for OpenTranscribe
# See https://pre-commit.com for more information

repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^security-reports/
      - id: end-of-file-fixer
        exclude: ^security-reports/
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags in docker-compose
      - id: check-json
        exclude: ^security-reports/
      - id: check-added-large-files
        args: [--maxkb=10240]  # 10MB max file size
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^security-reports/
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Python formatting and linting with Ruff (replaces Black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^backend/
        additional_dependencies:
          - types-requests
          - types-python-dateutil
          - types-pyyaml
          - types-redis
          # py.typed runtime deps the hook's isolated env must see, or their
          # APIs degrade to Any and no-any-return fires in importing code.
          - prometheus-client
          # SQLAlchemy 2.0 ships py.typed — the hook's isolated env needs it so
          # Mapped[...] columns resolve to real types (not Column[Any]); this is
          # what makes the typed-models conversion's type info visible to mypy.
          - sqlalchemy>=2.0
          # joserfc ships py.typed (app/auth/oidc/claims.py, #33) — same reason.
          - joserfc>=1.7.4
        args: [--ignore-missing-imports, --check-untyped-defs]

  # Frontend formatting with Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, yaml, html, css, scss, markdown]
        args: [--write, --ignore-unknown]

  # Frontend type checking and build verification
  - repo: local
    hooks:
      - id: frontend-check
        name: Frontend Build Verification
        entry: scripts/frontend-check.sh
        language: system
        files: ^frontend/src/
        types_or: [svelte, ts, javascript, css, html]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

  # Dockerfile linting — runs hadolint via its official pinned Docker image
  # (language: docker_image), so NO local hadolint binary is required; this is
  # identical in CI and for contributors (both have Docker) and can never fall
  # back to a missing system binary. The previous config used the hadolint repo
  # with language: system + entry: hadolint, which exec'd a local binary that
  # isn't installed in CI — failing every run with "Executable hadolint not
  # found" (the Pre-commit workflow was red on master since Oct 2025 for this).
  # Picks up the repo-root .hadolint.yaml; types:[file] + files matches the
  # Dockerfile.<stage> naming that identify doesn't tag as 'dockerfile'.
  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        language: docker_image
        entry: hadolint/hadolint:v2.12.0 hadolint
        files: Dockerfile.*
        types: [file]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        args: [--verbose, --no-banner]
        exclude: ^security-reports/

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        files: ^backend/
        args: [-c, pyproject.toml, -r, backend/]
        additional_dependencies: ["bandit[toml]"]

  # Import-linter — enforce the cloud seam direction: the open-source core
  # (`app.*`) must NEVER import the closed-source cloud edition (`cloud`/clerk/
  # stripe). Contract lives in backend/pyproject.toml ([tool.importlinter]).
  # Runs from the backend/ dir (cwd) so import-linter can import the `app`
  # package; uses the project venv binary like the frontend-check hook.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (app must not import cloud)
        # language: python so pre-commit provisions import-linter in its OWN
        # isolated env — the pre-commit CI job installs only `pre-commit` (no
        # backend venv, no project deps), so a hardcoded venv/bin path or a
        # system `lint-imports` would not exist there. bash handles the cd into
        # backend/ so grimp can locate the `app` namespace package; lint-imports
        # resolves from the isolated env's PATH. grimp analyses statically (AST),
        # so the app's runtime deps are NOT required.
        entry: bash -c 'cd backend && lint-imports --config pyproject.toml'
        language: python
        additional_dependencies: ['import-linter>=2.0']
        pass_filenames: false
        files: ^backend/app/.*\.py$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # Commit message linting (optional)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-scope]

# Configuration for specific hooks
default_stages: [pre-commit]
fail_fast: false
