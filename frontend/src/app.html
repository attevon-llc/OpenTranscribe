<!doctype html>
<html lang="en">
  <head>
    <!-- Immediate theme initialization to prevent flashing.
         Render-blocking external script (runs before first paint), served from
         /static/theme.js — kept external so the CSP can omit script-src unsafe-inline
         (SvelteKit's kit.csp hash-mode meta governs scripts; see svelte.config.js).
         Vite doesn't hash files in static/, and nginx caches *.js for a year, so the
         ?v= digest (content hash of theme.js, computed in vite.config.ts) is what
         stops a stale copy from being pinned in browser caches. -->
    <script src="/theme.js?v=%sveltekit.env.PUBLIC_THEME_VERSION%"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <!-- Apple PWA meta tags for iOS standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenTranscribe" />
    <!-- 180x180 is the correct size for Apple touch icons (iOS ignores the sizes attribute) -->
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) for iPhone notch/Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme color with media queries for light/dark mode -->
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <title>OpenTranscribe</title>
    <!-- Local fonts -->
    <style>
      /* Poppins Font - Local */
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url('/fonts/poppins-v20-latin-300.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/Poppins-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/Poppins-Medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/Poppins-Bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/Poppins-Bold.woff2') format('woff2');
      }
    </style>
    <!-- Auth redirection is handled by SvelteKit layout (cookie-based auth) -->
    <!-- Base styles with theme-aware colors to prevent flash -->
    <style>
      :root {
        /* Light theme defaults */
        --bg-primary: #f8fafc;
        --text-primary: #1e293b;
        --surface-primary: #ffffff;
      }

      /* Dark theme variables */
      [data-theme='dark'] {
        --bg-primary: #0f172a;
        --text-primary: #f8fafc;
        --surface-primary: #1e293b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        background-color: var(--bg-primary);
        color: var(--text-primary);
      }

      body {
        font-family:
          'Poppins',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        /* Remove visibility hidden approach and use instant background */
      }

      #app {
        background-color: var(--bg-primary);
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Prevent any white flashes during initial load */
      .loading-placeholder {
        background-color: var(--bg-primary);
        color: var(--text-primary);
      }

      /* iOS PWA improvements */
      * {
        /* Prevent iOS blue flash on tap */
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body,
      #app {
        /* Prevent horizontal scroll on mobile */
        overflow-x: hidden;
        max-width: 100vw;
        /* Prevent long words/URLs from causing horizontal overflow */
        overflow-wrap: break-word;
        word-break: break-word;
      }

      body {
        /* Prevent pull-to-refresh on the main app container */
        overscroll-behavior-y: none;
      }

      /* Prevent iOS input zoom (requires font-size >= 16px) */
      input,
      select,
      textarea {
        font-size: max(16px, 1rem);
      }

      /* Faster taps — remove 300ms delay on touch devices */
      button,
      a,
      [role='button'] {
        touch-action: manipulation;
      }

      /* PWA standalone mode adjustments */
      @media (display-mode: standalone) {
        body {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
      }
    </style>
    <!-- Preload critical fonts to prevent FOUT on mobile -->
    <link
      rel="preload"
      href="/fonts/Poppins-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Poppins-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    %sveltekit.head%
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
