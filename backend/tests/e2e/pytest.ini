[pytest]
# E2E Test Configuration

# Base URL for frontend (can be overridden with --base-url)
base_url = http://localhost:5173

# Browser options
# Run headless by default, use --headed for visible browser
addopts = --browser chromium

# Slow down operations for debugging (milliseconds)
# Uncomment for debugging:
# --slowmo 100

# Screenshot on failure
# --screenshot only-on-failure

# Video recording (off by default, can be on/retain-on-failure)
# --video off

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: marks tests related to authentication (LDAP, Keycloak, PKI login flows)
    smoke: marks tests for smoke testing
    pki: PKI certificate authentication tests (requires RUN_PKI_E2E=true)
    e2e: end-to-end tests (module-level marker used by API-driven e2e files)
    gallery: gallery page and bulk-action tests
    upload: media upload flow tests (file, URL, record tabs)
    search: search page tests
    settings: settings modal tests
    transcription: transcript viewing/editing tests (need a completed media file)
    responsive: viewport/responsive layout tests
    visual: visual regression tests (screenshot baselines)
    api_e2e: tests mixing direct API calls with browser assertions
    chat: RAG chat page tests (need an LLM provider + a completed transcript)
