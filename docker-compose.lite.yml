# API-Lite deployment overlay — cloud-only ASR, no GPU required
# Usage: docker compose -f docker-compose.yml -f docker-compose.lite.yml up -d
#
# Disables: GPU workers (no faster-whisper, no PyTorch+CUDA)
# Adds: cloud-asr worker (CPU-only, concurrency=4)
# All backend services use the lite Docker image (~2 GB vs 8.9 GB)

services:
  # Disable GPU workers
  celery-worker:
    deploy:
      replicas: 0

  celery-worker-gpu-scaled:
    # Disable GPU-scaled worker in lite mode — cloud ASR replaces GPU workers.
    # profiles: cannot be unset via overlay; use deploy.replicas: 0 instead.
    deploy:
      replicas: 0

  # Cloud ASR worker — overrides the base 'celery-cloud-asr-worker' to use the
  # lite image. All connection settings (POSTGRES_HOST/MINIO_HOST/REDIS_HOST/
  # OPENSEARCH_HOST, credentials, ASR keys, ENCRYPTION_KEY) are inherited from
  # the base service's `env_file: .env` + environment block; we only override
  # the image and the deployment mode marker here.
  celery-cloud-asr-worker:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    pull_policy: ${PULL_POLICY:-always}
    environment:
      - DEPLOYMENT_MODE=lite

  # Override all backend workers to use the lite image
  backend:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  celery-cpu-worker:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  celery-nlp-worker:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  celery-download-worker:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  celery-beat:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  celery-embedding-worker:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  celery-redaction:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite

  # ⚠️ flower was the ONE default-profile service this overlay missed (issue #680).
  # It has no `profiles:` and no `scale: 0` in docker-compose.yml, so it starts on every
  # lite deployment — and without this block it starts from the FULL/CUDA image. On
  # amd64 that silently pulls ~4.4 GB into a deployment whose whole premise is ~2 GB; on
  # arm64, where opentranscribe.sh now defaults to lite because the full image publishes
  # no arm64 manifest at all, `docker compose up` fails outright with "no matching
  # manifest for linux/arm64". Every other backend-image service here is either
  # overridden above, scaled to 0, or behind the gpu-scale/gpu-split profiles.
  flower:
    image: ${BACKEND_LITE_IMAGE:-davidamacey/opentranscribe-backend-lite:latest}
    environment:
      - DEPLOYMENT_MODE=lite
