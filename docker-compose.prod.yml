# OpenTranscribe Production Overrides
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# This file contains ONLY production-specific settings:
#   - Pull pre-built images from Docker Hub
#   - Production volume configurations
#   - Production database initialization path

services:
  backend:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    # No volumes needed - temp files live in container only
    environment:
      # In prod the frontend container is nginx and it proxies /api to the backend
      # (frontend/nginx.conf), so `request.client.host` is the PROXY for every API
      # request. With no trusted-proxy list the IP resolver falls back to that peer
      # address and EVERY caller shares one rate-limit bucket and one audit-log
      # address: a single user can exhaust the auth rate limit for the whole
      # deployment, and the audit trail records the proxy instead of the user.
      #
      # 172.16.0.0/12 is Docker's own address pool (the default bridge plus every
      # user-defined compose network), so it covers the proxy container and nothing
      # outside the host. Deliberately NOT the full RFC1918 set: published container
      # ports preserve the external source address, so trusting 10/8 or
      # 192.168.0.0/16 would let any machine on a typical LAN reach the backend port
      # directly and forge its own X-Forwarded-For.
      #
      # Override in .env when Docker's pool is customised (`default-address-pools`)
      # or the proxy is external — .env.example documents the format.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.1/32,172.16.0.0/12}

  celery-worker:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Production: only model cache, no code mounts
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # No temp volume needed - temp files live in container only

  celery-download-worker:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Production: only model cache for download worker
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch

  celery-cpu-worker:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    # No volumes needed - CPU worker doesn't need model cache

  celery-redaction:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Redaction worker needs the HuggingFace cache for GLiNER + toxicity models
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch

  celery-cloud-asr-worker:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    # No volumes needed - cloud-ASR worker is network-bound only

  celery-nlp-worker:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    # No volumes needed - NLP worker doesn't need model cache

  celery-embedding-worker:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Production: sentence-transformers model cache
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # RAG chat loads a CPU cross-encoder here to rerank retrieval results.
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface

  celery-beat:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    # No volumes needed - scheduler state lives in container only

  frontend:
    image: davidamacey/opentranscribe-frontend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod  # Production build with NGINX
    pull_policy: always
    ports:
      - "${FRONTEND_PORT:-5173}:8080"  # Production NGINX port
    environment:
      - NODE_ENV=production  # Production mode
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  flower:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always

  # OpenSearch production security (enable security plugin with TLS + auth)
  # Requires OPENSEARCH_ADMIN_PASSWORD set in .env
  # Requires TLS certificates in config/opensearch/certs/ (or use demo certs for testing)
  opensearch:
    environment:
      # Invert OPENSEARCH_SECURITY_ENABLED → DISABLE_SECURITY_PLUGIN
      # When security is enabled (true), the plugin should NOT be disabled (false)
      DISABLE_SECURITY_PLUGIN: "${OPENSEARCH_DISABLE_SECURITY:-true}"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_ADMIN_PASSWORD:-}"
      plugins.security.ssl.transport.pemcert_filepath: "certs/esnode.pem"
      plugins.security.ssl.transport.pemkey_filepath: "certs/esnode-key.pem"
      plugins.security.ssl.transport.pemtrustedcas_filepath: "certs/root-ca.pem"
      plugins.security.ssl.http.enabled: "${OPENSEARCH_USE_TLS:-false}"
      plugins.security.ssl.http.pemcert_filepath: "certs/esnode.pem"
      plugins.security.ssl.http.pemkey_filepath: "certs/esnode-key.pem"
      plugins.security.ssl.http.pemtrustedcas_filepath: "certs/root-ca.pem"
      plugins.security.allow_default_init_securityindex: "true"

  docs:
    image: davidamacey/opentranscribe-docs:${OT_IMAGE_TAG:-latest}
    build:
      context: ./docs-site
      dockerfile: Dockerfile
      args:
        # Repo-root VERSION is outside this build context; opentr.sh exports it.
        OT_VERSION: ${APP_VERSION:-}
    pull_policy: always
    ports:
      - "${DOCS_PORT:-5183}:8080"
    environment:
      - NODE_ENV=production

  # GPU Scaled Worker - Production overrides
  # NOTE: No 'scale' parameter here - base has scale: 0, gpu-scale.yml sets scale: 1
  # This overlay only provides production-specific settings (image, build, pull_policy)
  celery-worker-gpu-scaled:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Production: Model cache directories
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe

  # GPU Split Workers - Production overrides
  # Base provides command/env/healthcheck via the gpu-split profile; these blocks
  # only supply the image/build/pull_policy/volumes (mirrors celery-worker-gpu-scaled).
  celery-worker-gpu-transcribe:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Production: Model cache directories
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff

  celery-worker-gpu-diarize:
    image: davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod  # Production build
    pull_policy: always
    volumes:
      # Production: Model cache directories
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
      - transcription-temp:/tmp/transcription  # noqa: S108  # nosec B108  — engine shared-volume WAV handoff
