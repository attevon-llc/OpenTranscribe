# Monitoring overlay (Phase 2 — observability)
#
# Adds a Prometheus + Alertmanager + Grafana stack that scrapes the backend's in-app
# /metrics endpoint (Phase 1) and renders the ops + product dashboards.
# Load via: ./opentr.sh start dev --with-monitoring
#
#   PROMETHEUS_PORT  host port for the Prometheus UI (default 5186) → :9090
#   GRAFANA_PORT     host port for the Grafana UI    (default 5185) → :3000
#   ALERTMANAGER_PORT host port for Alertmanager     (default 5188) → :9093
#   ALERTMANAGER_WEBHOOK_TOKEN bearer token for the backend alert webhook (also read by the backend)
#   GRAFANA_PASSWORD admin password for Grafana      (default admin — CHANGE IN PRODUCTION)
#   POSTGRES_*       reused (from .env) to provision Grafana's read-only PostgreSQL datasource
#
# Both host ports are bound to 127.0.0.1 only, matching the base file's
# convention for everything that isn't the app itself: Prometheus has no auth at
# all (and runs with --web.enable-lifecycle) and Grafana's fallback password is
# `admin`. Expose either one through a reverse proxy with real auth if it needs
# to be reachable off-host — do not move the binding to 0.0.0.0.
#
# Both services join the stack's default bridge network automatically (same
# compose project), so Prometheus reaches the backend at backend:8080 and
# Grafana reaches prometheus:9090 / postgres:5432 by SERVICE name. Those names
# are stable even when `--fresh` re-pins container_name (issue #347).
#
# This overlay is intentionally generic so the cloud repo (which pins this
# repo as a submodule) can append it as an extra `-f` file unchanged.
#
# FUTURE ADD-ON (not included): a celery-exporter container. The backend
# already publishes `celery_queue_depth` per queue via /metrics, so queue
# depth is covered without it; add an exporter later if per-task Celery
# metrics (runtime, retries, success/failure) are wanted in Prometheus.

services:
  prometheus:
    container_name: opentranscribe-prometheus
    # Tag AND digest: the tag is what Dependabot bumps, the digest is what runs.
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      # Loopback-only — unauthenticated admin API. See the header note.
      - "127.0.0.1:${PROMETHEUS_PORT:-5186}:9090"

  alertmanager:
    container_name: opentranscribe-alertmanager
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alertmanager_webhook_token
    ports:
      # Loopback-only, like Prometheus: the Alertmanager UI and API have no auth.
      - "127.0.0.1:${ALERTMANAGER_PORT:-5188}:9093"

  # Host filesystem metrics (the stack exposes no disk gauge of its own). Mounting the
  # host root read-only is node_exporter's documented containerised pattern:
  # https://github.com/prometheus/node_exporter#docker
  node-exporter:
    container_name: opentranscribe-node-exporter
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave

  grafana:
    container_name: opentranscribe-grafana
    # Pinned to the current stable Grafana 12.x (12.4.4, 2026-06-02). Bump the
    # minor as new 12.x releases land; Grafana 12's strict provisioned-datasource
    # UID validation is why the datasource UIDs are plain (prometheus / opentranscribe-pg).
    image: grafana/grafana:12.4.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # SECURITY: the `admin` fallback is for localhost-only dev. Set GRAFANA_PASSWORD
      # in .env to a strong value for ANY non-localhost / shared / production use.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # No phone-home: usage stats to stats.grafana.org, update/plugin-update checks and
      # the news feed (grafana.com), feedback links, and browser-side Gravatar lookups.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      # Plugin-signature keys: use the bundled set instead of fetching from grafana.com.
      - GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED=true
      # Passed through to the provisioned PostgreSQL datasource (read-only product metrics).
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-opentranscribe}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Loopback-only — default admin password. See the header note.
      - "127.0.0.1:${GRAFANA_PORT:-5185}:3000"
    depends_on:
      - prometheus

# Overlay-local named volumes (overlays may declare their own — watch overlay precedent).
# The bearer token Alertmanager presents to the backend webhook. Compose reads it from
# ALERTMANAGER_WEBHOOK_TOKEN in the environment/.env (generate one with
# `openssl rand -hex 32`); the backend reads the same variable and refuses every webhook
# request while it is unset.
secrets:
  alertmanager_webhook_token:
    environment: ALERTMANAGER_WEBHOOK_TOKEN

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
