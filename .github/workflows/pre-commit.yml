name: Pre-commit Checks

on:
  workflow_dispatch:  # Manual triggering always available
  pull_request:
    # release/** added for #784: a hotfix PR merges onto release/<major>.<minor>,
    # not master, and that branch produces the next tag -- it must never take
    # machine-unreviewed code (issue #784).
    branches: [master, main, develop, 'release/**']
  # push intentionally left off to respect runner-resource limits — PRs are the gate.
  # push:
  #   branches: [master, main, develop]
  # Required for a merge queue. A queued entry runs its checks against
  # master-plus-the-preceding-queue, NOT against the PR branch — so a required
  # check whose workflow lacks this trigger simply never reports, and the merge
  # hangs forever. This workflow supplies THREE of the four required checks
  # (Run Pre-commit Hooks, Backend Tests, Frontend Unit Tests), so it is the
  # load-bearing one. Added BEFORE the queue is enabled, deliberately: it is
  # inert until then, and enabling the queue first is how a repo bricks its
  # own merges.
  merge_group:

# Cancel a superseded run the moment a new commit lands on the same PR.
#
# Without this, pushing a fix (or merging master up, which this repo does often
# because `strict` is false on branch protection and staleness is caught by
# discipline rather than by GitHub) left the PREVIOUS run going: `Backend Tests
# (pytest)` alone is ~16 minutes, so a stale-base merge-up meant two full runs
# on a runner where only the second one's verdict could ever be used.
#
# Keyed on the PR number (`github.event.pull_request.number`), falling back to
# `github.ref` for `workflow_dispatch`, so concurrent DIFFERENT PRs never cancel
# each other — only successive pushes to the same one.
concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  # Cancel ONLY on pull_request. A merge_group run must never be cancelled:
  # its verdict is what lets the queue merge, so cancelling one stalls the
  # queue behind a check that will never report. `github.ref` is already
  # unique per queue entry (refs/heads/gh-readonly-queue/...), so entries
  # would not cancel each other anyway — this makes the intent explicit
  # rather than relying on that.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Granted per job; nothing here writes to the repo, PRs or issues.
permissions: {}

env:
  FRONTEND_ONLY_HOOKS: frontend-check,i18n-parity,frontend-build,guard-style-literals,guard-eslint-ratchet,guard-svelte-unused,guard-nuia,guard-unused-css,guard-knip,eslint-typed,guard-stylelint-staged,guard-stylelint

jobs:
  # The two hook tiers run in PARALLEL legs of one matrix (issue #1099): measured on master PR
  # runs, the commit tier took ~8-9 min and the push tier ~7-8 min back to back in one job, so
  # the job was ~17 min of which neither half needs the other. Every hook still runs in exactly
  # the leg of its stage; `Run Pre-commit Hooks` below is the required check and fails unless
  # BOTH legs succeed (backend/tests/unit/test_ci_sharding.py pins that).
  pre-commit-stage:
    name: Pre-commit hooks (${{ matrix.stage }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stage: [pre-commit, pre-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-backend-python
        with:
          cache: 'pip'

      - name: Set up Node.js
        uses: ./.github/actions/setup-frontend-node

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      # Hook environments (ruff, mypy, node, ...) are rebuilt from scratch on a miss; keyed on
      # the config hash, per the actions/cache docs. The key carries the stage so the two
      # legs, which build different environments, never race to save one entry.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.stage }}-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ matrix.stage }}-${{ runner.os }}-

      # mypy's incremental cache (mypy docs, "The mypy cache"): the hook runs mypy from the
      # repo root, so the cache lands in `.mypy_cache` there. mypy keys entries by its own
      # version and file hashes, so a stale restore is correct, merely slower.
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .mypy_cache
            backend/.mypy_cache
          key: mypy-${{ matrix.stage }}-${{ runner.os }}-${{ hashFiles('backend/requirements*.txt', '.pre-commit-config.yaml') }}
          restore-keys: |
            mypy-${{ matrix.stage }}-${{ runner.os }}-

      - name: Run pre-commit (pre-commit stage)
        if: matrix.stage == 'pre-commit'
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          # Frontend-only hooks (every id here has a `files:` pattern rooted in frontend/ or
          # scripts/guards/) cannot find anything on a PR that touches neither; `--all-files`
          # would still run them, which is what made a backend-only PR pay for npm and vite.
          # The `changes` job's frontend filter includes the same roots, plus the hook config.
          SKIP: ${{ needs.changes.outputs.frontend != 'true' && env.FRONTEND_ONLY_HOOKS || '' }}

      # ⚠️ BOTH stages, always (issue #688). `pre-commit run` with no --hook-stage runs
      # DEFAULT-stage hooks only, and .pre-commit-config.yaml sets
      # `default_stages: [pre-commit]` — so a hook demoted to `stages: [pre-push]` silently
      # stops running here and the workflow stays green while checking less. That is the
      # exact failure the tiering had to avoid, so the demotion and this step are one change,
      # not two. It currently covers the frontend production vite build (the ONLY one in CI
      # for a PR — docker-publish.yml is workflow_dispatch-only) and the recursive
      # `bandit -r backend/` scan.
      #
      # `--show-diff-on-failure` is kept: shared pre-commit-hooks entries such as
      # trailing-whitespace/end-of-file-fixer declare pre-push in their own stages and can
      # rewrite files here too.
      #
      # backend/tests/unit/test_precommit_stage_ci_parity.py fails the build if any stage a
      # hook is assigned to has no CI invocation. That includes guard-hidden-mypy (the errors a
      # `type: ignore` hides, whole-tree mypy over a stripped copy), which only runs here.
      - name: Run pre-commit (pre-push stage)
        if: matrix.stage == 'pre-push'
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
        env:
          # Needs the backend venv's torch; the backend-tests job runs the same
          # `generate-openapi.py --check` as a required step. The frontend-only hooks are also
          # skipped when the PR does not touch the frontend (see the pre-commit stage above).
          SKIP: ${{ needs.changes.outputs.frontend != 'true' && format('openapi-snapshot,{0}', env.FRONTEND_ONLY_HOOKS) || 'openapi-snapshot' }}

      # Negative control for the mypy hook (issue #1271). The hook runs in an isolated virtualenv;
      # a typed package missing from its additional_dependencies makes mypy treat it as Any and
      # pass code that backend/venv mypy rejects. This runs the real hook on deliberately
      # mistyped code in a throwaway repo and fails the build unless every line is rejected.
      # backend/tests/unit/test_precommit_mypy_env_parity.py checks the config statically.
      - name: Prove the mypy hook still rejects mistyped code
        if: matrix.stage == 'pre-commit'
        run: scripts/mypy-hook-negative-control.sh

      # Alerting rules (issue #791): `promtool check config|rules`, `promtool test rules`
      # and `amtool check-config`, run from the same digest-pinned images the monitoring
      # overlay deploys. Always-run, like the mypy negative control above.
      - name: Check Prometheus alerting rules and Alertmanager config
        if: matrix.stage == 'pre-commit'
        run: scripts/check-prometheus-rules.sh

      - name: Generate pre-commit summary
        if: always()
        run: |
          {
            echo "## Pre-commit Check Results (${{ matrix.stage }} stage)"
            echo ""
            echo "Pre-commit hooks executed on all files for the ${{ matrix.stage }} stage."
          } >> "$GITHUB_STEP_SUMMARY"

  # The REQUIRED check keeps its name. A matrix renames its jobs ("Pre-commit hooks
  # (pre-push)"), and a required check that never reports leaves a PR unmergeable; this job
  # reports under the old name and is green only when every leg is.
  pre-commit:
    name: Run Pre-commit Hooks
    needs: pre-commit-stage
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every pre-commit stage must have succeeded
        env:
          RESULT: ${{ needs.pre-commit-stage.result }}
        run: |
          echo "pre-commit-stage result: $RESULT"
          test "$RESULT" = "success"

  # Detects which parts of the tree a PR touches, so the expensive suites can skip
  # work that cannot possibly be affected. Job-level (not workflow-level `paths:`)
  # ON PURPOSE: all three jobs live in this file, and a workflow-level filter would
  # also skip the pre-commit hooks — which DO matter for a docs-only PR (prettier,
  # markdown, trailing whitespace).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists the changed files through the pulls API on pull_request.
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements*.txt'
              - '.github/workflows/**'
              - '.github/zizmor.yml'
              - 'alembic.ini'
              # ⚠️ The four entries below are NOT incidental (issue #793).
              #
              # `Backend Tests (pytest)` is a REQUIRED check, and branch protection treats a
              # SKIPPED required check as SATISFIED. So a PR touching only these files used to
              # merge with the backend suite never having run — confirmed live on run
              # 34017549729 (PR #774), where both required checks report `skipped`.
              #
              # That is exactly backwards, because ~55 tests under `backend/tests/unit/` exist
              # specifically to guard these files: `test_opentr_stop_container_scoping.py`,
              # `test_shell_expansion_guards.py`, `test_opentr_fresh_aux_isolation.py`,
              # `test_precommit_stage_ci_parity.py`, the compose-validation suites. And
              # `opentr.sh stop` once destroyed 16 unrelated containers (#693) — it is the last
              # file that should merge untested.
              - 'opentr.sh'
              - 'opentranscribe.sh'
              - 'scripts/**'
              - 'docker-compose*.yml'
              # Generated docs tables and the diagram renders are checked by unit tests
              # (test_pipeline_docs_tables.py, test_architecture_diagram_drift.py, issue
              # #1230), so a docs-only PR that hand-edits one must still run the suite.
              - 'docs-site/docs/installation/_generated/**'
              - 'docs-site/docs/installation/deployment-variants.md'
              - 'docs-site/architecture-diagrams/**'
              - 'docs-site/static/architecture/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pre-commit.yml'
              # The frontend-only pre-commit hooks are skipped unless this filter matches, so it
              # must include everything they can be triggered by or defined in.
              - '.pre-commit-config.yaml'
              - 'scripts/guards/**'
              - 'scripts/frontend-check.sh'

  # Resolves every backend requirements file with `pip install --dry-run` (nothing is
  # installed, no torch download beyond metadata) and fails on ResolutionImpossible. No
  # other job resolves requirements.txt: backend-tests installs requirements-ci.txt, and
  # security-scan.yml's pip-audit is non-blocking. That gap let `typer==0.27.3` sit beside
  # `huggingface-hub==1.17.0` (which caps typer<0.26) so the prod file could not be
  # installed. It also fails when requirements-lite/-ci resolve a different version of any
  # package requirements.txt resolves (CI testing starlette 1.10 while the image ships 1.9).
  # Same script runs locally: python3 scripts/check-requirements-resolve.py
  requirements-resolve:
    name: Requirements resolve
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 3.13 to match the images; a different minor can resolve differently.
      - name: Set up Python
        uses: ./.github/actions/setup-backend-python

      - name: Resolve every requirements file and compare lite/CI/dev to prod
        run: |
          python -m pip install --upgrade pip
          python scripts/check-requirements-resolve.py

  backend-test-shard:
    # Best-effort safety net: runs the unit/API suite (the FIPS_MODE re-run is the sibling backend-fips-tests job)
    # against a fresh Postgres with CPU-only deps (requirements-ci.txt — no
    # Docker app images, no GPU wheels). The COMPLETE suite (S3/OpenSearch/
    # integration/E2E) runs locally via scripts/run-integration-tests.sh,
    # which remains the pre-merge source of truth.
    #
    # SHARDED (issue #1099): the suite is split by recorded durations into 8 contiguous groups
    # with pytest-split (https://jerry-git.github.io/pytest-split/usage/), one matrix leg each,
    # so the wall clock is one group's share rather than the whole suite. Each leg still runs
    # pytest-xdist inside it (`-n auto` from pyproject). backend-shard-proof shows the groups
    # are disjoint and together equal the full collection, and backend-tests (the REQUIRED
    # check) merges the per-leg coverage and applies the pyproject fail_under floor.
    # backend/.test_durations only balances the groups; a stale file never drops a test.
    name: Backend test shard ${{ matrix.group }}/8
    needs: changes
    permissions:
      contents: read
    # Dominated by installing CPU torch wheels and the unit/API suite.
    # A docs- or frontend-only PR cannot change its outcome, so don't pay for it.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The cap exists because a hosted-runner apt mirror
    # outage once hung `apt-get update` until the 360-minute ACCOUNT default, burning
    # six hours of runner time without executing a single test (issue #493).
    timeout-minutes: 45
    strategy:
      # One failing group must not hide the other groups' results.
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17.5-alpine # same tag as docker-compose.yml; test_workflows_pinned.py enforces it
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcribe_app
        ports:
          - 5176:5432 # the port backend/tests/conftest.py expects
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5176'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcribe_app
      # No MinIO/OpenSearch services here — keep those suites skipped
      SKIP_S3: 'True'
      SKIP_OPENSEARCH: 'True'
      DATA_DIR: /tmp/ci-data
      MODELS_DIR: /tmp/ci-models
      TEMP_DIR: /tmp/ci-temp
      # Per-leg coverage data and the list of selected tests. Non-hidden file names, so
      # upload-artifact ships them without include-hidden-files.
      COVERAGE_FILE: ${{ github.workspace }}/backend/cov-shard-${{ matrix.group }}.dat
      OT_SHARD_MANIFEST: ${{ github.workspace }}/backend/shard-${{ matrix.group }}.manifest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-backend-python
        with:
          cache: 'pip'
          cache-dependency-path: backend/requirements-ci.txt

      # Downloaded .deb files, so a warm run does not re-download ffmpeg and its ~100 dependencies
      # (actions/cache docs: caching dependencies). `apt-get update` still runs, so the index is
      # current; the key changes whenever the package list in this workflow does.
      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ hashFiles('.github/workflows/pre-commit.yml') }}
          restore-keys: |
            apt-ffmpeg-${{ runner.os }}-

      - name: Install system dependencies
        # Bounded separately from the job: a mirror that stops answering should fail this
        # step in minutes, not consume the whole job budget retrying (issue #493).
        # libpq-dev: requirements-ci.txt pins psycopg2 (source build), not
        # psycopg2-binary -- the binary wheel vendors its own bundled libpq/pcre2
        # via auditwheel, which is how a stale, CVE-flagged pcre2 ended up baked
        # into the arm64 lite image (issue #951). Building against the system
        # libpq here means CI actually exercises the same driver the images ship.
        # libimage-exiftool-perl: every backend image ships exiftool, and the
        # media-duration tests (#969/#974) run real files through it.
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" install -y ffmpeg libpq-dev libimage-exiftool-perl

      - name: Install Python dependencies (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Verify app imports
        working-directory: backend
        run: python -c "import app.main"
        env:
          TESTING: 'True'

      # Generation needs torch/transformers, which backend-tests has already installed above
      # (~13 s marginal here vs ~17 min for a standalone workflow to install CPU wheels from
      # scratch). Always --check, never --write: CI must never regenerate the file it is
      # comparing against, only fail loudly when it drifts from what's committed. This step is
      # a REQUIRED check; branch protection treats a SKIPPED required check as SATISFIED (run
      # 34017549729 / PR #774), which is safe here only because the `changes` job's backend
      # path filter (all under backend/**, plus scripts/**) covers every schema input — a
      # frontend/docs-only PR cannot change the OpenAPI schema, so skipping this step for one
      # is correct, not a gap.
      - name: OpenAPI snapshot is current
        # Once per run, not once per shard: it does not depend on which tests ran.
        if: matrix.group == 1
        run: python3 scripts/generate-openapi.py --check
        env:
          TESTING: 'True'

      # The Deployment variants page's tables (published images, provider speakers/timing,
      # the transcription x speaker-detection validity matrix) are generated from
      # docker-build-push.sh, ASR_PROVIDER_CATALOG and resolve_pipeline_plan (issue #1230).
      # Same contract as the OpenAPI step: --check only, never regenerate here.
      - name: Pipeline docs tables are current
        # Once per run, not once per shard: it does not depend on which tests ran.
        if: matrix.group == 1
        run: python3 scripts/generate-pipeline-docs.py --check
        env:
          TESTING: 'True'

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: "Run this shard of the unit/API test suite"
        working-directory: backend
        run: |
          # pipefail is REQUIRED: GitHub's default shell is `bash -e {0}` WITHOUT
          # pipefail, so `pytest | tee` exits with tee's status (0) and pytest
          # failures silently pass the job. This masked real failures for months.
          set -o pipefail
          # `python -m pytest` puts backend/ on sys.path, which `-p tests.shard_manifest` needs.
          # Coverage is NOT enforced here: one group executes a fraction of app/, so the
          # pyproject floor would fail every leg. --cov-fail-under=0 defers the floor to the
          # merged report in backend-tests.
          python -m pytest tests/ -p tests.shard_manifest \
            --splits 8 --group ${{ matrix.group }} \
            --splitting-algorithm duration_based_chunks --durations-path .test_durations \
            --cov=app --cov-report= --cov-fail-under=0 | tee pytest-output.txt
          {
            echo "## Backend test shard ${{ matrix.group }}/8"
            echo '```'
            tail -40 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage data and shard manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-shard-${{ matrix.group }}
          path: |
            backend/cov-shard-${{ matrix.group }}.dat
            backend/shard-${{ matrix.group }}.manifest
          retention-days: 7
          if-no-files-found: error

      # Mirrors the frontend-tests job below: self-test the auditor, THEN run it.
      # Duplicated with the pre-commit hooks on purpose — this is where the verdict
      # belongs in the log, right next to the suite whose quality it is judging, and
      # the auditor is stdlib-only so it costs ~10 s and needs no extra install.
      #
      # A detector that stops matching reports zero findings, which reads exactly like
      # a clean suite. Never reorder these two steps.
      - name: Self-test the test auditor
        # Once per run, not once per shard: it does not depend on which tests ran.
        if: matrix.group == 1
        run: python3 scripts/audit-tests.py --selftest

      # Fails on any un-allowlisted test that passes whether the code works or not.
      # Also prints the DEFERRED-WORK (BACKLOG) count from
      # backend/tests/audit-allowlist.txt, so a green gate is never mistaken for a
      # clean tree, and fails on a stale allowlist entry so the list can only shrink.
      - name: Audit backend test quality
        # Once per run, not once per shard: it does not depend on which tests ran.
        if: matrix.group == 1
        run: python3 scripts/audit-tests.py backend/tests

  # The proof that sharding is lossless (issue #1099): collects the WHOLE suite once, unsplit,
  # in parallel with the shards, and backend-tests compares its list with the union of the
  # shards' lists via scripts/guards/check_shard_coverage.py. A test can then be neither run
  # twice nor dropped by the split, whatever happens to the durations file.
  backend-shard-proof:
    name: Backend full collection (shard proof)
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine # same tag as docker-compose.yml; test_workflows_pinned.py enforces it
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcribe_app
        ports:
          - 5176:5432 # the port backend/tests/conftest.py expects
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5176'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcribe_app
      # No MinIO/OpenSearch services here — keep those suites skipped
      SKIP_S3: 'True'
      SKIP_OPENSEARCH: 'True'
      DATA_DIR: /tmp/ci-data
      MODELS_DIR: /tmp/ci-models
      TEMP_DIR: /tmp/ci-temp
      # The unsplit selection every shard is checked against.
      OT_SHARD_MANIFEST: ${{ github.workspace }}/backend/full.manifest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-backend-python
        with:
          cache: 'pip'
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install Python dependencies (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Collect the whole suite, unsplit
        working-directory: backend
        run: python -m pytest tests/ -p tests.shard_manifest --collect-only -q -n0

      - name: Upload the full manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-shard-full
          path: backend/full.manifest
          retention-days: 7
          if-no-files-found: error

  # THE REQUIRED CHECK, under its original name. A matrix renames its jobs, and a required
  # check that never reports leaves a PR unmergeable (and a skipped one counts as satisfied),
  # so this job keeps the name `Backend Tests (pytest)`, is skipped exactly when the shards are
  # (no backend change), and otherwise is green only when every shard passed, the shards are a
  # perfect partition of the suite, and the MERGED coverage clears the pyproject fail_under.
  backend-tests:
    name: Backend Tests (pytest)
    needs: [changes, backend-test-shard, backend-shard-proof]
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Every shard and the proof must have succeeded
        env:
          SHARDS: ${{ needs.backend-test-shard.result }}
          PROOF: ${{ needs.backend-shard-proof.result }}
        run: |
          echo "shards: $SHARDS, proof: $PROOF"
          test "$SHARDS" = "success" && test "$PROOF" = "success"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-backend-python

      - name: Download shard coverage and manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: backend-shard-*
          path: shard-artifacts
          merge-multiple: true

      - name: The shards run every test exactly once
        run: >-
          python3 scripts/guards/check_shard_coverage.py
          --full shard-artifacts/full.manifest
          shard-artifacts/shard-1.manifest shard-artifacts/shard-2.manifest shard-artifacts/shard-3.manifest shard-artifacts/shard-4.manifest shard-artifacts/shard-5.manifest shard-artifacts/shard-6.manifest shard-artifacts/shard-7.manifest shard-artifacts/shard-8.manifest

      # Coverage ENFORCED, as before: `coverage report` applies [tool.coverage.report]
      # fail_under from backend/pyproject.toml to the combined data of all shards.
      - name: Merge coverage and enforce the floor
        working-directory: backend
        run: |
          pip install "coverage==7.16.1"
          cp ../shard-artifacts/cov-shard-*.dat .
          coverage combine --keep cov-shard-*.dat
          set -o pipefail
          coverage report | tee coverage-report.txt
          {
            echo "## Backend Test Coverage (merged over 8 shards, floor: pyproject fail_under)"
            echo '```'
            tail -40 coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-fips-tests:
    # Split out of backend-tests (issue #1377) so the FIPS re-run has its own time budget and
    # runs in parallel with the main suite instead of extending it.
    name: Backend Security Suites (FIPS_MODE)
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.5-alpine # same tag as docker-compose.yml; test_workflows_pinned.py enforces it
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcribe_app
        ports:
          - 5176:5432 # the port backend/tests/conftest.py expects
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5176'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcribe_app
      # No MinIO/OpenSearch services here — keep those suites skipped
      SKIP_S3: 'True'
      SKIP_OPENSEARCH: 'True'
      DATA_DIR: /tmp/ci-data
      MODELS_DIR: /tmp/ci-models
      TEMP_DIR: /tmp/ci-temp
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-ci.txt

      # Downloaded .deb files, so a warm run does not re-download ffmpeg and its ~100 dependencies
      # (actions/cache docs: caching dependencies). `apt-get update` still runs, so the index is
      # current; the key changes whenever the package list in this workflow does.
      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ hashFiles('.github/workflows/pre-commit.yml') }}
          restore-keys: |
            apt-ffmpeg-${{ runner.os }}-

      - name: Install system dependencies
        # Bounded separately from the job: a mirror that stops answering should fail this
        # step in minutes, not consume the whole job budget retrying (issue #493).
        # libpq-dev: requirements-ci.txt pins psycopg2 (source build), not
        # psycopg2-binary -- the binary wheel vendors its own bundled libpq/pcre2
        # via auditwheel, which is how a stale, CVE-flagged pcre2 ended up baked
        # into the arm64 lite image (issue #951). Building against the system
        # libpq here means CI actually exercises the same driver the images ship.
        # libimage-exiftool-perl: every backend image ships exiftool, and the
        # media-duration tests (#969/#974) run real files through it.
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" install -y ffmpeg libpq-dev libimage-exiftool-perl

      - name: Install Python dependencies (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt

      - name: Verify app imports
        working-directory: backend
        run: python -c "import app.main"
        env:
          TESTING: 'True'

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      # The CI twin of run-integration-tests.sh's `Security suites (FIPS_MODE=true)` phase,
      # and it must stay a twin: same eight files, same one live variable.
      #
      # ⚠️ There is deliberately NO `RUN_*_TESTS` env block here, and re-adding one is a
      # regression. This step used to export seven — RUN_PKI_TESTS, RUN_MFA_TESTS,
      # RUN_LLM_TESTS, RUN_FEDRAMP_TESTS, RUN_FIPS_TESTS, RUN_AUTH_CONFIG_TESTS,
      # RUN_ADVANCED_ADMIN_TESTS — that **no test reads**. The module-level `skipif` gates
      # were deleted from all eight suites (each now opens `# Runs by DEFAULT. This module
      # was gated behind RUN_<X>_TESTS...`) and only the exports were left behind, so a step
      # called "security-gated suites" gated nothing. Commit b75ecc5b removed the local half;
      # this is its CI twin, which the same commit missed.
      # backend/tests/unit/test_gate_run_env_vars_are_live.py now scans these workflows too
      # and fails on any RUN_* here that no test reads.
      #
      # FIPS_MODE is the one real claim: app/core/config.py reads it at import, so running
      # these files a second time under it genuinely exercises different code.
      #
      # `tests/test_admin_endpoints.py` is NOT in the list. It is not in the gate script's
      # FIPS_MODE_SUITES either, and `pytest tests/` above has already run it — re-running it
      # here bought a duplicate EXECUTION and zero tests.
      # RUN_SEARCH_QUALITY_TESTS is deliberately absent as well: it IS live, but it drives a
      # corpus-dependent relevance harness that needs OpenSearch, which this job forces off.
      - name: Re-run the security suites under FIPS_MODE=true
        working-directory: backend
        env:
          FIPS_MODE: 'true'
        run: >-
          pytest tests/pki_auth tests/test_mfa_security.py
          tests/test_llm_settings.py tests/test_fedramp_compliance.py
          tests/test_fedramp_controls.py tests/test_fips_140_3.py
          tests/test_auth_config_service.py tests/test_admin_security.py
          -o addopts="" -n auto --dist loadgroup -q --tb=short

  frontend-tests:
    name: Frontend Unit Tests (Vitest)
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install frontend dependencies
        uses: ./.github/actions/setup-frontend-node
        with:
          install: 'true'

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check i18n key parity
        working-directory: frontend
        run: npm run check:i18n

      # Runs the suite WITH coverage so the ratchet floors in frontend/vitest.config.ts
      # are evaluated here; plain `npm run test` never checks them.
      - name: Run Vitest with coverage
        working-directory: frontend
        # `npm run test` gets `svelte-kit sync` from its pretest hook; test:coverage has no
        # such hook, and without the generated .svelte-kit/tsconfig.json vitest cannot start.
        run: |
          npx svelte-kit sync
          npm run test:coverage

      # Self-test FIRST: the auditor's detectors are themselves code that can silently stop
      # matching, and a broken detector is indistinguishable from a clean suite.
      - name: Self-test the test auditor
        working-directory: frontend
        run: npm run test:audit:selftest

      # Fails on any test that passes whether the code works or not (.only leaks, assertions
      # that cannot fail, conditional-only assertions, un-awaited rejects chains). Exemptions
      # go in frontend/test-audit-allowlist.txt with a mandatory reason.
      - name: Audit test quality
        working-directory: frontend
        run: npm run test:audit

      # Dead code (knip) and import cycles (madge) are not a step here: they are the
      # `guard-knip` pre-commit hook (push stage), which the pre-commit job above runs on every
      # PR, so local `--hook-stage pre-push` and CI run the same command.
