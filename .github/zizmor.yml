# zizmor configuration. Every entry is an exception and needs a written reason.
# Entries are scoped to individual lines so a NEW finding in a fenced file is not hidden.
# They go stale if the file is edited above them: re-run zizmor and move or delete them.
rules:
  excessive-permissions:
    ignore:
      # Fenced: docker-publish.yml is a retired stub owned by the release workstream;
      # its top-level permissions: {} lands after the release.
      - docker-publish.yml:61
  dangerous-triggers:
    ignore:
      # docs-live-check.yml must run AFTER a Deploy Documentation run has finished, which only
      # workflow_run expresses: as a job inside deploy-docs.yml it would see its own run still in
      # progress and judge the site against the previous deploy. The risks zizmor names are closed
      # in the job's `if:` (master pushes of this repository only, never a pull_request or fork
      # run), the check job checks out that run's commit with read-only permissions and no
      # persisted credentials, and the alert job checks out nothing.
      - docs-live-check.yml:16
  self-repository:
    ignore:
      # zizmor wants `uses: $/.github/actions/...` for the local composite actions, but the
      # newest actionlint (v1.7.12, pinned in .pre-commit-config.yaml) rejects `$/` as an invalid
      # action format. The two lint hooks cannot both pass on any spelling; `./` is the form
      # GitHub documents and every runner supports. Drop this entry when actionlint accepts `$/`
      # and switch the workflows over.
      - dependency-review.yml
      - deploy-docs.yml
      - pre-commit.yml
      - security-scan.yml
