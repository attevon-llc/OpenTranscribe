# LDAP test environment (LLDAP) — a throwaway IdP for auth development/testing.
#
# Load it WITH the stack so it joins the same compose project (and therefore the
# same network). `./opentr.sh` is the only supported entry point:
#   ./opentr.sh start dev --with-ldap-test
#   ./opentr.sh start dev --fresh t1 --port-offset 100 --with-ldap-test
#
# Access from the host (loopback only — see the ports note below):
#   - LLDAP Web UI: http://localhost:${LDAP_TEST_UI_PORT:-17170}
#   - LDAP server:  ldap://localhost:${LDAP_TEST_PORT:-3890}
#   - Login: admin / admin_password
#
# Access from the backend/worker containers — always use the network ALIAS, not
# the container name. The alias is stable; `--fresh` re-pins container_name to
# otfresh-<name>-lldap (issue #347):
#   LDAP_SERVER=ldap://lldap-test    LDAP_PORT=3890
#
# Bind DN: uid=admin,ou=people,dc=example,dc=com
# Search base: dc=example,dc=com

services:
  lldap:
    image: lldap/lldap:stable
    container_name: lldap-test
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback-only, matching the base file's convention for infra ports: this
      # is a test IdP with a published admin password and a hard-coded JWT
      # secret, so it must never be reachable off-host. Containers reach it over
      # the compose network at ldap://lldap-test:3890.
      - "127.0.0.1:${LDAP_TEST_PORT:-3890}:3890"      # LDAP port
      - "127.0.0.1:${LDAP_TEST_UI_PORT:-17170}:17170" # Web UI port
    environment:
      - LLDAP_JWT_SECRET=supersecretjwttokenfortest
      - LLDAP_LDAP_USER_PASS=admin_password
      - LLDAP_LDAP_BASE_DN=dc=example,dc=com
    volumes:
      - lldap_data:/data
    networks:
      # The project's implicit default network. The alias keeps ldap://lldap-test
      # resolvable no matter what container_name this service ends up with, so a
      # fresh deployment's backend reaches ITS OWN LLDAP with the same config.
      default:
        aliases:
          - lldap-test

volumes:
  lldap_data:
