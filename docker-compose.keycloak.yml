# Keycloak and PKI development environment.
#
# Load it WITH the stack so it joins the same compose project (and therefore the
# same network). `./opentr.sh` is the only supported entry point:
#   ./opentr.sh start dev --with-keycloak-test
#   ./opentr.sh start dev --fresh t1 --port-offset 100 --with-keycloak-test
#
# Step CA is profile-gated: add `--profile pki` to include it.
#
# Keycloak admin console: http://localhost:${KEYCLOAK_PORT:-8180}
# Default credentials: admin / admin
#
# Neither service declares a container_name, so the compose project namespaces
# them automatically; containers reach them by SERVICE name (keycloak, step-ca).

services:
  keycloak:
    # Built locally so Quarkus augmentation happens ONCE at image-build time instead of on
    # every container start. `start-dev` re-augments each boot and the output is not on the
    # volume, so nothing is reused: measured ~600 s to "Listening on" here, which blew the
    # healthcheck budget, failed `up --wait`, and aborted `run-dev-tests.sh --full` before a
    # single test ran. The pre-built image starts in ~19 s (25 s to healthy). See
    # docker/keycloak/Dockerfile for the full measurement.
    #
    # The version is PINNED there, not `:latest` (issue #492 — the gate's auth phase must not
    # run against whatever Keycloak shipped that morning). It is 26.7.3: the version this host
    # was already running. ⚠️ Do not "pin back" to an older tag — an earlier revision of this
    # file pinned 26.4.7, which is a DOWNGRADE against a `keycloak_data` volume written by
    # 26.7.3, and this repo's rule is that versions move forward only.
    build:
      context: ./docker/keycloak
    image: opentranscribe-keycloak-test:26.7.3
    # `--optimized` tells Keycloak the build is already done. It REQUIRES that the build-time
    # options baked into the image (KC_DB, KC_HEALTH_ENABLED) match at run time, or startup
    # refuses rather than silently re-augmenting.
    command: ["start", "--optimized", "--http-enabled=true", "--hostname-strict=false"]
    security_opt:
      - no-new-privileges:true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Required for the healthcheck below. Since Keycloak 25 the health
      # endpoints live on the separate management port (9000) and are only
      # served when this is set — without it /health/ready is a 404 on 8080 and
      # nothing listens on 9000, so `up --wait` fails on a Keycloak that is
      # actually working fine.
      KC_HEALTH_ENABLED: "true"
    ports:
      # Loopback-only, matching the base file's convention: this is a dev IdP
      # whose admin credentials default to admin/admin.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # Probes the MANAGEMENT port (9000), not 8080 — see KC_HEALTH_ENABLED above.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e \"GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n\" >&3;grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
      # MEASURED. With the pre-built `--optimized` image above, Keycloak reaches
      # "Listening on" in ~19 s and `up --wait` returns healthy in ~25 s (measured 2026-09-06,
      # both stock `docker run` and an isolated compose project).
      #
      # 120 s is ~5x that headroom, for a cold image pull or a host also building images and
      # running a 48-worker pytest. It was 900 s while the container still re-augmented on
      # every boot (~600 s); that budget is obsolete now that the build happens once, at image
      # build time. Do not raise it again without re-measuring — a large budget here hides a
      # regression in the image rather than reporting one.
      start_period: 120s

  # Step CA for PKI testing (dev only)
  # Start with: docker compose -f docker-compose.keycloak.yml --profile pki up -d
  step-ca:
    image: smallstep/step-ca:latest
    profiles: ["pki"]
    security_opt:
      - no-new-privileges:true
    environment:
      DOCKER_STEPCA_INIT_NAME: OpenTranscribe Dev CA
      DOCKER_STEPCA_INIT_DNS_NAMES: localhost,step-ca
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: admin
    ports:
      # Loopback-only: a dev CA that will issue certs to anyone who asks.
      - "127.0.0.1:${STEP_CA_PORT:-9000}:9000"
    volumes:
      - step_ca_data:/home/step

volumes:
  keycloak_data:
  step_ca_data:
