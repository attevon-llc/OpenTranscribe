name: Bug report
description: Report something that isn't working as intended
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick every area this bug touches. A workflow uses this to apply the matching labels automatically.
      multiple: true
      options:
        - backend
        - frontend
        - asr
        - search
        - rag-chat
        - llm-provider
        - gpu
        - docker
        - security
        - performance
        - testing
        - documentation
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS: [e.g. Ubuntu 22.04, macOS 13.0, Windows 11]
        - Browser: [e.g. Chrome 118, Firefox 119, Safari 16]
        - OpenTranscribe Version: [e.g. v1.0.0 or commit hash]
        - Docker Version: [if applicable]
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Audio/Video File Details (if applicable)
      value: |
        - File format: [e.g. MP4, MP3, WAV]
        - File size: [e.g. 500MB]
        - Duration: [e.g. 30 minutes]
        - Sample rate: [if known]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If applicable, add relevant log output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
