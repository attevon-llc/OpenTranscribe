name: Deploy Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
      # The homepage version badge is read from VERSION at build time, so a release
      # bump has to redeploy the site or the badge stays on the previous version.
      - 'VERSION'
  # Issue #793: a broken Docusaurus build was only ever caught by a FAILED DEPLOY on
  # master, after merge — docs-site is built into a published image, so that is a real
  # pre-merge hole. This PR trigger runs the `build` job only (see the `deploy` job's
  # `if:`, gated on push+master); it never touches GitHub Pages.
  #
  # Path-filtered at the TRIGGER, not deliberately NOT wired as a required check
  # (see the concurrency comment below for why that pairing matters here): issue #793
  # itself records run 34017549729 / PR #774, where a path-filtered required check that
  # simply didn't run for an unrelated PR was reported `skipped`, and branch protection
  # counted `skipped` as satisfied. This workflow's `deploy-docs / build` is NOT added to
  # branch protection's required-checks list for that reason — a path filter and a
  # required check are safe together only via the job-level `changes`-detection pattern
  # (see `.github/workflows/pre-commit.yml`'s `changes` job), which this workflow does not
  # need because it is advisory, not required.
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
      - 'VERSION'
  # The roadmap page is DERIVED from the issue tracker and regenerated in the build
  # below, so the published page goes stale whenever issues move without anything
  # under `paths:` changing — which is most days. A daily redeploy keeps it at most a
  # day behind. This cron replaces the one in the deleted roadmap.yml, which tried to
  # achieve the same thing by opening a PR against the committed data and could not:
  # the org forbids Actions from creating pull requests, so four consecutive scheduled
  # runs failed at `gh pr create` after successfully regenerating and pushing.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # generate-roadmap.py reads `gh issue list`. Projects v2 would need a PAT; issues
  # do not, which is why the roadmap is derived from milestones and `epic:*` labels
  # rather than from the org board.
  issues: read

concurrency:
  # A PR build must never queue behind (or block) the shared "pages" deploy lane, and
  # must never share it: a PR run and a push-triggered deploy racing for the same group
  # is how a legitimate deploy gets stuck waiting on a PR's build. PR runs get their own
  # per-PR group and may cancel-in-progress on a new push; the push/schedule/dispatch
  # deploy lane keeps its original group and never cancels (a deploy is not something to
  # interrupt mid-flight).
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The homepage badge (docusaurus.config.ts's isUnpublishedVersion, issue #686)
          # derives "is VERSION ahead of the newest release tag" from local git tag
          # history. The default shallow/no-tags checkout would make that check always
          # report "not dev" (fails closed), silently defeating the whole point.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Regenerate, never commit. src/pages/roadmap.tsx imports the JSON at build time,
      # so generating it here means the PUBLISHED page is derived from the tracker at
      # the moment it deploys — drift is impossible rather than merely repaired.
      #
      # The file stays checked in for one reason: the self-hosted docs Docker image has
      # no network and no `gh`, so it cannot generate at image-build time. That copy is a
      # per-release snapshot; this step is what keeps the live site ahead of it.
      #
      # NON-FATAL on failure, deliberately. A GitHub API blip must not fail a docs
      # deploy — the committed file is a working fallback. But a silent fallback is how
      # stale data hides, so it annotates the run rather than passing quietly.
      - name: Regenerate the roadmap from the issue tracker
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python3 scripts/generate-roadmap.py; then
            echo "Roadmap regenerated from the live tracker."
          else
            echo "::warning::generate-roadmap.py failed — deploying the COMMITTED roadmap.json, which may be stale. The page still builds; re-run this workflow once the API is reachable."
          fi

      - name: Build documentation
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

  deploy:
    # Issue #793: this job must NEVER run for a pull_request — it is the only job that
    # publishes anything (GitHub Pages), and a PR's job is `build` only. Gated on the
    # event AND the ref rather than just excluding `pull_request`, so a push to a
    # non-master branch (or a workflow_dispatch off one) also cannot deploy.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
