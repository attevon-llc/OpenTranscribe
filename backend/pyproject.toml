[build-system]
requires = ["setuptools", "wheel"]

# No first-party wheel is ever built from this table — Dockerfile.prod copies backend/ as
# source and installs requirements.txt directly, never `pip install .` — so [build-system]
# above has been vestigial since it was added. This [project] table exists only to declare
# metadata (name/version/license) for tooling that reads pyproject.toml directly (e.g. an
# SBOM generator), not to make the backend installable. Kept in sync with the root
# pyproject.toml's `license`/`version` by hand; nothing enforces that automatically.
[project]
name = "opentranscribe-backend"
version = "0.5.0"
description = "OpenTranscribe FastAPI backend: transcription, diarization, and LLM features"
authors = [
    {name = "OpenTranscribe Contributors"}
]
requires-python = ">=3.12"
license = "AGPL-3.0-only"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[tool.ruff]
# Same as Black.
line-length = 100

# py312 matches the runtime; the 3.12+ pyupgrade codemod landed with this bump.
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "C90", "B", "A", "S", "SIM", "PIE"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E203",  # Whitespace before ':' (conflicts with black)
    "S101",  # Use of assert (common in tests)
    "B008",  # Do not perform function call in argument defaults (FastAPI dependencies)
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests: allow assertions, magic values, test credentials, try-except-pass,
# requests without timeout, subprocess calls, imports after skip markers, etc.
"**/tests/**" = [
    "S101", "PLR2004",                  # assertions, magic values
    "S105", "S106", "S107",             # hardcoded test passwords/credentials
    "S110", "SIM105",                   # try-except-pass (test teardown)
    "S113", "S310",                     # requests without timeout, URL open audit
    "S603", "S607", "S608",             # subprocess calls, SQL in test fixtures
    "E402",                             # imports after pytest.mark.skipif
    "N801",                             # TestFIPS140_3 naming matches spec
    "F841",                             # unused variables (test assertions via side effects)
    "SIM102", "SIM117", "SIM222",       # nested if/with statements, readability over brevity
    "B007",                             # unused loop variables in test iterations
]
# Allow imports at top level of __init__.py
"__init__.py" = ["F401"]
# The AHC similarity routine uses mathematical variable names (M, MT, Z)
"**/clustering/similarity.py" = ["N806"]
# Long linear index-rebuild / bulk-scroll routines (rebuild_speaker_index,
# iter_speaker_embeddings). Narrowed from the whole opensearch_service package
# to these two files in #284 A3.3; S110 (try-except-pass) is no longer exempt
# anywhere outside tests.
"**/opensearch_service/repair.py" = ["C901"]
"**/opensearch_service/speaker_read.py" = ["C901"]
# Alembic versions use string-based SQL construction
"**/alembic/**" = ["S608"]

[tool.ruff.lint.mccabe]
# Auth functions (login, LDAP, OIDC, PKI) are inherently complex.
# 16 is standard for auth-heavy codebases.
max-complexity = 16

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
# `mutants` is mutmut's generated tree (gitignored, but bandit walks the FILESYSTEM,
# not the index). Without it a mutation run leaves ~330k lines of deliberately
# corrupted source behind and bandit reports findings in mutated code — the first
# run failed pre-commit on a `token_algorithm = ""` in mutants/app/core/security.py.
exclude_dirs = ["tests", "*/mutants/*"]
# Test files have legitimate use of hardcoded credentials and other security patterns
# These are flagged by bandit but are appropriate for test fixtures

# Import-linter: enforce the cloud seam direction as a build invariant.
# The closed-source cloud edition imports this open-source core (`app.*`),
# NEVER the reverse. There is no `cloud` package in this repo, so the
# contract holds trivially today — its job is to FAIL the build the moment a
# `from cloud import ...` (or `import clerk` / `import stripe`) accidentally
# leaks into core. Run via `lint-imports` (pre-commit hook + local gate).
[tool.importlinter]
root_package = "app"
# clerk/stripe are external (non-`app`) packages, so the forbidden contract
# must opt in to analysing external imports.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core (app) must not import the closed cloud edition"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["cloud", "clerk", "stripe"]

# Layering contracts. The ignore lists were generated from an empty list: every
# ignore below is one real edge that exists today, so a new upward import fails and
# a removed one makes its ignore stale (unmatched_ignore_imports_alerting = "error")
# until it is deleted.
[[tool.importlinter.contracts]]
name = "Lower layers must not import app.api"
type = "forbidden"
source_modules = [
  "app.models", "app.schemas", "app.db", "app.core", "app.utils", "app.services",
  "app.tasks", "app.transcription", "app.auth", "app.middleware",
]
forbidden_modules = ["app.api"]
allow_indirect_imports = false
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
  "app.core.capabilities -> app.api.endpoints.auth",  # upward import, function level: removal planned (layering)
  "app.services.pipeline_plan_inputs -> app.api.deps_context",  # upward import, function level: removal planned (layering)
  "app.services.storage_recovery_service -> app.api.endpoints.files.upload",  # upward import, function level: removal planned (layering)
  "app.services.watch_sources.processing -> app.api.endpoints.files.prepare_upload",  # upward import, function level: removal planned (layering)
  "app.services.watch_sources.processing -> app.api.endpoints.files.upload",  # upward import, function level: removal planned (layering)
  "app.tasks.rediarize_task -> app.api.endpoints.files.reprocess",  # upward import, function level: removal planned (layering)
  "app.tasks.speaker_merge_task -> app.api.endpoints.speakers_merge",  # upward import, function level: removal planned (layering)
  "app.tasks.speaker_update_task -> app.api.endpoints.speaker_update",  # upward import, function level: removal planned (layering)
  "app.tasks.speaker_update_task -> app.api.endpoints.speakers_profile_workflow",  # upward import, function level: removal planned (layering)
  "app.tasks.youtube_processing -> app.api.endpoints.files.prepare_upload",  # upward import, function level: removal planned (layering)
]

[[tool.importlinter.contracts]]
name = "Foundation layers must not import app.tasks"
type = "forbidden"
source_modules = ["app.models", "app.schemas", "app.db", "app.core", "app.utils"]
forbidden_modules = ["app.tasks"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
  "app.utils.file_retry -> app.tasks.search_indexing_task",  # deliberate late binding: Celery task lookup
  "app.utils.stuck_file_recovery -> app.tasks.transcription",  # deliberate late binding: Celery task lookup
  "app.utils.task_cancel -> app.tasks.transcription.cancellation",  # deliberate late binding: Celery task lookup
]

