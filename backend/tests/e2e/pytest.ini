[pytest]
# E2E Test Configuration

# Base URL for frontend (can be overridden with --base-url)
base_url = http://localhost:5173

# Browser options
# Run headless by default, use --headed for visible browser
#
# --strict-markers is not optional here. This file is a SEPARATE rootdir config, so
# backend/pyproject.toml's addopts never apply to E2E — including its --strict-markers. Without
# it a misspelled marker silently selects nothing: `-m uplaod` reports "0 tests" and exits 0,
# which is indistinguishable from a clean run. Every marker used under tests/e2e/ must appear
# in the `markers` list below.
#
# --strict-markers closes only ONE direction: a marker on a test that nobody registered. The
# reverse — a marker registered here that no test carries — is just as silent, and had three
# offenders (`smoke`, `gallery`, `api_e2e`) that made `-m <marker>` select nothing at all.
# backend/tests/unit/test_pytest_config_consistency.py now enforces BOTH halves (issue #431);
# it used to assert only the first while claiming both.
addopts = --browser chromium --strict-markers

# Slow down operations for debugging (milliseconds)
# Uncomment for debugging:
# --slowmo 100

# Screenshot on failure
# --screenshot only-on-failure

# Video recording (off by default, can be on/retain-on-failure)
# --video off

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: marks tests related to authentication (LDAP, OIDC, PKI login flows)
    pki: PKI certificate authentication tests (requires RUN_PKI_E2E=true)
    keycloak: tests needing the Keycloak/OIDC test container (--with-keycloak-test)
    ldap: tests needing the LDAP test container (--with-ldap-test)
    watch: tests needing the watch-sources host-folder overlay (--with-watch)
    e2e: end-to-end tests (module-level marker used by API-driven e2e files)
    gallery: gallery page and bulk-action tests
    upload: media upload flow tests (file, URL, record tabs)
    search: search page tests
    settings: settings modal tests
    transcription: transcript viewing/editing tests (need a completed media file)
    responsive: viewport/responsive layout tests
    visual: visual regression tests (screenshot baselines)
    chat: RAG chat page tests (need an LLM provider + a completed transcript)
    tags: tag manager route tests (/tags: list, scope, rename, delete, promote)
    collections: collections manager tests (create, add file, filter, rename, delete)
