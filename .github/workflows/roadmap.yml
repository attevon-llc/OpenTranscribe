name: Roadmap

# The published roadmap is DERIVED from the issue tracker (epic:* labels, milestones,
# open/closed state) into docs-site/src/data/roadmap.json, which src/pages/roadmap.tsx
# renders. Regenerating by hand means it is stale the first time an issue moves.
#
# It reads ISSUES, not the org Project board: `gh issue list` works with the built-in
# GITHUB_TOKEN, whereas Projects v2 needs a PAT with `project` scope.
#
# The docs Docker image has no network and no `gh`, so generation cannot happen at
# image-build time. This opens a PR with the regenerated data; the image builds
# whatever is on the branch.
#
# ── Two things this workflow learned the hard way ────────────────────────────────
#
# 1. It does NOT trigger on issue events. It used to fire on labeled/milestoned/
#    closed, and a single bulk re-labelling of 218 issues produced ~400 runs that
#    all raced the same concurrency group. A daily run plus manual dispatch keeps
#    the page at most a day stale and costs one run instead of hundreds.
#
# 2. It does NOT push to master. `master` is protected ("Changes must be made
#    through a pull request", 4 required checks) and GITHUB_TOKEN is not exempt,
#    so every push was rejected with GH006 after the commit had already been made.
#    A repository admin pushing by hand does not hit this, which is why it was not
#    caught before the workflow shipped.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: roadmap
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate docs-site/src/data/roadmap.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-roadmap.py

      - name: Open or update a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs-site/src/data/roadmap.json; then
            echo "Roadmap unchanged — nothing to do."
            exit 0
          fi

          BRANCH=chore/roadmap-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always rebuild the branch from the current default branch. The roadmap is
          # fully derived, so there is nothing on the old branch worth preserving and
          # a force push avoids an unmergeable history after several days of drift.
          git checkout -B "$BRANCH"
          git add docs-site/src/data/roadmap.json
          git commit -m "docs(roadmap): regenerate from issue milestones and epic labels"
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH — force push refreshed it."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "docs(roadmap): regenerate roadmap data" \
              --body "Generated by \`scripts/generate-roadmap.py\` from issue milestones and \`epic:*\` labels. No hand edits — re-running the script reproduces this exactly."
          fi
