# Scheduled Database Backups overlay (Feature C)
#
# Mounts a host directory into the services that read/write backups and exposes it
# at the in-container path /backups (the coded DEFAULT_BACKUP_DESTINATION). Load via:
#   ./opentr.sh start dev --with-backup        (when wired into opentr.sh)
# or explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.backup.yml up -d
#
#   BACKUP_HOST_PATH         host directory that receives the .dump files
#                            (default ./backups) → /backups in the containers below
#   BACKUP_MIRROR_HOST_PATH  host directory that receives the incremental media
#                            mirror (issue #242; default ./media-mirror)
#                            → /media-mirror in the containers below. Only needed
#                            for the mirror's "local folder" destination — the S3
#                            destination needs no mount at all.
#
# All other backup + mirror settings (enabled, cron schedule, GFS retention,
# encryption, passphrase-file path, destination override, mirror throttle) are
# DB-backed and managed from the admin UI (Settings → Backups) — NO env vars except
# these physical mounts.
#
# Services that touch the destinations:
#   - backend                : list backups + report mount status to the admin UI (read)
#   - celery-cpu-worker      : consumes the `utility` queue → runs `backup.run` (read/write)
#   - celery-download-worker : consumes the `download` queue → runs `backup.mirror_run`
#                              (reads MinIO, writes /media-mirror; NEVER deletes there)
#
# Without this overlay the feature degrades gracefully: /backups is unmounted, the
# admin UI flags "destination not mounted", and the scheduled task no-ops with a
# logged warning instead of failing.
#
# To ENCRYPT backups, also mount a passphrase file (its contents are the gpg
# symmetric passphrase) and set backup.passphrase_file to its in-container path in
# the admin UI, e.g. add under each service's volumes:
#   - ${BACKUP_PASSPHRASE_HOST_FILE:-./backups/.passphrase}:/backups/.passphrase:ro
#
# OpenSearch snapshots (admin UI → Backups → "Include OpenSearch"):
#   This overlay also allow-lists a snapshot path on the OpenSearch container
#   (path.repo) and bind-mounts BACKUP_HOST_PATH/opensearch-snapshots into it, so an
#   `fs` snapshot repository can be registered and snapshots land beside the .dump
#   files. Without this overlay the snapshot leg degrades gracefully: the backup task
#   records an "unsupported" OpenSearch status (path.repo not allow-listed) while the
#   pg_dump still succeeds. The shipped OpenSearch image has NO repository-s3 plugin,
#   so snapshots always use this fs repo (even for the S3 dump destination).

services:
  backend:
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
      - ${BACKUP_MIRROR_HOST_PATH:-./media-mirror}:/media-mirror

  celery-cpu-worker:
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups

  celery-download-worker:
    volumes:
      - ${BACKUP_MIRROR_HOST_PATH:-./media-mirror}:/media-mirror

  opensearch:
    environment:
      # Allow-list the snapshot directory so `fs` snapshot repositories can be
      # registered under it. Must be the PARENT of REPO_LOCATION in
      # app/services/opensearch_snapshot.py (/usr/share/opensearch/backups/...).
      - path.repo=/usr/share/opensearch/backups
    volumes:
      # Snapshot files land here → under BACKUP_HOST_PATH/opensearch-snapshots on the host.
      - ${BACKUP_HOST_PATH:-./backups}/opensearch-snapshots:/usr/share/opensearch/backups/opensearch-snapshots
