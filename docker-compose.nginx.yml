# docker-compose.nginx.yml
# Optional overlay for NGINX reverse proxy with SSL/TLS support
#
# This overlay enables HTTPS access for OpenTranscribe, which is REQUIRED for:
# - Browser microphone recording (browsers block mic access over HTTP except localhost)
# - Production deployments with custom domains
# - Secure access from other devices on your network
#
# Usage:
#   1. Set NGINX_SERVER_NAME in .env (e.g., transcribe.local or your domain)
#   2. Generate SSL certificates (see scripts/generate-ssl-cert.sh)
#   3. Run: ./opentr.sh start dev (auto-detects NGINX_SERVER_NAME)
#
# For homelab/self-signed certificates:
#   ./scripts/generate-ssl-cert.sh transcribe.local
#
# For production with Let's Encrypt:
#   See docs/NGINX_SETUP.md for Certbot instructions

services:
  backend:
    environment:
      # This overlay puts nginx in front of the backend, so `request.client.host` is
      # the nginx container for every API request. Without a trusted-proxy list the
      # IP resolver (backend/app/utils/client_ip.py) returns that peer address and
      # every caller lands in ONE rate-limit bucket — one user can exhaust the auth
      # limit for everyone — while the audit log records the proxy, not the user.
      #
      # 172.16.0.0/12 is Docker's own address pool (default bridge + user-defined
      # compose networks), so it covers the nginx container and nothing beyond the
      # host. Deliberately NOT the full RFC1918 set: published container ports
      # preserve the external source address, so trusting 10/8 or 192.168.0.0/16
      # would let any machine on a typical LAN hit the backend port directly and
      # forge its own X-Forwarded-For.
      #
      # Override in .env when Docker's pool is customised (`default-address-pools`)
      # or an additional proxy sits in front — .env.example documents the format.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.1/32,172.16.0.0/12}

  nginx:
    image: nginx:1.27-alpine
    container_name: opentranscribe-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      flower:
        condition: service_started
      minio:
        condition: service_started
      docs:
        condition: service_started
    env_file:
      - path: .env
        required: false
    command: >
      /bin/sh -c "
      FLOWER_AUTH_B64=$$(printf '%s:%s' '${FLOWER_USER:-admin}' '${FLOWER_PASSWORD:-flower}' | base64 | tr -d '\n') &&
      export FLOWER_AUTH_B64 &&
      envsubst '$$NGINX_SERVER_NAME $$FLOWER_AUTH_B64'
      < /etc/nginx/templates/site.conf.template
      > /etc/nginx/conf.d/site.conf && nginx -g 'daemon off;'"
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CERT_FILE:-./nginx/ssl/server.crt}:/etc/nginx/certs/server.crt:ro
      - ${NGINX_CERT_KEY:-./nginx/ssl/server.key}:/etc/nginx/certs/server.key:ro
      - ./nginx/site.conf.template:/etc/nginx/templates/site.conf.template:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-opentranscribe}_default
