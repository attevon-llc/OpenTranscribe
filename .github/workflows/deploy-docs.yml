name: Deploy Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
      # The homepage version badge is read from VERSION at build time, so a release
      # bump has to redeploy the site or the badge stays on the previous version.
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The homepage badge (docusaurus.config.ts's isUnpublishedVersion, issue #686)
          # derives "is VERSION ahead of the newest release tag" from local git tag
          # history. The default shallow/no-tags checkout would make that check always
          # report "not dev" (fails closed), silently defeating the whole point.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
