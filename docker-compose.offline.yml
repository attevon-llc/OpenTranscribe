# OpenTranscribe Offline/Airgapped Deployment Overrides
# Use with: docker compose -f docker-compose.yml -f docker-compose.offline.yml up
#
# This file contains ONLY offline deployment-specific settings:
#   - Never pull images (use pre-loaded images)
#   - Offline mode for HuggingFace
#   - Offline-specific volume paths
#
# DELIBERATELY NOT PINNED with ${OT_IMAGE_TAG}, unlike docker-compose.prod.yml.
# scripts/build-offline-package.sh does `docker save` on the `:latest` tags and
# install-offline-package.sh `docker load`s them back under those same tags, so
# :latest is the only tag that exists inside an air-gapped install. Interpolating
# OT_IMAGE_TAG here would make compose look for a tag the package never loaded
# the moment a user's .env pins a version. The package version is controlled by
# which package you installed, not by a tag.

services:
  postgres:
    pull_policy: never

  minio:
    pull_policy: never

  redis:
    pull_policy: never

  opensearch:
    pull_policy: never

  backend:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    # No volumes needed - temp files live in container only

  celery-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: Use absolute paths for airgapped systems
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # No temp volume needed - temp files live in container only
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-download-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: Use absolute paths for airgapped systems
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-cpu-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: `reindex_transcripts` runs here and splits sentences with punkt.
      # Derived, not guessed — tests/unit/test_compose_sentence_splitter_mounts.py
      # walks the call graph from `split_into_sentences` to the queue that serves it.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-redaction:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: Redaction worker needs the GLiNER PII + toxicity model weights
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-cloud-asr-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    # No volumes needed for cloud-ASR worker (network-bound only)
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-nlp-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: `artifacts.generate_file_facts` splits sentences for the digest,
      # and topic extraction needs the stopwords corpus.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-embedding-worker:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    volumes:
      # Offline: sentence-transformers model must be pre-cached
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      # Offline: `index_transcript_search` runs here and splits sentences with punkt.
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1

  celery-beat:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    # No volumes needed - scheduler state lives in container only

  frontend:
    image: davidamacey/opentranscribe-frontend:latest
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-5173}:8080"  # Production NGINX port
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flower:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never
    ports:
      - "${FLOWER_PORT:-5175}:5555"  # Flower web UI

  docs:
    image: davidamacey/opentranscribe-docs:latest
    pull_policy: never  # Use pre-loaded image — no internet required
    ports:
      - "${DOCS_PORT:-3030}:8080"

  # GPU Scaled Worker - Offline overrides
  # NOTE: No 'scale' parameter here - base has scale: 0, gpu-scale.yml sets scale: 1
  # This overlay only provides offline-specific settings (image, pull_policy, paths)
  celery-worker-gpu-scaled:
    image: davidamacey/opentranscribe-backend:latest
    pull_policy: never  # Use pre-loaded images (no network access)
    volumes:
      # Offline: Use absolute paths for airgapped systems
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/appuser/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/appuser/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/appuser/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/appuser/.cache/sentence-transformers
      - pipeline_scratch:/scratch/opentranscribe
    environment:
      # Offline mode for HuggingFace (prevents network calls)
      - HF_HUB_OFFLINE=1
      # Same assertion for NLTK: fail fast naming the skipped setup step
      # rather than hanging on a socket timeout (issue #491).
      - NLTK_OFFLINE=1
