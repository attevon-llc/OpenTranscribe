# diar-native sidecar (the PRIMARY diarization engine) — ADDITIVE overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.diar-native.yml up -d diar-native
#
# The engine is selected by `engine.diarizer_backend` (DB) -> ENGINE_DIARIZER_BACKEND
# (env) -> the coded default, which is now `native`. There is ONE decision point,
# `TranscriptionConfig.diarizer_backend`; the old ad-hoc DIARIZER_ENGINE env reads in
# model_manager.py and engine/stages.py are gone, so setting that variable does nothing.
#
# Rollback = set `engine.diarizer_backend` to `pyannote` in Settings -> Engine (or
# ENGINE_DIARIZER_BACKEND=pyannote) and stop this service. Note the worker ALSO falls back
# to the in-process PyAnnote fork on its own whenever this sidecar is unreachable, and logs
# when it does — that path is covered by real-TCP-unreachability tests, not mocks.

services:
  diar-native:
    # Shared backend image (task #59) — NOT a separate diar-server image. One image
    # carries both the Python stack and the diar-native Rust binary; this service just
    # overrides the image's default CMD (uvicorn) with the binary. Dockerfile.prod sets
    # no ENTRYPOINT, so `command:` replaces the whole CMD cleanly.
    #
    # Previously `image: diar-server:latest` — an UNQUALIFIED name that Docker resolves
    # to docker.io/library/diar-server, a namespace we do not control. Then
    # `opentranscribe-backend:latest`, which is the DEV-LOCAL build tag: because this
    # overlay is merged LAST, that pinned every self-hosted deployment's diar-native
    # service to an image name that only exists on a maintainer's workstation, and
    # Docker would try to pull docker.io/library/opentranscribe-backend (issue #639).
    #
    # Default to the same published image the prod overlay uses, keyed on the same
    # OT_IMAGE_TAG, so the sidecar and the workers that talk to it are always the same
    # build. opentr.sh exports DIAR_NATIVE_IMAGE for local dev.
    image: ${DIAR_NATIVE_IMAGE:-davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}}
    command: ["diar-server"]
    # ORT resolves its provider libs relative to the executable's directory AND the
    # process cwd (diar-server has no ELF NEEDED entry for libonnxruntime — it's
    # dlopen'd at runtime). Dockerfile.prod symlinks the provider libs into both
    # /usr/local/bin and this working_dir; they must match.
    working_dir: /opt/diar-native/run
    user: appuser
    environment:
      - DIAR_MODE=${DIAR_NATIVE_MODE:-cuda}
      - DIAR_MODELS_DIR=/models
      - DIAR_MAX_INFLIGHT=${DIAR_NATIVE_MAX_INFLIGHT:-2}
      - DIAR_BIND=0.0.0.0:8701
      - SPEAKRS_LAZY_SESSIONS=${DIAR_NATIVE_LAZY_SESSIONS:-1}
      # Scoped to THIS service only — never image-wide (see the ORT version-collision
      # note in Dockerfile.prod: Python's onnxruntime-gpu==1.28.0 ships providers with
      # the same filenames as diar's 1.24.2, so the image-wide env must never point at
      # /opt/diar-native/lib). Covers: diar's own ORT libs, plus the CUDA math libs
      # (cudart/cublas/cudnn/cufft/curand) diar-native's own image installed via system
      # apt packages but this shared image gets from the already-installed torch nvidia
      # wheels instead — verified: every CUDA symbol libonnxruntime_providers_cuda.so
      # needs resolves against those wheels, zero unsatisfied sonames.
      - LD_LIBRARY_PATH=/opt/diar-native/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cudnn/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cuda_runtime/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cublas/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cufft/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/curand/lib
    volumes:
      # ONNX/PLDA artifacts exported from pyannote/speaker-diarization-community-1.
      #
      # These are the SAME weights the PyAnnote path uses, obtained the SAME way: the
      # operator's own HUGGINGFACE_TOKEN against the gated HF repo, then exported to
      # ONNX locally. `./opentranscribe.sh` runs that export via
      # scripts/download-models.py (group: diar-native). Nothing here is redistributed
      # by this project — identical to how the PyAnnote weights are acquired today.
      #
      # The default used to be /mnt/nvm/repos/diar-native/models_folded, an absolute
      # path on one maintainer's workstation, which is why no self-hosted deployment
      # could ever start this service (issue #639). Now it follows MODEL_CACHE_DIR like
      # every other model cache in docker-compose.yml.
      - ${DIAR_NATIVE_MODELS_DIR:-${MODEL_CACHE_DIR:-./models}/diar-native}:/models:ro
      - diar-native-tmp:/tmp/diar-native
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              # ⚠️ Defaults to GPU_DEVICE_ID — the SAME GPU the rest of the stack uses —
              # never to a bare 0. This used to read `${DIAR_NATIVE_GPU:-0}`, so simply
              # enabling this overlay without also setting DIAR_NATIVE_GPU would reserve
              # device 0. On this workstation device 0 is an A6000 reserved for unrelated
              # work, and the sidecar holds ~4.1 GB of warm ORT arena — it would have sat
              # on someone else's card indefinitely. Overlays must inherit the project's
              # configured GPU, not re-pick one.
              device_ids: ['${DIAR_NATIVE_GPU:-${GPU_DEVICE_ID:-0}}']
    restart: unless-stopped   # supervisor: auto-restart (known upstream teardown crash)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8701/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # The gpu diarize worker needs the shared audio-handoff volume and the sidecar's URL.
  # NOTE: service name must match your compose profile's diarization worker
  # (celery-worker in default gpu profile; celery-worker-diarize under gpu-split).
  #
  # DIARIZER_ENGINE was removed here deliberately: it used to be read ad hoc in three
  # places, and it now selects nothing. Leaving it would have been worse than useless —
  # it defaulted to "python" while the resolved default is "native", so it read as an
  # override that was silently doing the opposite of what it said.
  celery-worker:
    environment:
      - DIAR_NATIVE_URL=http://diar-native:8701
      - DIAR_NATIVE_SHARED_DIR=/tmp/diar-native
    volumes:
      - diar-native-tmp:/tmp/diar-native

volumes:
  diar-native-tmp:
