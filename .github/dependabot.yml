version: 2
# ⚠️ READ BEFORE CHASING AN ISSUE NUMBER IN THIS FILE (issue #792).
# The `ignore:` rules below cite **#234** (5 sites) and **#256**. BOTH ARE CLOSED — #234 on
# 2026-06-05. They are kept as historical provenance for *why* each major was deferred, NOT as
# live tracking: no open issue owns these deferrals, so nothing will re-raise them on its own.
# Each rule's reason is therefore written out in full beside it and stands on its own. When you
# do a coordinated major-upgrade pass, re-evaluate every rule here from its stated reason
# rather than from the issue link.
#
# Low-clutter dependency updates: weekly, but GROUPED so each ecosystem produces a
# single batched PR (not one-per-package) — i.e. one frontend (npm) PR and one
# backend (pip) PR per week, plus a grouped GitHub Actions PR. Known-bad versions
# are ignored. To pause entirely, comment out the `updates:` entries below; to run
# on demand, use the "Check for updates" button on the repo's Dependabot tab.
#
# EVERY group below declares `applies-to` TWICE — once for version-updates and
# once for security-updates. This is not redundancy. A `groups:` block defaults to
# `applies-to: version-updates` ONLY, so security advisories bypass grouping
# entirely and open one PR per advisory. Enabling Dependabot security updates
# immediately produced five separate /docs-site PRs (#417-#419, #421-#422) for
# exactly this reason. If you add an ecosystem, give it both.
updates:
  # Frontend — one grouped PR
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # svelte 5.56.x has a parser regression (declaration_tag_invalid_type on a
      # plain ternary expression). Pinned to ~5.55.5 until upstream patches it.
      - dependency-name: "svelte"
        versions: ["5.56.x"]
      # vite 8 requires @sveltejs/vite-plugin-svelte >=6; the current plugin (v5)
      # peer-pins vite ^6. Hold the major until the Svelte plugin supports vite 8.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @eslint/js 10 peer-wants eslint ^10, but typescript-eslint still pins
      # eslint 9 — the major broke both pre-commit (ERESOLVE) and the lint job
      # (new v10 recommended rules against the v9 engine). See #234 / #256.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Types major tracks the runtime: bump together with the coordinated
      # node 22 -> 26 upgrade (#234), not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Backend — one grouped PR
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend:
        applies-to: version-updates
        patterns:
          - "*"
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # torch/torchaudio use local-tag pins (+cpu / +cu128) that dependabot
      # mangles into mismatched, uninstallable pairs across the requirements
      # variants (#257). Managed by hand alongside the CUDA base image.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      # bcrypt 5 removed the __about__ attribute passlib introspects (#234).
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
      # transformers 5 / huggingface-hub 1.x break whisperx + pyannote (#234);
      # bump together once the ASR stack supports them.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
      # websockets 11 -> 16 is a five-major jump touching uvicorn/provider SDK
      # paths; take it deliberately with its own validation, not in a batch.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # speechmatics-batch 0.x minors are potentially breaking and the 0.5.0
      # release ships live-key-verified provider integrations — re-verify with
      # live keys before adopting (#234).
      # NOTE: pip ignore conditions take a REQUIREMENT string, not an npm-style
      # wildcard. This said `0.5.x`, which Dependabot rejects with
      #   '#/updates/1/ignore/6/versions' includes invalid version requirements
      #   for a pip ignore condition
      # and an invalid file is rejected WHOLESALE — so every grouped weekly
      # version-update PR this config describes had silently stopped running.
      # Dependabot only re-validates when the file changes, which is why nothing
      # ever reported it.
      - dependency-name: "speechmatics-batch"
        versions: [">=0.5.0,<0.6.0"]

  # CI workflow actions — one grouped PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Dockerfile base images — infrequent, grouped per service
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-docker:
        applies-to: version-updates
        patterns:
          - "*"
      backend-docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Rewritten 2026-09-12 (issue #792) — the previous reason was OBSOLETE. It claimed
      # "nvidia/pytorch 26.x is not a drop-in for Dockerfile.blackwell: the NGC image dropped
      # torchaudio and the pin capture/restore breaks (#274)". Neither half is true today:
      # `backend/Dockerfile.blackwell` is ALREADY `FROM nvcr.io/nvidia/pytorch:26.07-py3`
      # (verified via `git show`), and `backend/requirements.txt` pins `torchaudio==2.11.0`
      # (also verified) — the capture/restore step a few lines below this ignore's target
      # (`pip freeze | grep -iE '^(torch|torchaudio|torchvision)=='` then a forced
      # reinstall) still finds and restores a torchaudio from the base image, so 26.x has
      # not dropped it.
      #
      # The ignore stays, with the real reason: nvcr.io/nvidia/pytorch major/minor bumps
      # change the bundled CUDA toolkit and the exact torch/torchaudio/torchvision build the
      # capture/restore step preserves, which this repo can only validate on real Blackwell
      # (SM_121/GB10) hardware — not something a CI runner can do. Bump by hand, alongside a
      # hardware validation pass, then let this ignore's own comment go stale in turn.
      - dependency-name: "nvidia/pytorch"

  # Root compose files (issue #792): the `docker` ecosystem only rewrites `FROM` lines in
  # Dockerfiles, so nothing above watched the images pinned directly in the root
  # docker-compose*.yml files — postgres, minio, redis, opensearch, prometheus/grafana. Those
  # first four hold every byte of user data in this app and were watched by nothing.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      root-docker:
        applies-to: version-updates
        patterns:
          - "*"
      root-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-docker:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Docs site base image (nginx + the discarded Node build stage) — issue #780.
  #
  # This ecosystem was MISSING entirely: the docker ecosystem only rewrites `FROM` lines, so
  # nothing was watching docs-site/Dockerfile and it drifted onto Node 20 after it went EOL
  # with no PR ever proposing the bump. The sibling `npm` / `/docs-site` entry below only
  # tracks package.json/lockfile deps — it cannot see a Dockerfile `FROM` line either.
  - package-ecosystem: "docker"
    directory: "/docs-site"
    schedule:
      interval: "monthly"
    groups:
      docs-docker:
        applies-to: version-updates
        patterns:
          - "*"
      docs-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Docs site (Docusaurus) — one grouped PR.
  #
  # This ecosystem was MISSING entirely, which is why enabling security updates
  # produced five separate /docs-site PRs at once (#417-#419, #421-#422). It has
  # its own package.json and lockfile and is built into a published image, so it
  # needs the same treatment as the app.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docs:
        applies-to: version-updates
        patterns:
          - "*"
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
