# docker-compose.demo-cloudflare.yml — the public demo behind Cloudflare (issue #628)
#
# Loaded by opentranscribe.sh after docker-compose.demo.yml when DEMO_MODE=true AND the nginx
# overlay is in the chain. Cloudflare (proxied DNS) fronts the demo, so every TCP peer nginx
# sees is a Cloudflare edge and the visitor is only in CF-Connecting-IP. nginx's real_ip module
# replaces the client address with that header ONLY for peers listed in set_real_ip_from; from
# any other peer the header is ignored, so it cannot be forged to dodge a per-visitor limit.
# The backend then reads the usual nginx-appended X-Forwarded-For (RATE_LIMIT_TRUSTED_PROXIES
# stays nginx-only).
#
# nginx/cloudflare-real-ip.conf is a pinned snapshot of Cloudflare's published ranges, refreshed
# with scripts/demo/refresh-cloudflare-ips.sh. Docs: Operations > Public demo.
services:
  nginx:
    volumes:
      # conf.d/*.conf is included at http level, so this applies to every server block.
      - ./nginx/cloudflare-real-ip.conf:/etc/nginx/conf.d/cloudflare-real-ip.conf:ro
