# Pre-commit hooks configuration for OpenTranscribe
# See https://pre-commit.com for more information

repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^security-reports/
      - id: end-of-file-fixer
        exclude: ^security-reports/
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags in docker-compose
      - id: check-json
        exclude: ^security-reports/
      - id: check-added-large-files
        args: [--maxkb=10240]  # 10MB max file size
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^security-reports/
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Python formatting and linting with Ruff (replaces Black, isort, flake8)
  #
  # `scripts/` was UNLINTED until this change: 40 Python files, including every piece of
  # gate tooling the suite's honesty rests on (audit-tests.py, audit-route-coverage.py,
  # triage-mutants.py, check-schema-drift.py, analyze-test-timing.py). The tools that guard
  # the tests were the least-guarded code in the repo, and it showed — enabling ruff turned
  # up 109 findings, among them `benchmark-diarization.py` reading `os.environ` with no
  # `import os` at module scope, i.e. a script that has raised NameError on import for as
  # long as that line has existed and that nobody could have run since.
  #
  # Two configs are in play and that is deliberate, not an oversight: `backend/` resolves
  # `backend/pyproject.toml` (double quotes, force-single-line isort) and `scripts/` resolves
  # the root `pyproject.toml` (single quotes). Ruff picks the nearest config per file, so one
  # `files:` pattern gets both. Do NOT "unify" them by deleting a config — that reformats a
  # thousand files to settle a question nobody asked.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
        files: ^(backend|scripts)/
      - id: ruff-format
        files: ^(backend|scripts)/

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^backend/
        additional_dependencies:
          - types-requests
          - types-python-dateutil
          - types-pyyaml
          - types-redis
          # py.typed runtime deps the hook's isolated env must see, or their
          # APIs degrade to Any and no-any-return fires in importing code.
          - prometheus-client
          # SQLAlchemy 2.0 ships py.typed — the hook's isolated env needs it so
          # Mapped[...] columns resolve to real types (not Column[Any]); this is
          # what makes the typed-models conversion's type info visible to mypy.
          - sqlalchemy>=2.0
          # joserfc ships py.typed (app/auth/oidc/claims.py, #33) — same reason.
          - joserfc>=1.7.4
          # playwright ships py.typed — without it Page.get_attribute()/Locator
          # methods degrade to Any in the hook's isolated env, and returning
          # that Any from a function declared -> str trips no-any-return even
          # though backend/venv (which has it installed) reports no issue.
          - playwright
        args: [--ignore-missing-imports, --check-untyped-defs]

  # Frontend formatting with Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        # ffmpeg-wasm-build/ (issue #473): generated build output, vendored third-party
        # sources, and binary test fixtures (test/fixtures/ts_aac.ts is an MPEG transport
        # stream, not TypeScript — its .ts extension makes pre-commit misclassify it as a
        # prettier `ts` file regardless of .prettierignore, which only applies when prettier
        # resolves ignores itself, not to files pre-commit passes explicitly).
        exclude: ^frontend/ffmpeg-wasm-build/(dist|src|test/(fixtures|node_modules))/
        types_or: [javascript, jsx, ts, tsx, json, yaml, html, css, scss, markdown]
        args: [--write, --ignore-unknown]

  # Frontend type checking and build verification — TWO TIERS (issue #688).
  #
  # `npm run build` measured 91.8 s of a 328 s whole-tree run, and its `prebuild`
  # (frontend/package.json) is `download-fonts.js && build-ffmpeg.js`, the latter shelling
  # out to `docker buildx`. Every commit touching one .svelte file paid for a production
  # bundle. eslint + svelte-check catch what you actually get wrong while editing; a
  # bundling failure is a push-time concern.
  #
  # ⚠️ The pre-push tier is NOT optional cover, and CI must run BOTH stages. On a pull
  # request this hook is the ONLY vite build anywhere in CI: docker-publish.yml (which
  # builds frontend/Dockerfile.prod) is `workflow_dispatch` only, and release-validate.yml's
  # `npm ci && npm run build` is docs-site, not frontend. `pre-commit run --all-files` with
  # no --hook-stage runs DEFAULT-stage hooks only, and default_stages below is
  # [pre-commit] — so demoting the build without adding the second CI invocation would have
  # deleted the frontend build from CI while leaving the workflow green.
  # `.github/workflows/pre-commit.yml` runs both stages, and
  # backend/tests/unit/test_precommit_stage_ci_parity.py fails if that ever stops being true.
  - repo: local
    hooks:
      - id: frontend-check
        name: Frontend Type Check (eslint + svelte-check)
        entry: scripts/frontend-check.sh --check-only
        language: system
        files: ^frontend/src/
        types_or: [svelte, ts, javascript, css, html]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
      - id: frontend-build
        name: Frontend Build Verification (eslint + svelte-check + vite build)
        entry: scripts/frontend-check.sh
        language: system
        files: ^frontend/src/
        types_or: [svelte, ts, javascript, css, html]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

  # Dockerfile linting — runs hadolint via its official pinned Docker image
  # (language: docker_image), so NO local hadolint binary is required; this is
  # identical in CI and for contributors (both have Docker) and can never fall
  # back to a missing system binary. The previous config used the hadolint repo
  # with language: system + entry: hadolint, which exec'd a local binary that
  # isn't installed in CI — failing every run with "Executable hadolint not
  # found" (the Pre-commit workflow was red on master since Oct 2025 for this).
  # Picks up the repo-root .hadolint.yaml; types:[file] + files matches the
  # Dockerfile.<stage> naming that identify doesn't tag as 'dockerfile'.
  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        language: docker_image
        entry: hadolint/hadolint:v2.12.0 hadolint
        files: Dockerfile.*
        types: [file]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        args: [--verbose, --no-banner]
        exclude: ^security-reports/

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      # TWO TIERS (issue #688). The recursive scan below ignored the staged file list
      # entirely and re-walked all of backend/ on every Python commit — 71.1 s of a 328 s
      # whole-tree run. At commit time bandit now sees only the files pre-commit passes it;
      # the whole-tree walk runs at pre-push and in CI (which invokes BOTH stages — see the
      # frontend-check comment above for why that pairing is mandatory).
      - id: bandit
        name: bandit (staged backend files)
        files: ^backend/
        # Belt and braces: pre-commit only ever passes TRACKED files and backend/mutants
        # is gitignored, but a stray `git add` of a mutant must not become a finding.
        exclude: ^backend/mutants/
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit]
      - id: bandit
        alias: bandit-recursive
        name: bandit (recursive backend/ scan)
        files: ^backend/
        # --exclude on the CLI, not just [tool.bandit] exclude_dirs: the pyproject
        # glob does NOT reliably match here (the hook runs from the repo root, so paths
        # are `backend/mutants/...`), and bandit walks the FILESYSTEM, so gitignoring
        # mutmut's generated tree is not enough. Without this, a mutation run left ~330k
        # lines of deliberately corrupted source that failed the commit on a finding
        # inside a mutant. This is the tier that walks, so this is the tier that needs it.
        args: [-c, pyproject.toml, -x, backend/mutants, -r, backend/]
        # -r backend/ already covers the tree; passing the changed files too would scan
        # them twice. `files:` still gates whether this tier runs at all.
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-push]

  # Import-linter — enforce the cloud seam direction: the open-source core
  # (`app.*`) must NEVER import the closed-source cloud edition (`cloud`/clerk/
  # stripe). Contract lives in backend/pyproject.toml ([tool.importlinter]).
  # Runs from the backend/ dir (cwd) so import-linter can import the `app`
  # package; uses the project venv binary like the frontend-check hook.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (app must not import cloud)
        # language: python so pre-commit provisions import-linter in its OWN
        # isolated env — the pre-commit CI job installs only `pre-commit` (no
        # backend venv, no project deps), so a hardcoded venv/bin path or a
        # system `lint-imports` would not exist there. bash handles the cd into
        # backend/ so grimp can locate the `app` namespace package; lint-imports
        # resolves from the isolated env's PATH. grimp analyses statically (AST),
        # so the app's runtime deps are NOT required.
        entry: bash -c 'cd backend && lint-imports --config pyproject.toml'
        language: python
        additional_dependencies: ['import-linter>=2.0']
        pass_filenames: false
        files: ^backend/app/.*\.py$

  # Version consistency — VERSION, pyproject.toml, frontend/package.json,
  # frontend/package-lock.json (BOTH version fields), the Alembic single-head
  # invariant, the Dockerfile APP_VERSION build-arg contract, and duplicate
  # docs-site blog slugs must all agree.
  #
  # Exists because the previous process documented "append a row every release"
  # for scripts/release-tests/expected-schemas.tsv and enforced it nowhere — so
  # v0.4.1's row was never added and nobody noticed for four months. A rule with
  # no enforcement is a rule that rots.
  #
  # language: system + python3 because the checker is deliberately stdlib-only
  # (tomllib, json, re) and must also run on a bare CI runner with no venv.
  # CHANGELOG checks are warn-only in `ci` mode: the release bumps VERSION in one
  # commit and writes the CHANGELOG in a later one, so blocking here would make
  # the intermediate commit uncommittable.
  - repo: local
    hooks:
      - id: version-consistency
        name: version consistency (VERSION / pyproject / package.json / alembic)
        entry: python3 scripts/release/check-version-consistency.py --mode ci
        language: system
        pass_filenames: false
        files: ^(VERSION|pyproject\.toml|frontend/package\.json|frontend/package-lock\.json|backend/alembic/versions/.*\.py|backend/Dockerfile\.prod|docs-site/blog/.*\.md)$

  # Test-suite quality gate (issue #431) — finds tests that pass whether the code
  # works or not. The vitest counterpart (`npm run test:audit`) has run in CI since
  # #431; the pytest one, `scripts/audit-tests.py`, was in NEITHER pre-commit NOR CI
  # and appeared only in prose. A gate nothing invokes is documentation.
  #
  # SELF-TEST FIRST, and never reorder these two. The detectors are code, and a
  # detector that silently stops matching reports zero findings — indistinguishable
  # from a clean suite, which is the exact failure this script exists to catch. The
  # frontend sibling's self-test caught two dead detectors that way.
  #
  # language: system + python3 because the auditor is deliberately stdlib-only (ast,
  # json, argparse) and must also run on the bare CI runner, which installs only
  # `pre-commit` — no backend venv, no project deps. Same rationale as
  # version-consistency below.
  #
  # `files:` keeps the ~9 s tree scan off commits that cannot change its outcome; the
  # allowlist is included because deleting a line there must re-verify the finding is
  # really gone (the auditor fails on a stale entry).
  - repo: local
    hooks:
      - id: audit-tests-selftest
        name: audit-tests self-test (every detector must still fire)
        entry: python3 scripts/audit-tests.py --selftest
        language: system
        pass_filenames: false
        files: ^(backend/tests/.*\.py|scripts/audit-tests\.py)$
      - id: audit-tests
        name: audit backend test quality (tests that cannot fail)
        entry: python3 scripts/audit-tests.py backend/tests
        language: system
        pass_filenames: false
        files: ^(backend/tests/.*\.py|backend/tests/audit-allowlist\.txt|scripts/audit-tests\.py)$

  # DB session-lifetime gate (issue #440) — a session held across slow non-DB work keeps a
  # transaction open, and a plain SELECT holds ACCESS SHARE for its life. That QUEUES
  # `ALTER TABLE`, i.e. it hangs an Alembic upgrade mid-release (and dev migrates on backend
  # startup), pins the VACUUM horizon on the largest table, and burns a pool connection.
  # Measured live twice in one day on two different workers: 48 min and 1h26m
  # idle-in-transaction, found only because DDL tests started failing with LockNotAvailable.
  #
  # Wired here on purpose. This audit's very first finding was that `audit-route-coverage.py`
  # could never fail AND nothing invoked it — a gate nothing runs is documentation. Adding a
  # detector without wiring it would have repeated that on the same day it was diagnosed.
  #
  # SELF-TEST FIRST, same rule as audit-tests above: a detector that silently stops matching
  # reports zero findings, which is indistinguishable from a clean codebase.
      - id: audit-session-lifetime-selftest
        name: session-lifetime self-test (every detector must still fire)
        entry: python3 scripts/audit-session-lifetime.py --selftest
        language: system
        pass_filenames: false
        files: ^scripts/audit-session-lifetime\.py$
      - id: audit-session-lifetime
        name: audit DB session lifetime (no transaction held across slow work)
        entry: python3 scripts/audit-session-lifetime.py backend/app
        language: system
        pass_filenames: false
        files: ^(backend/app/.*\.py|scripts/session-lifetime-allowlist\.txt|scripts/audit-session-lifetime\.py)$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # A component that was never scanned must never read as a clean one (issue #681).
  #
  # Wired here rather than left as a script somebody might remember to run: the
  # failure it guards is silent by construction — an unscannable component
  # printed "All security scans completed successfully!" and `docs` had been in
  # that state since it was added. Nothing about the output distinguished it
  # from a real pass, so a human running the gate by hand would not have looked.
  #
  # 0.4 s, no Docker, no network, no images.
  - repo: local
    hooks:
      - id: scan-not-a-pass
        name: an unscanned component cannot report a passing security scan
        entry: scripts/tests/test-scan-not-a-pass.sh
        language: system
        pass_filenames: false
        files: ^scripts/(docker-build-push\.sh|security-scan\.sh|tests/test-scan-not-a-pass\.sh)$

      - id: publish-platforms-not-a-pass
        name: a published multi-arch tag cannot report equivalence it does not have (#680)
        entry: scripts/tests/test-publish-platforms.sh
        language: system
        pass_filenames: false
        files: ^(backend/Dockerfile\.(prod|lite)|scripts/(docker-build-push\.sh|security-scan\.sh|lib/manifest_platform_check\.py|release/(80-publish|85-smoke)\.sh|tests/(test-publish-platforms\.sh|fixtures/manifest-fixtures\.py)))$

  # Commit message linting (optional)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-scope]

# Configuration for specific hooks
#
# `default_install_hook_types` is what makes the tiering above real for a human: without it
# `pre-commit install` wires ONLY the pre-commit hook, so the pre-push tier (frontend build,
# recursive bandit) and the commit-msg tier (conventional commits) would never fire locally
# no matter what `stages:` says. Existing checkouts must re-run `pre-commit install` once —
# this key changes what a FUTURE install does, it cannot retro-wire an installed hook.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false
