# PKI/mTLS Authentication Overlay for Development
#
# Uses local containers (not Docker Hub) with PKI support. This overlay only
# overrides `frontend` + `backend`; every other service (postgres, redis,
# minio, opensearch, workers, …) comes from the dev override, so the dev
# override MUST be included in the chain.
#
# Usage:
#   1. Generate certificates:
#      ./scripts/pki/setup-test-pki.sh
#
#   2. Generate server cert (if not done):
#      cd scripts/pki/test-certs && openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout nginx/server.key -out nginx/server.crt -subj "/CN=localhost"
#
#   3. Start dev with PKI (override.yml is required for the other services'
#      images and to share the default network):
#      docker compose -f docker-compose.yml -f docker-compose.override.yml \
#        -f docker-compose.pki-dev.yml up -d
#
#   4. Access over mTLS: https://localhost:${PKI_HTTPS_PORT:-8443}
#
# Note: the dev override already publishes Vite on host port 5173 (and the docs
# site on 5183), so this overlay publishes the PKI nginx frontend's plain-HTTP
# :8080 on a DISTINCT host port (PKI_HTTP_PORT, default 5187) to avoid a
# host-port collision. The mTLS entrypoint is the HTTPS port above.
#

services:
  # Override frontend to add PKI/mTLS support
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      # Mount PKI nginx config
      - ./frontend/nginx-pki.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount certificates
      - ./scripts/pki/test-certs/nginx/server.crt:/etc/nginx/certs/server.crt:ro
      - ./scripts/pki/test-certs/nginx/server.key:/etc/nginx/certs/server.key:ro
      - ./scripts/pki/test-certs/ca/ca.crt:/etc/nginx/certs/ca.crt:ro
    ports:
      # Distinct host port — dev override binds 5173 (Vite) and 5183 (docs). mTLS is on HTTPS below.
      - "${PKI_HTTP_PORT:-5187}:8080"
      - "${PKI_HTTPS_PORT:-8443}:8443"
    environment:
      - NODE_ENV=production

  # Use local backend build
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
