name: Seam Guard

# OSS-clean-from-closed-source build invariant (Wave 2.1b / 5.3).
#
# The commercial cloud edition (Clerk auth + Stripe billing) lives in a SEPARATE
# private repo and layers onto this open-source core through generic extension
# seams (the auth provider registry, pipeline hooks, the capability resolver).
# No vendor noun — "clerk" or "stripe" — may ever leak into the public backend
# or frontend source (the paid UI lives in the private repo's frontend-overlay,
# layered over the `$lib/cloud` stub at cloud-image build time).
#
# This gate makes that a hard build invariant: it greps `backend/app` and
# `frontend/src` and FAILS
# the build if any case-insensitive match for `clerk|stripe` appears. Keeping it
# at zero is what lets the cloud repo's CI advertise "OSS clean from closed
# source" honestly, and it backstops the import-linter `app -/-> cloud` contract
# (Wave 5.1) from the opposite direction — names, not imports.
#
# Fast and dependency-light: ripgrep ships on GitHub's ubuntu-latest runners; a
# grep -rIn fallback covers any image where it does not.

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  # Required for a merge queue. A queued entry runs its checks against
  # master-plus-the-preceding-queue, NOT against the PR branch — so a required
  # check whose workflow lacks this trigger simply never reports, and the merge
  # hangs forever. Added BEFORE the queue is enabled, deliberately: it is inert
  # until then, and enabling the queue first is how a repo bricks its own merges.
  merge_group:

permissions:
  contents: read

jobs:
  no-vendor-nouns:
    name: No Clerk/Stripe in OSS backend or frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Assert backend/app is free of cloud-vendor nouns
        run: |
          set -euo pipefail
          PATTERN='clerk|stripe'
          TARGET='backend/app frontend/src'

          if command -v rg >/dev/null 2>&1; then
            # shellcheck disable=SC2206 # TARGET is intentionally word-split into paths
            SEARCH=(rg -i --no-heading --line-number "$PATTERN" $TARGET)
          else
            # POSIX fallback: -r recursive, -I skip binary, -n line numbers, -E regex, -i case-insensitive.
            # shellcheck disable=SC2206
            SEARCH=(grep -rInE -i "$PATTERN" $TARGET)
          fi

          echo "Scanning $TARGET for /$PATTERN/i ..."
          if MATCHES="$("${SEARCH[@]}")"; then
            echo "::error::Cloud-vendor noun leaked into the open-source backend."
            echo "$MATCHES"
            {
              echo "## ❌ Seam Guard failed"
              echo ""
              echo "Found \`$PATTERN\` (case-insensitive) in \`$TARGET\`. The open-source"
              echo "core (backend AND frontend) must never reference the commercial cloud"
              echo "edition's vendors. Move the code into the private cloud repo's seam"
              echo "(backend layer or frontend-overlay), or genericize the name."
              echo ""
              echo '```'
              echo "$MATCHES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "PASS: zero clerk|stripe matches in $TARGET"
          {
            echo "## ✅ Seam Guard passed"
            echo ""
            echo "No \`clerk\`/\`stripe\` references in \`$TARGET\` — OSS core (backend and"
            echo "frontend) is clean of closed-source vendor nouns (build invariant)."
          } >> "$GITHUB_STEP_SUMMARY"
