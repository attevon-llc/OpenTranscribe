# docker-compose.blackwell.yml
# Optional overlay for NVIDIA Blackwell / DGX Spark GPU systems (SM_121)
#
# Replaces the standard backend/worker images with Blackwell-compatible
# builds that include SM_121 -> SM_90 compatibility patches and unified
# memory support.
#
# Automatically loaded by opentranscribe.sh and opentr.sh when a Blackwell
# GPU (compute capability 12.x) is detected via nvidia-smi.
#
# For dev mode: builds from backend/Dockerfile.blackwell locally.
# For production: uses the pre-built :blackwell tag from Docker Hub
#   (set by docker-compose.prod.yml + this overlay).
#
# Usage:
#   Automatic (recommended):
#     ./opentr.sh start dev        # Auto-detects Blackwell, builds locally
#     ./opentranscribe.sh start    # Auto-detects Blackwell, uses Docker Hub
#   Manual (dev):
#     docker compose -f docker-compose.yml -f docker-compose.override.yml \
#       -f docker-compose.gpu.yml -f docker-compose.blackwell.yml up
#
# Note: The Blackwell Dockerfile uses /home/user/ cache paths (NVIDIA base
# image convention) instead of /home/appuser/ used by Dockerfile.prod.
# Both map to UID 1000; the volume mounts below reflect this difference.

services:
  # Override backend to use Blackwell image
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.blackwell
    image: davidamacey/opentranscribe-backend:${OT_BLACKWELL_IMAGE_TAG:-blackwell}

  # Deliberately NO `diar-native` entry here. A retag of it USED to live in this file
  # (`image: davidamacey/opentranscribe-backend:${OT_BLACKWELL_IMAGE_TAG:-blackwell}`),
  # with a comment claiming it kept the sidecar on the same Blackwell build as
  # celery-worker below. It could not deliver that: both opentr.sh (add_gpu_overlay,
  # then add_diar_native_overlay) and opentranscribe.sh (get_compose_files) always append
  # this blackwell overlay BEFORE docker-compose.diar-native.yml, and compose's last-file-
  # wins merge means diar-native.yml's own `image:` key always overrides whatever this
  # file set — verified: resolving the full chain up to and including diar-native.yml
  # gave `celery-worker` -> `:blackwell` but `diar-native` -> `:latest`, the exact
  # mismatch the removed comment claimed was fixed. A compose-side retag genuinely cannot
  # win that ordering; reordering the two `-f` appends would require editing opentr.sh /
  # opentranscribe.sh, out of scope for this file. The real fix is on the shell side:
  # exporting `DIAR_NATIVE_IMAGE=...:${OT_BLACKWELL_IMAGE_TAG:-blackwell}` before compose
  # runs, so docker-compose.diar-native.yml's own `${DIAR_NATIVE_IMAGE:-...}` fallback
  # resolves to the Blackwell tag regardless of file order (tracked separately). Leaving
  # an inert retag with a comment asserting it worked was worse than no entry at all.

  # Override GPU worker to use Blackwell image with SM_121 patches
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.blackwell
    image: davidamacey/opentranscribe-backend:${OT_BLACKWELL_IMAGE_TAG:-blackwell}
    command: >
      celery -A app.core.celery worker
      --loglevel=info
      -Q gpu
      --concurrency=1
      --max-tasks-per-child=${GPU_MAX_TASKS:-100000}
      --hostname gpu-transcription@%h
      -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['${GPU_DEVICE_ID:-0}']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      # Model caches — /home/user/ paths (NVIDIA base image, not appuser)
      - ${MODEL_CACHE_DIR:-./models}/huggingface:/home/user/.cache/huggingface
      - ${MODEL_CACHE_DIR:-./models}/torch:/home/user/.cache/torch
      - ${MODEL_CACHE_DIR:-./models}/nltk_data:/home/user/.cache/nltk_data
      - ${MODEL_CACHE_DIR:-./models}/sentence-transformers:/home/user/.cache/sentence-transformers
      - ${MODEL_CACHE_DIR:-./models}/yt-dlp:/home/user/.cache/yt-dlp
      # Temp directory for processing intermediate files. TEMP_DIR_HOST is the
      # HOST-side bind source — distinct from the base stack's in-container
      # TEMP_DIR (hardcoded to /app/temp there, not user-configurable).
      - ${TEMP_DIR_HOST:-./temp}:/app/temp
    healthcheck:
      # Pool-aware healthcheck (issue #631) — mirrors the base stack. Threads pool:
      # a stats reply from MainProcess is the same proof `inspect ping` gave. Prefork
      # (GPU_WORKER_POOL=prefork): the child-process and respawn-storm checks apply.
      test: ["CMD-SHELL", "python3 scripts/celery_pool_healthcheck.py gpu-transcription@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # CPU worker also needs Blackwell-compatible image for nvidia-smi
  # stats collection and CUDA-accelerated speaker clustering
  celery-cpu-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.blackwell
    image: davidamacey/opentranscribe-backend:${OT_BLACKWELL_IMAGE_TAG:-blackwell}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
