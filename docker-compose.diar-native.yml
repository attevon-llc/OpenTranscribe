# diar-native sidecar (the PRIMARY diarization engine) — ADDITIVE overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.diar-native.yml up -d diar-native
#
# CPU-only / no-GPU host: this file alone is CPU-safe (DIAR_MODE defaults to `cpu`, and
# there is no `deploy.resources.reservations.devices` block here — see the note above the
# `diar-native` service below for where the GPU reservation actually lives (#660).
#
# The engine is selected by `engine.diarizer_backend` (DB) -> ENGINE_DIARIZER_BACKEND
# (env) -> the coded default, which is now `native`. There is ONE decision point,
# `TranscriptionConfig.diarizer_backend`; the old ad-hoc DIARIZER_ENGINE env reads in
# model_manager.py and engine/stages.py are gone, so setting that variable does nothing.
#
# Rollback = set `engine.diarizer_backend` to `pyannote` in Settings -> Engine (or
# ENGINE_DIARIZER_BACKEND=pyannote) and stop this service. Note the worker ALSO falls back
# to the in-process PyAnnote fork on its own whenever this sidecar is unreachable, and logs
# when it does — that path is covered by real-TCP-unreachability tests, not mocks.

services:
  diar-native:
    # Shared backend image (task #59) — NOT a separate diar-server image. One image
    # carries both the Python stack and the diar-native Rust binary; this service just
    # overrides the image's default CMD (uvicorn) with the binary. Dockerfile.prod sets
    # no ENTRYPOINT, so `command:` replaces the whole CMD cleanly.
    #
    # Previously `image: diar-server:latest` — an UNQUALIFIED name that Docker resolves
    # to docker.io/library/diar-server, a namespace we do not control. Then
    # `opentranscribe-backend:latest`, which is the DEV-LOCAL build tag: because this
    # overlay is merged LAST, that pinned every self-hosted deployment's diar-native
    # service to an image name that only exists on a maintainer's workstation, and
    # Docker would try to pull docker.io/library/opentranscribe-backend (issue #639).
    #
    # Default to the same published image the prod overlay uses, keyed on the same
    # OT_IMAGE_TAG, so the sidecar and the workers that talk to it are always the same
    # build. opentr.sh exports DIAR_NATIVE_IMAGE for local dev.
    image: ${DIAR_NATIVE_IMAGE:-davidamacey/opentranscribe-backend:${OT_IMAGE_TAG:-latest}}
    command: ["diar-server"]
    # ORT resolves its provider libs relative to the executable's directory AND the
    # process cwd (diar-server has no ELF NEEDED entry for libonnxruntime — it's
    # dlopen'd at runtime). Dockerfile.prod symlinks the provider libs into both
    # /usr/local/bin and this working_dir; they must match.
    working_dir: /opt/diar-native/run
    user: appuser
    environment:
      # Defaults to `cpu` — this file must be safe to load on a CPU-only or --lite host
      # with NO nvidia runtime present (#660). docker-compose.diar-native-gpu.yml (loaded
      # alongside docker-compose.gpu.yml, see the note above the `deploy:` block that used
      # to live here) overrides this same key to `cuda` — compose merges `environment:`
      # BY KEY across files, so that override does not disturb anything else in this list.
      # An operator can still force either mode explicitly via DIAR_NATIVE_MODE (the
      # documented enum is cuda | mps | cpu — see .env.example) regardless of which
      # overlay is loaded.
      #
      # ⚠️ `DIAR_NATIVE_MODE` is COMMENTED OUT in .env.example, and must stay that way. It
      # used to ship as `cuda`, which — being an explicitly-set env var — beat both this
      # file's `:-cpu` fallback and the GPU overlay's override on every deployment that
      # copied the template unmodified, so a CPU-only host got a sidecar it could not
      # start. Uncommenting it there re-breaks that.
      - DIAR_MODE=${DIAR_NATIVE_MODE:-cpu}
      - DIAR_MODELS_DIR=/models
      - DIAR_MAX_INFLIGHT=${DIAR_NATIVE_MAX_INFLIGHT:-2}
      - DIAR_BIND=0.0.0.0:8701
      - SPEAKRS_LAZY_SESSIONS=${DIAR_NATIVE_LAZY_SESSIONS:-1}
      # diar-server 0.3.x emits structured per-request logs (request id, stage timings,
      # device). Before 0.3.0 it installed no tracing subscriber at all and logged
      # nothing — these two are new as of this fix, not a pre-existing knob.
      - RUST_LOG=${DIAR_NATIVE_LOG_LEVEL:-info}
      - DIAR_LOG_FORMAT=${DIAR_NATIVE_LOG_FORMAT:-text}
      # Scoped to THIS service only — never image-wide (see the ORT version-collision
      # note in Dockerfile.prod: Python's onnxruntime-gpu==1.28.0 ships providers with
      # the same filenames as diar's 1.24.2, so the image-wide env must never point at
      # /opt/diar-native/lib). Covers: diar's own ORT libs, plus the CUDA math libs
      # (cudart/cublas/cudnn/cufft/curand) diar-native's own image installed via system
      # apt packages but this shared image gets from the already-installed torch nvidia
      # wheels instead — verified: every CUDA symbol libonnxruntime_providers_cuda.so
      # needs resolves against those wheels, zero unsatisfied sonames.
      - LD_LIBRARY_PATH=/opt/diar-native/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cudnn/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cuda_runtime/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cublas/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/cufft/lib:/home/appuser/.local/lib/python3.13/site-packages/nvidia/curand/lib
    volumes:
      # ONNX/PLDA artifacts exported from pyannote/speaker-diarization-community-1.
      #
      # These are the SAME weights the PyAnnote path uses, obtained the SAME way: the
      # operator's own HUGGINGFACE_TOKEN against the gated HF repo, then exported to
      # ONNX locally. `./opentranscribe.sh` runs that export via
      # scripts/download-models.py (group: diar-native). Nothing here is redistributed
      # by this project — identical to how the PyAnnote weights are acquired today.
      #
      # The default used to be /mnt/nvm/repos/diar-native/models_folded, an absolute
      # path on one maintainer's workstation, which is why no self-hosted deployment
      # could ever start this service (issue #639). Now it follows MODEL_CACHE_DIR like
      # every other model cache in docker-compose.yml.
      - ${DIAR_NATIVE_MODELS_DIR:-${MODEL_CACHE_DIR:-./models}/diar-native}:/models:ro
      - diar-native-tmp:/tmp/diar-native
      # Same transcription-temp volume the celery-worker* services below mount, at the
      # IDENTICAL absolute path — that identity is what lets a worker hand this sidecar a
      # path it wrote (Stage 1's shared-volume WAV) with no translation. Before this, the
      # only volume this container shared with a worker was diar-native-tmp, so /diarize
      # forced a second full re-encode of every recording purely to get past this gap
      # (issue #661). Read-only: the sidecar only ever reads a WAV here, never writes one.
      - transcription-temp:/tmp/transcription:ro
    # ⚠️ NO `deploy.resources.reservations.devices` block here — that used to be
    # hardcoded in this file (`driver: nvidia`, unconditionally), which meant EVERY host
    # loading this overlay was asking Docker to satisfy an nvidia device reservation, CPU-
    # only and --lite hosts included. Compose has no `if`: once a key merges into the
    # final config it is there for every host that loads the file, so the GPU stanza
    # cannot live in the same file as the CPU-safe defaults above (#660).
    #
    # This repo already solves the identical problem for the base stack —
    # docker-compose.gpu.yml carries ALL GPU-specific stanzas for backend/celery-worker,
    # added on top of a GPU-agnostic docker-compose.yml only when opentr.sh's
    # add_gpu_overlay() finds an nvidia runtime (detect_nvidia_runtime,
    # opentranscribe.sh:253-260) and FORCE_CPU_MODE isn't set (opentranscribe.sh:279-290).
    # docker-compose.diar-native-gpu.yml is the sidecar's equivalent: it adds the same
    # `device_ids: ['${DIAR_NATIVE_GPU:-${GPU_DEVICE_ID:-0}}']` reservation this block used
    # to have, plus flips DIAR_MODE to `cuda`, and is meant to be loaded next to
    # docker-compose.gpu.yml.
    #
    # Both front ends append it automatically when they detect an nvidia runtime —
    # `add_diar_native_overlay` in opentr.sh, `get_compose_files` in opentranscribe.sh —
    # keyed off the same probe that selects docker-compose.gpu.yml, so the sidecar can
    # never claim a device the rest of the stack decided not to use. Loading this file
    # alone is the CPU path, and is correct rather than degraded on a GPU-less host.
    restart: unless-stopped   # supervisor: auto-restart (known upstream teardown crash)
    # The backend exports the model set from its FastAPI lifespan and only becomes
    # healthy once that finishes (app/transcription/native_provision.py). Waiting for it
    # is what stops this container starting against an empty /models, where it exits 8
    # into a `restart: unless-stopped` crash loop that also fails `up --wait` — a
    # failure mode reproduced live and documented at opentr.sh:275-281.
    #
    # `service_healthy`, not `service_completed_successfully`: the backend is a
    # long-running service, and its healthcheck already allows a 600 s start_period,
    # comfortably over the 137 s a cold export measured in this image.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8701/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Every worker that can run the diarization stage needs the SAME env + volume as
  # celery-worker below — env vars alone are NOT enough. `env_file: .env` (base
  # docker-compose.yml) reaches every worker automatically, but a compose-level named
  # volume does not: it must be declared per-service. Before this fix, this overlay
  # patched ONLY `celery-worker`, so under --gpu-scale and --gpu-split the handoff WAV
  # was written to a container-local /tmp/diar-native the sidecar could never open,
  # every /diarize call failed, and the pipeline silently degraded to in-process
  # PyAnnote (one easy-to-miss warning line) — making PyAnnote the DE-FACTO diarization
  # engine under both topologies, not the documented fallback (#655).
  #
  # DIARIZER_ENGINE was removed here deliberately: it used to be read ad hoc in three
  # places, and it now selects nothing. Leaving it would have been worse than useless —
  # it defaulted to "python" while the resolved default is "native", so it read as an
  # override that was silently doing the opposite of what it said.
  celery-worker:
    environment:
      - DIAR_NATIVE_URL=http://diar-native:8701
      - DIAR_NATIVE_SHARED_DIR=/tmp/diar-native
    volumes:
      - diar-native-tmp:/tmp/diar-native

  # celery-worker-gpu-scaled (docker-compose.gpu-scale.yml, profile gpu-scale, --gpu-scale
  # flag) consumes the same 'gpu' queue as celery-worker and runs the identical full
  # pipeline — gpu-scale just fans it out across N concurrent threads in one container.
  # Same failure mode as celery-worker above if left unwired.
  celery-worker-gpu-scaled:
    environment:
      - DIAR_NATIVE_URL=http://diar-native:8701
      - DIAR_NATIVE_SHARED_DIR=/tmp/diar-native
    volumes:
      - diar-native-tmp:/tmp/diar-native

  # celery-worker-gpu-diarize (base docker-compose.yml, profile gpu-split, --gpu-split
  # flag) is the diarization half of the multi-GPU split pipeline — it consumes the
  # 'gpu-diarize' queue and runs diarize_gpu_task, which is exactly where the sidecar
  # call happens. This overlay's own comment used to point at a service called
  # "celery-worker-diarize", which does not exist in docker-compose.yml or
  # docker-compose.gpu-split.yml under any profile — corrected to the real name.
  celery-worker-gpu-diarize:
    environment:
      - DIAR_NATIVE_URL=http://diar-native:8701
      - DIAR_NATIVE_SHARED_DIR=/tmp/diar-native
    volumes:
      - diar-native-tmp:/tmp/diar-native

  # celery-worker-gpu-transcribe (base docker-compose.yml, profile gpu-split) consumes
  # the 'gpu-transcribe' queue. Under the shipped topology it hardcodes
  # ENGINE_GPU_SPLIT=true and so normally only runs Stage 2a (transcription), forwarding
  # diarization to celery-worker-gpu-diarize (transcribe_gpu_task's split branch in
  # app/tasks/transcription/core.py). But that branch reads the raw ENGINE_GPU_SPLIT
  # env var per-container, not the admin-editable `engine.gpu_split` DB setting — if
  # those two ever disagree (or a future dispatch change lands a "split disabled" job on
  # this queue), this worker falls through to the SAME full pipeline
  # (`_run_engine_pipeline`, transcribe + diarize) as celery-worker. Wiring the sidecar
  # here too means that fallback degrades correctly instead of reproducing #655.
  celery-worker-gpu-transcribe:
    environment:
      - DIAR_NATIVE_URL=http://diar-native:8701
      - DIAR_NATIVE_SHARED_DIR=/tmp/diar-native
    volumes:
      - diar-native-tmp:/tmp/diar-native

volumes:
  diar-native-tmp:
