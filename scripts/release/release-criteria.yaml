# Release criteria — the single definition of "is this releasable?"
#
# WHY A FILE INSTEAD OF SHELL
#
# The same question gets asked in three places: locally by `./scripts/release.sh`,
# in CI by release-validate.yml, and (later) by an AWS promotion job. If each
# encodes its own idea of "meets the criteria", they will disagree, and the
# disagreement will surface as a release that passed locally and broke in the next
# environment. One file, read by all of them, makes "meets the criteria" mean one
# thing — and makes changing it a reviewable diff rather than an edit in three
# scripts.
#
# It also makes the gates legible to an agent: `release.sh <stage> --json` reports
# per-criterion results keyed by the ids below.
#
# SEVERITY
#   blocking  — a failure stops the stage (overridable only with --force-<stage>,
#               which records the operator and reason in the ledger)
#   warn      — reported, never stops anything
#
# ENVIRONMENTS
# `enforced_in` lists where a criterion is blocking. `local` is this workstation;
# `ci` is release-validate.yml. `test` / `prod` are placeholders for the AWS
# promotion work and are deliberately unused today — they exist so adding an
# environment is a data change, not a redesign.

version: 1

stages:
  # ─── Static checks. No Docker, seconds. ─────────────────────────────────
  preflight:
    description: Everything checkable before anything is built
    criteria:
      - id: version-consistency
        description: VERSION, pyproject, package.json, package-lock (both fields), Alembic single head
        command: python3 scripts/release/check-version-consistency.py --mode ci --json
        severity: blocking
        enforced_in: [local, ci]

      - id: deployment-matrix
        description: Every documented deployment permutation produces a valid compose config
        command: ./scripts/validate-deployments.sh --json
        severity: blocking
        enforced_in: [local, ci]
        expected_duration_s: 20

      - id: clean-worktree
        description: No uncommitted changes — a release must be reproducible from the tag
        severity: blocking
        enforced_in: [local]

      - id: remote-builder
        description: The ARM64 remote builder answers (checked BEFORE the 13.8 GB build starts)
        severity: blocking
        enforced_in: [local]

      - id: docs-build
        description: docs-site builds — catches duplicate blog slugs and undefined authors/tags
        command: npm --prefix docs-site ci && npm --prefix docs-site run build
        severity: blocking
        enforced_in: [ci]
        expected_duration_s: 120

      - id: changelog-section
        description: CHANGELOG.md has a dated section for this version
        severity: warn        # blocking at the `tag` stage, not before
        enforced_in: [local, ci]

  # ─── Test gates. Need the dev stack up. ─────────────────────────────────
  test:
    description: The existing pre-merge gates, run against the release candidate
    criteria:
      - id: integration-suite
        description: The canonical pre-merge gate
        command: ./scripts/run-integration-tests.sh --coverage --e2e-smoke
        severity: blocking
        enforced_in: [local]
        expected_duration_s: 2400

      - id: e2e-suite
        description: Playwright, full suite
        command: ./scripts/e2e/run-e2e.sh
        severity: blocking
        enforced_in: [local]
        expected_duration_s: 1800

      - id: schema-drift
        description: No table- or column-level drift between models and schema
        command: RUN_SCHEMA_DRIFT_TESTS=true backend/venv/bin/pytest backend/tests/unit/test_schema_drift.py
        # warn, not blocking: 4 known pre-existing offenders (3 orphan tables +
        # tag.created_at) each need a migration, not a code change. Flip to
        # blocking once those land.
        severity: warn
        enforced_in: [local]

  # ─── Build and scan. Produces the candidate; publishes nothing. ─────────
  build:
    description: Local build of the release candidate
    criteria:
      - id: images-build
        description: backend, frontend and docs build with the version build-args
        severity: blocking
        enforced_in: [local]
        expected_duration_s: 2700

      - id: version-baked
        description: The built backend reports the version under test, not "unknown"
        severity: blocking
        enforced_in: [local]

  scan:
    description: Vulnerability scan of the LOCALLY BUILT images
    criteria:
      - id: no-critical-cves
        description: Trivy/Grype find no CRITICAL vulnerabilities
        command: SCAN_SOURCE=local FAIL_ON_CRITICAL=true ./scripts/security-scan.sh all
        severity: blocking
        enforced_in: [local]
        expected_duration_s: 600

  # ─── Rehearsal. Requires the live stack STOPPED. ────────────────────────
  rehearse:
    description: Fresh-install and upgrade scenarios against the local candidate
    criteria:
      - id: fresh-install
        description: The documented one-liner produces a working stack
        command: ./scripts/release-tests/test-fresh-install.sh --yes
        severity: blocking
        enforced_in: [local]
        expected_duration_s: 4500

      - id: upgrade-from-previous
        description: Data survives, migrations apply, the NEW version is running
        command: REQUIRE_PREVIOUS=1 ./scripts/release-tests/test-upgrade.sh --yes
        severity: blocking
        enforced_in: [local]
        expected_duration_s: 7200

  # ─── Publish. Everything past here touches the outside world. ───────────
  publish:
    description: Multi-arch build and push of :vX.Y.Z (never :latest)
    criteria:
      - id: both-arches-published
        description: The published manifest lists linux/amd64 AND linux/arm64
        severity: blocking
        enforced_in: [local]

  promote:
    description: Move :latest to the validated digest
    criteria:
      - id: digest-identical
        description: :latest and :vX.Y.Z resolve to the same digest (copy, never rebuild)
        severity: blocking
        enforced_in: [local]

  finish:
    description: Publish the GitHub release — the switch the installer reads
    criteria:
      - id: ci-green
        description: release-validate.yml passed for this tag's SHA
        severity: blocking
        enforced_in: [local]

      - id: manifest-reachable
        description: Every release-manifest.txt path is fetchable at the tag
        severity: blocking
        enforced_in: [local, ci]

# Ordering. The reasoning that must not be lost:
#
#   build -> scan -> rehearse -> publish
#     Validated bytes reach Docker Hub only after the scenarios pass, because
#     :latest is what every existing user pulls.
#
#   tag before publish
#     So CI validates the metadata while the 13.8 GB build runs.
#
#   promote and finish LAST
#     The GitHub release is what the installer resolves for "latest". There must
#     never be a window where releases/latest names a version whose images do not
#     exist yet.
order:
  - preflight
  - bump
  - verify
  - test
  - build
  - scan
  - rehearse
  - tag
  - publish
  - smoke
  - promote
  - finish
